<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><base href="../../dist/"><link rel="stylesheet" href="styles/app.bundle.css"></head>
<body><div id="root" class="app-ui"></div>
<script src="vendor/react.production.min.js"></script><script src="vendor/react-dom.production.min.js"></script>
<script type="module">
import {ProductLibraryWorkspace} from './src/components/ProductLibraryWorkspace.js';
import {SupplierDocumentImport} from './src/components/SupplierDocumentImport.js';
import {emptyVault} from './src/lib/defaults.js';
import {setUiLanguage} from './src/lib/i18n.js';
import {registerVaultMutationBridge} from './src/storage/vault-mutation-bridge.js';

const params=new URLSearchParams(location.search);
const language=params.get('lang')==='ar'?'ar':'en';
const mode=params.get('mode')==='supplier'?'supplier':'products';
setUiLanguage(language);document.documentElement.lang=language;document.documentElement.dir=language==='ar'?'rtl':'ltr';
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));

window.importAttempts=0;
class ProductHarness extends React.Component{
  state={items:[]};
  saveMany=async items=>{window.importAttempts+=1;await delay(120);this.setState({items});};
  render(){window.productState=()=>this.state.items.map(item=>({...item}));return React.createElement(ProductLibraryWorkspace,{items:this.state.items,currency:'USD',onSave:async()=>{},onDelete:async()=>{},onSaveMany:this.saveMany});}
}

let vault=emptyVault();window.supplierSaveAttempts=0;
registerVaultMutationBridge(async mutation=>{window.supplierSaveAttempts+=1;await delay(120);vault=mutation(vault);return vault;});
window.supplierVaultState=()=>structuredClone(vault);

ReactDOM.render(mode==='supplier'?React.createElement('main',{style:{padding:'20px'}},React.createElement(SupplierDocumentImport,{language})):React.createElement(ProductHarness),document.getElementById('root'));
</script></body></html>
