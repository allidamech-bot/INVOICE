<!doctype html>
<html lang="en" data-lourex-document-editor="qa-document">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="../../dist/">
  <title>v339 sign-out guard</title>
</head>
<body>
  <section class="ta-cloud-account">
    <div id="editable-state">Document editor active</div>
    <footer class="ta-cloud-account-actions"><button id="signout" type="button">Sign Out</button></footer>
  </section>
  <script>
    window.__qaCurrentUid='account-a';
    window.firebase={auth:()=>({get currentUser(){return window.__qaCurrentUid?{uid:window.__qaCurrentUid}:null;}})};
    window.__qaSignOutCalls=0;
    window.__qaTransitionCalls=0;
    window.__qaTransitionComplete=[];
  </script>
  <script src="runtime-safety-v334.js?v=334"></script>
  <script>
    document.getElementById('signout').addEventListener('click',()=>{window.__qaSignOutCalls+=1;});
    window.addEventListener('lourex-account-transition-request',()=>{window.__qaTransitionCalls+=1;});
    window.addEventListener('lourex-account-transition-complete',event=>{window.__qaTransitionComplete.push(event.detail||{});});
  </script>
</body>
</html>
