<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><base href="../../dist/"><link rel="stylesheet" href="styles/app.bundle.css"></head>
<body><div id="root" class="app-ui"></div>
<script src="vendor/react.production.min.js"></script><script src="vendor/react-dom.production.min.js"></script>
<script type="module">
import { AppShell } from './src/components/AppShell.js';
import { EditorPage } from './src/components/EditorPage.js';
import { createBlankDocument } from './src/lib/documents.js';
import { defaultAppSettings, defaultCompany, emptyVault, customerSnapshotFrom } from './src/lib/defaults.js';
import { blankCustomer } from './src/components/CustomersPage.js';
import { calculateProfitability } from './src/lib/profitability.js';
import { mergeVaultIntent } from './src/storage/vault-merge.js';
import { setUiLanguage } from './src/lib/i18n.js';

setUiLanguage('en');
const params=new URLSearchParams(location.search);
const mismatched=params.get('scenario')==='missing-currency';
const vaultKey='lourex-22a-isolated-qa-vault';
const company=defaultCompany();
company.nameEn='LOUREX QA — SYNTHETIC ONLY';
company.defaultCurrency='USD';
const customer={...blankCustomer(),id:'qa-only-customer',companyNameEn:'Synthetic Customer',companyNameAr:'',contactPerson:'QA',
  addressEn:'Test Avenue',addressAr:'',city:'Test City',country:'Test Country',phone:'',email:'test@example.test',
  vatTaxNumber:'',commercialRegistration:''};
const timestamp='2026-10-25T11:00:00.000Z';
const saved=(id,name,cost,costCurrency)=>({
  id,sku:id,createdAt:timestamp,updatedAt:timestamp,descriptionEn:name,descriptionAr:'',hsCode:'',
  origin:'',packing:'',unit:'PCS',lastUnitPrice:'14.00',lastCurrency:'USD',
  lastUnitCost:cost,lastCostCurrency:costCurrency,inventoryTracking:'tracked',
  usageCount:0,lastUsedAt:timestamp
});
const catalog=[
  saved('A','QA A Product','5.00','USD'),
  saved('B','QA B Product','8.00',mismatched?'EUR':'USD')
];
let vault;
const readCached=()=>{try{return JSON.parse(sessionStorage.getItem(vaultKey)||'null');}catch{return null;}};
const cached=readCached();
if(cached){vault=cached;}else{
  vault=emptyVault();
  const draft=createBlankDocument('invoice','INV-QA-22A-VISUAL',company);
  draft.language='en';draft.currency='USD';draft.customerSnapshot=customerSnapshotFrom(customer);
  draft.items=[{...draft.items[0],id:'qa-only-line',savedItemId:'A',skuSnapshot:'A',stockTreatment:'tracked',
    descriptionEn:'QA A Product',descriptionAr:'',unit:'PCS',quantity:'2',unitPrice:'10.00',unitCost:'5.00'}];
  vault.documents=[draft];
}
let current=vault.documents[0];
window.qa22aInit={id:current.items[0].savedItemId,cost:current.items[0].unitCost,mismatched};
window.qa22aSaved=null;
window.qa22aSaveCount=0;
window.qa22aCurrent=()=>JSON.parse(JSON.stringify(vault.documents[0]));
window.qa22aSummary=()=>calculateProfitability(vault.documents[0]);
const noop=()=>{},asyncNoop=async()=>{};
const props={
  document:current,documents:[current],customers:[customer],suppliers:[],
  company,savedItems:catalog,payments:[],documentEvents:[],documentRevisions:[],
  smartDefaults:defaultAppSettings().smartDefaults,
  onClose:noop,
  onSave:async(value)=>{
    const intent={...vault,documents:[value]};
    vault=mergeVaultIntent(vault,intent,vault);
    sessionStorage.setItem(vaultKey,JSON.stringify(vault));
    window.qa22aSaved=window.qa22aCurrent();
    window.qa22aSaveCount+=1;
  },
  onSaveCustomer:asyncNoop,onSaveSavedItem:asyncNoop,onSaveDocumentItem:asyncNoop,
  onUseSavedItems:asyncNoop,onDeleteSavedItem:asyncNoop,onSaveSmartDefaults:asyncNoop,
  onSavePayment:asyncNoop,onDeletePayment:asyncNoop,onBeginRevision:async value=>value,
  onDiscardRevision:asyncNoop,onVoidDocument:asyncNoop,onCreateCreditNote:asyncNoop,
  onConvert:asyncNoop,onPrint:asyncNoop
};
ReactDOM.render(
  React.createElement(AppShell,{
    screen:'editor',logoDataUrl:'./brand/lourex-logo.svg',language:'en',
    newMenu:false,cloudState:'synced',cloudLabel:'QA only',cloudMessage:'',
    onNavigate:noop,onToggleNew:noop,onNew:noop,onSettings:noop,onCloud:noop
  },React.createElement(EditorPage,props)),
  document.getElementById('root')
);
</script></body></html>
