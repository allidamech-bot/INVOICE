<!doctype html>
<html lang="ar" dir="rtl" data-ui-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- v176 is now a retirement/compatibility checkpoint. Exercise the current
       production cascade instead of reconstructing the removed 6000/7000 z-index
       generation that the application no longer emits. -->
  <link rel="stylesheet" href="../../dist/styles/app.bundle.css">
  <style>
    html,body{margin:0;width:100%;min-height:100%;font-family:Outfit,"Noto Sans Arabic",Arial,sans-serif}
    *{box-sizing:border-box}
    .app-ui{min-height:100dvh}
    .fixture-page{min-height:100dvh;padding:18px 12px 96px}
    .fixture-card{max-width:520px;margin:0 auto;padding:18px;border:1px solid var(--ft-line);border-radius:18px;background:var(--ft-surface);color:var(--ft-text)}
    .fixture-card h1{margin:0 0 10px;font-size:20px}.fixture-card p{margin:0;line-height:1.7}
    .modal-message{font-size:14px}
  </style>
</head>
<body>
  <div class="app-ui">
    <main class="fixture-page">
      <section class="fixture-card">
        <h1>العملاء</h1>
        <p>تفاصيل عميل طويلة لاختبار التفاف النص ومنع أي تمدد أفقي على الشاشات الضيقة.</p>
      </section>
    </main>

    <div class="modal-backdrop" data-testid="backdrop">
      <section class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="fixture-title">
        <header class="modal-header">
          <h2 id="fixture-title">حذف العميل؟</h2>
          <button class="icon-btn" type="button" aria-label="إغلاق">×</button>
        </header>
        <div class="modal-body">
          <p class="modal-message">سيتم حذف هذا العميل من القائمة. لا يمكن التراجع عن هذا الإجراء بعد التأكيد.</p>
        </div>
        <footer class="modal-footer">
          <div class="modal-footer-actions">
            <button class="btn" type="button" data-cancel>إلغاء</button>
            <button class="btn btn-danger" type="button" data-delete>حذف العميل نهائيًا</button>
          </div>
        </footer>
      </section>
    </div>
  </div>
</body>
</html>
