<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../dist/"><link rel="stylesheet" href="styles/app.bundle.css"><link rel="stylesheet" href="styles/document-electronic-copy.css"></head><body><div id="root"><div class="app-root"><div id="management" class="app-ui"></div><div id="print-output" class="print-portal"></div></div></div><script src="vendor/react.production.min.js"></script><script src="vendor/react-dom.production.min.js"></script><script src="ios-print-bridge.js"></script><script type="module">
import {createBlankDocument} from './src/lib/documents.js';
import {defaultCompany,emptyVault,customerSnapshotFrom} from './src/lib/defaults.js';
import {blankCustomer} from './src/components/CustomersPage.js';
import {TemplateRenderer} from './src/templates/TemplateRenderer.js';
import {ElectronicDocumentManager} from './src/components/ElectronicDocumentManager.js';
import {setUiLanguage} from './src/lib/i18n.js';
import {createSupplier,supplierSnapshotFrom} from './src/lib/operations.js';
import {calculateTotals} from './src/lib/money.js';
const q=new URLSearchParams(location.search),lang=q.get('lang')||'en';setUiLanguage(lang);document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
const rows=new Map();window.qaRecords=rows;window.qaPrints=[];window.qaErrors=[];let queue=Promise.resolve();
const ref=path=>({path,collection:name=>ref(path+'/'+name),doc:name=>ref(path+'/'+name),get:async()=>({exists:rows.has(path),data:()=>rows.get(path)}),update:async patch=>Object.assign(rows.get(path),patch)});
const db={collection:name=>ref(name),runTransaction:async fn=>{let release;const old=queue;queue=new Promise(r=>release=r);await old;try{const pending=[];const value=await fn({get:r=>r.get(),set:(r,v)=>pending.push([r.path,v])});for(const [path,v] of pending)rows.set(path,v);return value;}finally{release();}}};
window.firebase={apps:[{name:'[DEFAULT]'}],auth:()=>({currentUser:{uid:'synthetic-qa-owner',email:'qa@example.test'}}),firestore:Object.assign(()=>db,{Timestamp:{fromDate:d=>d},FieldValue:{serverTimestamp:()=>new Date()}})};
// Dynamic import resolves from the module's URL on WebKit rather than the document base.
const {App}=await import(new URL('../../dist/src/app/App.js',location.href).href);
const company=defaultCompany();company.nameEn='LOUREX synthetic QA';company.nameAr='لوركس تجريبي';
const kind=q.get('kind')==='purchase-order'?'purchase-order':'invoice';
const doc=createBlankDocument(kind,kind==='invoice'?'INV-LONG-APP-QA-2026':'PO-LONG-APP-QA-2026',company);
doc.id='synthetic-long-app-'+kind;doc.status='final';doc.language=lang;doc.appearance.templateId=q.get('template')||'obsidian';doc.currency='USD';doc.issueDate='2026-10-16';doc.dueDate='2026-10-30';
doc.customerSnapshot=customerSnapshotFrom({...blankCustomer(),id:'buyer',companyNameEn:'QA Synthetic Customer',companyNameAr:'عميل تجريبي صناعي'});
const supplier={...createSupplier(),id:'synthetic-supplier',nameEn:'QA Synthetic Supplier',nameAr:'مورد تجريبي صناعي',defaultCurrency:'USD'};
doc.supplierSnapshot=kind==='purchase-order'?supplierSnapshotFrom(supplier):null;
doc.items=Array.from({length:40},(_,i)=>({...doc.items[0],id:'long-line-'+i,
 sku:'QA-'+String(i+1).padStart(3,'0'),
 descriptionEn:'LONG-ITEM-'+String(i+1).padStart(3,'0')+' Synthetic industrial component quality verification delivery requirements. '.repeat(3),
 descriptionAr:'بند'+String(i+1).padStart(3,'0')+' مجموعة أدوات صناعية تجريبية لمراجعة مواصفات التسليم والتحقق من الجودة. '.repeat(3),
 quantity:'1',unit:'CTN',unitPrice:'10.00',stockTreatment:'non-stock',savedItemId:''}));
doc.adjustments={...doc.adjustments,discountEnabled:false,shippingEnabled:false,otherChargesEnabled:false,taxEnabled:true,taxPercent:'10'};
window.qaTotal=calculateTotals(doc.items,doc.adjustments).grandTotal;
window.qaSourceSnapshot=()=>JSON.stringify(doc);
const vault=emptyVault();vault.documents=[doc];vault.company=company;
const app=new App({});app.state={...app.state,unlocked:true,vault};
app.setState=(patch,callback)=>{app.state={...app.state,...patch};if(patch.printDoc)ReactDOM.render(React.createElement(TemplateRenderer,{document:patch.printDoc,electronicShareId:patch.printShareId,scale:1}),document.getElementById('print-output'),callback);else callback?.();};
app.showToast=(text,tone)=>{if(tone==='error')window.qaErrors.push(text);};window.__LOUREX_PREPARE_PDF__=()=>{};
window.print=()=>{window.qaPrints.push(document.querySelector('#print-output .lx-document-qr')?.href||'');};
window.qaNormalOutput=mode=>app.requestPrint(doc,mode);window.qaKind=kind;window.qaTemplate=doc.appearance.templateId;window.qaChangeQuantity=()=>{doc.items[0].quantity='15';doc.revision=2;};window.qaDocument=doc;
window.qaManage=()=>{document.body.classList.remove('printing');ReactDOM.render(React.createElement(ElectronicDocumentManager,{open:true,document:doc,events:[],onClose:()=>ReactDOM.unmountComponentAtNode(document.getElementById('management')),onOutput:()=>app.requestPrint(doc,'pdf')}),document.getElementById('management'));};
window.qaReady=true;
</script></body></html>
