<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<base href="../../dist/"/>
<link rel="stylesheet" href="styles/app.bundle.css"/>
<script>
 const q=new URLSearchParams(location.search);
 document.documentElement.lang=q.get('lang')==='ar'?'ar':'en';
 document.documentElement.dir=q.get('lang')==='ar'?'rtl':'ltr';
 document.documentElement.setAttribute('data-ui-theme',q.get('theme')==='light'?'light':'dark');
</script>
</head>
<body><div id="root" class="app-ui"></div>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script type="module">
import {WarehouseLocationsPage} from './src/components/WarehouseLocationsPage.js';
import {defaultWarehouseId} from './src/lib/warehouses.js';
import {setUiLanguage} from './src/lib/i18n.js';
const q=new URLSearchParams(location.search),ar=q.get('lang')==='ar',h=React.createElement;
setUiLanguage(ar?'ar':'en');
const now='2026-10-01T12:00:00.000Z';
const branchId='branch-test',workspaceId='workspace-test';
const warehouses=[
 {id:defaultWarehouseId(branchId),name:'Primary distribution warehouse',code:'MAIN',branchId,workspaceId,active:true,createdAt:now,updatedAt:now},
 {id:'overflow',name:'Remote warehouse long-name demonstration',code:'WH-02',branchId,workspaceId,active:true,createdAt:now,updatedAt:now},
 {id:'archived',name:'Archived warehouse historical records',code:'ARC',branchId,workspaceId,active:false,createdAt:now,updatedAt:now},
];
const items=Array.from({length:3},(_,i)=>({
 id:'p'+i,descriptionEn:'Industrial supply '+i,descriptionAr:'صنف صناعي '+i,
 sku:'SKU-00'+i,unit:'PCS',createdAt:now,updatedAt:now,usageCount:0,lastUsedAt:now,
 origin:'',packing:'',hsCode:'',lastUnitPrice:'100',lastCurrency:'USD',lastUnitCost:'20',lastCostCurrency:'USD'
}));
ReactDOM.render(h(WarehouseLocationsPage,{warehouses,items,inventoryMovements:[],branchId,workspaceId}),document.getElementById('root'));
</script>
</body>
</html>
