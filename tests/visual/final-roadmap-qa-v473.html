<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><base href="../../dist/"><link rel="stylesheet" href="styles/app.bundle.css"><style>.qa-shell{min-height:100vh;padding:12px;box-sizing:border-box}.qa-card{padding:14px;border:1px solid var(--ft-border,#dbe3ef);border-radius:16px;background:var(--ft-surface,#fff);display:grid;gap:10px}.qa-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.qa-field{display:grid;gap:6px}.qa-field input,.qa-field select,.qa-field textarea,.qa-button{min-height:44px;font-size:16px;box-sizing:border-box;width:100%}.qa-button{border-radius:12px;border:1px solid var(--ft-border,#cbd5e1);padding:0 14px}.qa-list{display:grid;gap:8px}.qa-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px;border:1px solid var(--ft-border,#dbe3ef);border-radius:12px}.qa-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.qa-kpis .qa-card strong{font-size:20px}@media(max-width:720px){.qa-grid,.qa-kpis{grid-template-columns:1fr}.qa-row{align-items:flex-start;flex-direction:column}.qa-actions{display:grid;grid-template-columns:1fr 1fr;width:100%;gap:8px}}html[dir="rtl"] .qa-shell{text-align:right}</style></head>
<body><main id="root" class="qa-shell"></main><script>
const q=new URLSearchParams(location.search),mode=q.get('mode')||'treasury',ar=q.get('lang')==='ar';document.documentElement.dir=ar?'rtl':'ltr';document.documentElement.lang=ar?'ar':'en';const root=document.getElementById('root');
const field=(label,kind='input')=>`<label class="qa-field"><span>${label}</span>${kind==='select'?'<select><option>USD Bank</option><option>Cash USD</option></select>':kind==='textarea'?'<textarea rows="2"></textarea>':'<input value="1000.00">'}</label>`;
if(mode==='treasury')root.innerHTML=`<section class="ta-finance-page"><header class="ta-page-header"><div><span class="ta-page-kicker">${ar?'النقد والبنوك':'Cash & Bank'}</span><h2>${ar?'دفتر الخزينة الفعلي':'Real treasury ledger'}</h2><p>${ar?'الأرصدة من القيود الصريحة فقط.':'Balances come from explicit entries only.'}</p></div></header><div class="qa-kpis"><article class="qa-card"><span>USD Bank</span><strong>$1,250.25</strong></article><article class="qa-card"><span>Cash USD</span><strong>$300.00</strong></article><article class="qa-card"><span>${ar?'مطابقة':'Reconciled'}</span><strong>8</strong></article></div><div class="qa-grid"><article class="qa-card"><h3>${ar?'حساب دفتر':'Ledger account'}</h3>${field(ar?'الاسم':'Label')}${field(ar?'العملة':'Currency')}<button class="qa-button">${ar?'إنشاء الحساب':'Create account'}</button></article><article class="qa-card"><h3>${ar?'قيد خزينة':'Treasury entry'}</h3>${field(ar?'من حساب':'From account','select')}${field(ar?'إلى حساب':'To account','select')}${field(ar?'المبلغ':'Amount')}<button class="qa-button">${ar?'تسجيل القيد':'Record entry'}</button></article></div><article class="qa-card"><h3>${ar?'سجل الدفتر':'Ledger history'}</h3><div class="qa-list"><div class="qa-row"><div><strong>${ar?'تحصيل عميل':'Customer collection'} · USD 500.00</strong><small>2026-10-01 · INV-2026-0001</small></div><div class="qa-actions"><button class="qa-button">${ar?'مطابقة':'Reconcile'}</button><button class="qa-button">${ar?'إلغاء':'Void'}</button></div></div></div></article></section>`;
if(mode==='fx')root.innerHTML=`<section class="ta-finance-page"><header class="ta-page-header"><div><span class="ta-page-kicker">${ar?'العملات وأسعار الصرف':'FX & Exchange Rates'}</span><h2>${ar?'سجل أسعار صرف مؤرخ':'Dated exchange-rate register'}</h2><p>${ar?'لا تحويل صامت.':'No silent conversion.'}</p></div></header><div class="qa-grid"><article class="qa-card"><h3>${ar?'إضافة سعر':'Add dated rate'}</h3>${field(ar?'التاريخ':'Date')}${field(ar?'العملة الأساس':'Base currency')}${field(ar?'المصدر':'Source')}<button class="qa-button">${ar?'حفظ السعر':'Save rate'}</button></article><article class="qa-card"><h3>${ar?'تحويل صريح':'Explicit conversion'}</h3>${field(ar?'من':'From','select')}${field(ar?'إلى':'To','select')}${field(ar?'المبلغ':'Amount')}<strong>TRY 42,000.00</strong><small>2026-10-01 · Bank bulletin</small></article></div><article class="qa-card"><h3>${ar?'سجل الأسعار':'Rate history'}</h3><div class="qa-row"><div><strong>1 USD = 42.00 TRY</strong><small>2026-10-01 · Bank bulletin</small></div><button class="qa-button">${ar?'حذف':'Delete'}</button></div></article></section>`;
if(mode==='stock')root.innerHTML=`<section class="ta-operations-page"><header class="ta-page-header"><div><span class="ta-page-kicker">${ar?'المستودعات ومواقع المخزون':'Warehouses & Stock Locations'}</span><h2>${ar?'مواقع مخزون مبنية على الفروع':'Branch-backed stock locations'}</h2><p>${ar?'تتبع من وإلى لكل تحويل.':'From / To traceability for every transfer.'}</p></div></header><div class="qa-grid"><article class="qa-card"><h3>${ar?'تحويل مخزون':'Transfer stock'}</h3>${field(ar?'الصنف':'Product','select')}${field(ar?'من موقع':'From location','select')}${field(ar?'إلى موقع':'To location','select')}${field(ar?'الكمية':'Quantity')}<button class="qa-button">${ar?'تحويل':'Transfer stock'}</button></article><article class="qa-card"><h3>${ar?'الرصيد حسب الموقع':'Balance by location'}</h3><div class="qa-row"><strong>Istanbul</strong><span>10 PCS</span></div><div class="qa-row"><strong>Jeddah</strong><span>4 PCS</span></div><small>${ar?'المحجوز: غير ممثل بعد':'Reserved: not represented yet'}</small></article></div><article class="qa-card"><h3>${ar?'سجل التحويلات':'Transfer history'}</h3><div class="qa-row"><div><strong>Product A</strong><small>Istanbul → Jeddah · 2026-10-01</small></div><strong>4 PCS</strong></div></article></section>`;
</script></body></html>
