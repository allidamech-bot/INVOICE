<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><base href="../../dist/"><link rel="stylesheet" href="styles/app.bundle.css"></head>
<body><div id="root" class="app-ui"></div><script src="vendor/react.production.min.js"></script><script src="vendor/react-dom.production.min.js"></script><script type="module">
import {SavedItemsModal} from './src/components/SavedItemsModal.js';
import {setUiLanguage} from './src/lib/i18n.js';
const params=new URLSearchParams(location.search),ar=params.get('lang')==='ar',h=React.createElement;
setUiLanguage(ar?'ar':'en');
document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';
const now=new Date().toISOString();
const items=[
{id:'bev',createdAt:now,updatedAt:now,sku:'BEV-001',descriptionEn:'Sparkling Drink',descriptionAr:'مشروب غازي',hsCode:'220210',origin:'Türkiye',packing:'24 × 250 ml / Carton',unit:'Carton',lastUnitPrice:'18',lastCurrency:'USD',usageCount:12,lastUsedAt:now,category:'Beverages',tags:['Drink'],favorite:false},
{id:'custom',createdAt:now,updatedAt:now,sku:'CUS-001',descriptionEn:'Custom Valve',descriptionAr:'صمام مخصص',hsCode:'848180',origin:'Türkiye',packing:'Box',unit:'PCS',lastUnitPrice:'25',lastCurrency:'USD',usageCount:8,lastUsedAt:now,category:'Custom Industrial',tags:['Industrial'],favorite:false}
];
class Fixture extends React.Component{
 state={items};
 save=async item=>{window.savedItem=item;this.setState(s=>({items:s.items.map(entry=>entry.id===item.id?item:entry)}));};
 render(){return h(SavedItemsModal,{open:true,items:this.state.items,currency:'USD',onClose:()=>{},onSave:this.save,onDelete:async()=>{},onSelectMany:async selected=>{window.selectedItems=selected;}});}
}
ReactDOM.render(h(Fixture),document.getElementById('root'));
</script></body></html>
