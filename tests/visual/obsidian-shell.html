<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <base href="../../dist/">
  <link rel="stylesheet" href="styles/app.bundle.css">
  <link rel="stylesheet" href="ai-composer-v449.css?v=449-1">
  <link rel="stylesheet" href="styles/v331-draft-scroll-recovery.css?v=337-3" data-lourex-qa-runtime-document-owner="true">
  <style>.shell-fixture{min-height:1100px;padding:28px}.shell-fixture-card{max-width:760px;min-height:220px;padding:24px;border:1px solid var(--ds-line);border-radius:var(--ds-radius-card);background:var(--ds-surface)}.shell-create-button{transition:none!important}@media(max-width:960px){.shell-fixture{padding:18px 14px}.shell-fixture-card{min-height:700px}.lourex-ai-panel:not([data-v449-qa-ready="true"]){visibility:hidden!important}}</style>
</head>
<body><div id="root" class="app-ui"></div>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="lourex-ai-workflows.js?v=1"></script>
<script src="ai-composer-v449.js?v=449-1"></script>
<script>
  (()=>{
    let checked=false;
    let checking=false;
    const validate=()=>{
      if(checked||checking||innerWidth>720)return;
      const panel=document.querySelector('.lourex-ai-panel');
      const plus=panel?.querySelector('.lourex-ai-composer-plus');
      const mic=panel?.querySelector('.lourex-ai-composer-mic');
      const send=panel?.querySelector('.lourex-ai-send');
      if(!(panel&&plus&&mic&&send))return;
      checking=true;
      const fail=error=>{
        checked=true;
        checking=false;
        panel.dataset.v449QaReady='true';
        const message=String(error instanceof Error?error.message:error);
        window.shellQaAiComposer={checked:false,error:message};
        console.error(`v449 composer QA: ${message}`);
      };
      try{
        const controls=[['plus',plus],['microphone',mic],['send',send]];
        for(const [name,node] of controls){
          const r=node.getBoundingClientRect();
          if(r.width<43.5||r.height<43.5){fail(`v449 ${name} touch target ${r.width}x${r.height}`);return;}
        }
        const plusSvg=plus.querySelector('svg');
        const micSvg=mic.querySelector('svg');
        if(!plusSvg||getComputedStyle(plusSvg).stroke==='none'){fail('v449 plus icon is not visibly stroked');return;}
        if(!micSvg||getComputedStyle(micSvg).stroke==='none'){fail('v449 microphone icon is not visibly stroked');return;}
        plus.click();
        requestAnimationFrame(()=>requestAnimationFrame(()=>{
          try{
            const menu=panel.querySelector('.lourex-ai-plus-menu');
            if(!(menu instanceof HTMLElement)||menu.hidden){fail('v449 plus menu did not open');return;}
            const r=menu.getBoundingClientRect();
            if(r.left<-1||r.right>innerWidth+1||r.top<-1||r.bottom>innerHeight+1){fail(`v449 plus menu escaped viewport ${JSON.stringify({left:r.left,right:r.right,top:r.top,bottom:r.bottom})}`);return;}
            if(menu.scrollWidth>menu.clientWidth+2){fail(`v449 plus menu horizontal overflow ${menu.scrollWidth}>${menu.clientWidth}`);return;}
            const items=menu.querySelectorAll('.lourex-ai-plus-item');
            if(items.length<10){fail(`v449 plus menu exposes only ${items.length} tools`);return;}
            checked=true;
            checking=false;
            panel.dataset.v449QaReady='true';
            window.shellQaAiComposer={checked:true,itemCount:items.length,menu:{left:r.left,right:r.right,top:r.top,bottom:r.bottom},controls:Object.fromEntries(controls.map(([name,node])=>{const box=node.getBoundingClientRect();return[name,{width:box.width,height:box.height}];}))};
          }catch(error){fail(error);}
        }));
      }catch(error){fail(error);}
    };
    new MutationObserver(validate).observe(document.documentElement,{childList:true,subtree:true});
    addEventListener('resize',validate);
    validate();
  })();
</script>
<script type="module">
  import {AppShell} from './src/components/AppShell.js';
  import {GlobalSearch} from './src/components/GlobalSearch.js';
  import {setUiLanguage} from './src/lib/i18n.js';
  const params=new URLSearchParams(location.search);
  const ar=params.get('lang')==='ar';
  const conflict=params.get('conflict')==='1';
  setUiLanguage(ar?'ar':'en');
  const h=React.createElement;
  window.shellQa={settings:0,account:0,newKind:'',credit:0,statement:0,navigations:[]};
  class Fixture extends React.Component{
    state={newMenu:false,screen:'home'};
    componentDidMount(){this.outsideCreatePointer=event=>{if(!this.state.newMenu)return;const target=event.target;if(target instanceof Element&&target.closest('.ta-create-menu, .new-doc-menu'))return;this.setState({newMenu:false});};document.addEventListener('pointerdown',this.outsideCreatePointer);}
    componentWillUnmount(){document.removeEventListener('pointerdown',this.outsideCreatePointer);}
    render(){return h(React.Fragment,null,
      h(AppShell,{screen:this.state.screen,logoDataUrl:'./brand/lourex-logo.svg',language:ar?'ar':'en',newMenu:this.state.newMenu,cloudState:conflict?'conflict':'synced',cloudLabel:conflict?(ar?'تعارض مزامنة':'Sync conflict'):(ar?'محفوظ سحابيًا':'Saved to cloud'),cloudMessage:conflict?(ar?'يحتوي هذا الجهاز والسحابة على تعديلات أحدث. لم يتم استبدال أي نسخة.':'This device and the cloud both contain newer changes. Neither copy was overwritten.'):(ar?'السحابة محدثة.':'Cloud is up to date.'),onNavigate:screen=>{window.shellQa.navigations.push(screen);this.setState({screen});},onToggleNew:()=>this.setState(state=>({newMenu:!state.newMenu})),onNew:kind=>{window.shellQa.newKind=kind;this.setState({newMenu:false});},onCreditNote:()=>{window.shellQa.credit+=1;this.setState({newMenu:false});},onStatementAccount:()=>{window.shellQa.statement+=1;this.setState({newMenu:false});},onSettings:()=>{window.shellQa.settings+=1;},onCloud:()=>{window.shellQa.account+=1;}},h('main',{className:'shell-fixture'},h('section',{className:'shell-fixture-card'},h('h1',null,ar?'نظرة عامة على الأعمال':'Business overview'),h('p',null,ar?'المحتوى يبقى واضحًا وقابلًا للوصول على جميع الأجهزة.':'Content remains clear and reachable on every device.')))),
      h(GlobalSearch,{documents:[],customers:[],items:[],suppliers:[],purchases:[],language:ar?'ar':'en',onNavigate:screen=>{window.shellQa.navigations.push(screen);this.setState({screen});},onOpenDocument:()=>{},onNewDocument:kind=>{window.shellQa.newKind=kind;}})
    );}
  }
  ReactDOM.render(h(Fixture),document.getElementById('root'));
</script></body></html>
