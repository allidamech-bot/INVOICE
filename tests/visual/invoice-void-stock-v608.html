<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><base href="../../dist/"><link rel="stylesheet" href="styles/app.bundle.css"></head>
<body><div id="root"><div class="app-ui"><div class="ta-shell"><main class="ta-main"><div id="invoice-void-fixture"></div></main></div></div></div>
<script src="vendor/react.production.min.js"></script><script src="vendor/react-dom.production.min.js"></script>
<script type="module">
import {DocumentLifecyclePanel} from './src/components/DocumentLifecyclePanel.js';

 lastCurrency:'USD',lastUnitCost:'5.25',lastCostCurrency:'USD',usageCount:0,lastUsedAt:now,

}
