<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><base href="../../dist/"><link rel="stylesheet" href="styles/app.bundle.css"><link rel="stylesheet" href="styles/v482-mobile-ux-repair.css"></head><body><div id="root"><div class="app-ui" id="visual-app"></div></div><script src="vendor/react.production.min.js"></script><script src="vendor/react-dom.production.min.js"></script><script type="module">
import {TreasuryLedgerPage} from './src/components/TreasuryLedgerPage.js';
import {emptyVault} from './src/lib/defaults.js';
import {createBlankDocument} from './src/lib/documents.js';
import {normalizePaymentRecord} from './src/lib/payments.js';
import {createTreasuryAccount} from './src/lib/treasury-ledger.js';
import {registerVaultMutationBridge} from './src/storage/vault-mutation-bridge.js';
import {saveVault} from './src/storage/vault.js';
import {getEncryptedVault,activateAccountStorage} from './src/storage/db.js';

import {setUiLanguage} from './src/lib/i18n.js';
const lang=new URLSearchParams(location.search).get('lang')==='ar'?'ar':'en';setUiLanguage(lang);document.documentElement.dataset.uiTheme='dark';
const vault=emptyVault(),account=createTreasuryAccount({label:'Main Bank',kind:'bank',currency:'USD',workspaceId:'default',branchId:'main'});vault.treasuryAccounts=[account];const invoice=createBlankDocument('invoice','INV-QA-7',vault.company);invoice.status='final';invoice.customerSnapshot={sourceCustomerId:'c1',companyNameEn:'Atlas',companyNameAr:'أطلس'};invoice.items=[{...invoice.items[0],descriptionEn:'Valve',quantity:'10',unitPrice:'10'}];vault.documents=[invoice];vault.payments=[normalizePaymentRecord(invoice,[],{id:'p1',amount:'30.00',date:invoice.issueDate,method:'bank-transfer',reference:'PAY-7',notes:''},vault.documents)];
await activateAccountStorage('accounting-batch7-fixture');const key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);let latest=vault,tail=Promise.resolve(vault);window.successfulWrites=0;
registerVaultMutationBridge(mutation=>{const operation=tail.catch(()=>latest).then(async current=>{const next=mutation(current);await saveVault(key,next);latest=next;window.successfulWrites++;window.fixture.setState({vault:next});return next;});tail=operation;return operation;});
class Fixture extends React.Component{state={vault};render(){const v=this.state.vault;return React.createElement(TreasuryLedgerPage,{...v,workspaceId:'default',branchId:'main'});}}
window.changeSource=async publish=>{latest={...latest,payments:latest.payments.map(p=>({...p,amount:'40.00'}))};tail=Promise.resolve(latest);if(publish)window.fixture.setState({vault:latest});};
window.publishLatest=()=>window.fixture.setState({vault:latest});window.currentVault=()=>latest;window.readStored=async()=>decryptVault(key,await getEncryptedVault());
ReactDOM.render(React.createElement(Fixture,{ref:instance=>window.fixture=instance}),document.getElementById('visual-app'));
</script></body></html>
