<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="../../dist/styles/app.bundle.css">
  <style>
    html,body,#root{margin:0;width:100%;height:100%;min-height:100%;}
    body{overflow:hidden}
    .fixture-field{height:46px;border:1px solid currentColor;border-radius:10px;margin:12px;background:transparent}
    .fixture-section{min-height:180px}
    .fixture-copy{padding:14px;line-height:1.5}
    .invoice-page .doc-body{display:block}
  </style>
</head>
<body>
<div id="root">
  <div class="app-ui">
    <div class="ta-shell is-editor screen-editor">
      <main class="ta-main">
        <div class="ta-editor-workspace" data-v320-editor="true">
          <div class="ta-editor-core-slot">
            <section class="editor-screen" data-document-kind="proforma">
              <header class="editor-topbar">
                <div class="editor-top-left"><button class="icon-btn" type="button">←</button><div><strong>PI-2026-0099</strong><span>Proforma quotation</span></div></div>
                <span class="editor-workflow-badge">Draft</span>
                <div class="save-indicator state-saved">Saved locally</div>
                <div class="editor-actions"><button class="btn" type="button">PDF</button><button class="btn btn-primary" type="button">Save</button></div>
              </header>
              <div class="document-readiness"><div class="readiness-copy"><div><strong>Ready</strong><span>Quotation workspace</span></div></div><div class="readiness-track"><span style="width:70%"></span></div><div class="readiness-groups"><span>Customer</span><span>Items</span></div></div>
              <div class="editor-layout" data-fixture-editor-layout>
                <aside class="editor-pane" data-fixture-editor-pane>
                  <div class="editor-scroll"><fieldset class="editor-form-lock">
                    <section class="editor-section fixture-section"><div class="section-heading"><span>01</span><h2>Document</h2></div><div class="fixture-field"></div><div class="fixture-field"></div></section>
                    <section class="editor-section fixture-section"><div class="section-heading"><span>02</span><h2>Customer</h2></div><div class="fixture-field"></div><div class="fixture-field"></div></section>
                    <section class="editor-section fixture-section"><div class="section-heading"><span>03</span><h2>Items</h2></div><div class="fixture-field"></div><div class="fixture-field"></div></section>
                  </fieldset></div>
                </aside>
                <section class="preview-pane" data-fixture-preview-pane>
                  <div class="preview-toolbar">A4 preview</div>
                  <div class="preview-stage" data-fixture-preview-stage>
                    <div class="invoice-pages" style="--preview-scale:.82" data-fixture-pages>
                      <article class="invoice-page template-executive lang-en" data-fixture-a4>
                        <div class="page-accent"></div>
                        <header class="header-executive"><div class="doc-logo"><strong>LOUREX</strong></div><div class="doc-title inverse"><span>PROFORMA</span><em>PI-2026-0099</em></div></header>
                        <div class="doc-body"><div class="party-grid"><div class="party-block"><div class="section-kicker">From</div><div class="party-name">LOUREX</div></div><div class="party-block"><div class="section-kicker">To</div><div class="party-name">Customer</div></div></div><table class="items-table"><thead><tr><th>#</th><th>Description</th><th>Qty</th><th>Unit price</th><th>Total</th></tr></thead><tbody><tr><td>1</td><td>Sample product</td><td>100</td><td>10.00</td><td>1,000.00</td></tr></tbody></table></div>
                      </article>
                    </div>
                  </div>
                </section>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </div>
</div>
</body>
</html>
