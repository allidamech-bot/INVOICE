  <script id="lourex-theme-bootstrap">
    (function(){
      var key='lourex-ui-theme',pref='system';
      try{var saved=localStorage.getItem(key);if(saved==='light'||saved==='dark'||saved==='system')pref=saved;}catch(e){}
      var resolved=pref;
      if(pref==='system'){try{resolved=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}catch(e){resolved='dark';}}
      var root=document.documentElement,meta=document.querySelector('meta[name="theme-color"]');
      var dark='#0c111d',light='#f9fafb',bg=resolved==='light'?light:dark;
      root.dataset.uiTheme=resolved;root.dataset.uiThemePreference=pref;root.dataset.lourexBooting='true';
      root.style.colorScheme=resolved;root.style.backgroundColor=bg;root.style.setProperty('--boot-bg',bg);
      if(meta)meta.setAttribute('content',bg);
      document.addEventListener('DOMContentLoaded',function(){
        var mount=document.getElementById('root');if(!mount)return;
        var restore=function(){
          if(document.getElementById('lourex-boot'))return;
          delete root.dataset.lourexBooting;root.style.removeProperty('--boot-bg');root.style.colorScheme=resolved;root.style.backgroundColor=bg;
          if(meta)meta.setAttribute('content',bg);observer.disconnect();
        };
        var observer=new MutationObserver(restore);observer.observe(mount,{childList:true});restore();
      },{once:true});
    })();
  </script>
