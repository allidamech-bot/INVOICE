  <style id="lourex-boot-style">
    html[data-ui-theme="light"]{--boot-bg:#f3f7fc;--boot-text:#102235;--boot-track:#c3d1dc;--boot-accent:#129da1}
    html[data-ui-theme="dark"]{--boot-bg:#0a1826;--boot-text:#f7fbff;--boot-track:#353535;--boot-accent:#7399E3}
    html[data-ui-theme="light"]{--boot-visual-accent:#315DA8}
    html[data-ui-theme="dark"]{--boot-visual-accent:#82A9EC}
    html,body,#root{min-height:100%;min-height:100dvh;margin:0;background:var(--boot-bg,#0a1826)}
    html[data-lourex-booting="true"]{overflow:hidden!important;background:var(--boot-bg,#0a1826)!important}
    html[data-lourex-booting="true"] body,html[data-lourex-booting="true"] #root{position:fixed!important;inset:0!important;width:100%!important;height:100dvh!important;min-height:100dvh!important;margin:0!important;overflow:hidden!important;background:var(--boot-bg,#0a1826)!important;overscroll-behavior:none!important}
    #root > .lourex-launch.loading-screen {
      --launch-surface:#142c43;--launch-edge:#b5a17b;--launch-metal:#ddbd83;--launch-muted:#c3cfdf;
      --launch-background:radial-gradient(ellipse at 50% 28%,var(--launch-surface),transparent 62%);
      position:fixed;inset:0;z-index:2147483000;display:grid!important;place-items:center;
      box-sizing:border-box;padding:24px;overflow:hidden;isolation:isolate;
      color:var(--boot-text,#f7fbff);
      background:var(--launch-background),var(--boot-bg,#0a1826)!important;
    }
    html[data-ui-theme="light"] #root > .lourex-launch {
      --launch-surface:#fff;--launch-edge:#9f7941;--launch-metal:#805b2d;--launch-muted:#4c6076;
    }
    html[data-ui-theme] body #root > .lourex-launch.loading-screen {
      display:grid!important;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))!important;
      background:var(--launch-background),var(--boot-bg,#0a1826)!important;
      color:var(--boot-text,#f7fbff)!important;
    }
    .lourex-launch .launch-frame {
      position:absolute;inset:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
      border:1px solid var(--launch-edge);opacity:.25;pointer-events:none;
      background:linear-gradient(151deg,transparent 30%,var(--launch-edge) 30.1%,transparent 30.25%) top left/38% 28% no-repeat,
        linear-gradient(151deg,transparent 69%,var(--launch-edge) 69.1%,transparent 69.25%) bottom right/38% 28% no-repeat;
    }
    .lourex-launch .launch-lockup {
      position:relative;display:grid;justify-items:center;text-align:center;
      animation:launch-arrive 380ms ease-out both;
    }
    .lourex-launch .launch-lockup img {
      width:clamp(68px,16vh,96px);height:auto;aspect-ratio:96/116;object-fit:contain;
      margin:0 0 19px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.16));
    }
    .lourex-launch .launch-lockup strong {
      padding-inline-start:.22em;font:500 clamp(28px,7vw,43px)/1.1 Georgia,serif;letter-spacing:.22em;
    }
    .lourex-launch .launch-lockup > span {
      margin-top:9px;padding-inline-start:.38em;color:var(--launch-muted);
      font:600 10px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.38em;
    }
    .lourex-launch .launch-progress {
      position:relative;width:82px;height:2px;margin-top:27px;overflow:hidden;background:var(--boot-track,#353535);
    }
    .lourex-launch .launch-progress::after {
      content:"";position:absolute;inset:0 auto 0 0;width:36%;background:var(--launch-metal);
      animation:launch-progress 1.8s ease-in-out infinite;
    }
    .lourex-launch .launch-recovery {position:relative;max-width:28rem;text-align:center;font:500 1rem/1.55 system-ui,sans-serif}
    .lourex-launch .launch-recovery button {
      min-height:44px;padding:0 18px;border:1px solid var(--launch-metal);border-radius:5px;
      background:var(--boot-bg,#0a1826);color:inherit;font:inherit;cursor:pointer;
    }
    .lourex-launch[data-launch-recovery] .launch-lockup {display:none}
    @keyframes launch-arrive {from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
    @keyframes launch-progress {from{transform:translateX(-110%)}to{transform:translateX(300%)}}
    @media(prefers-reduced-motion:reduce) {
      .lourex-launch .launch-lockup,.lourex-launch .launch-progress::after{animation:none}
      .lourex-launch .launch-progress::after{width:100%;opacity:.7}
    }
  </style>
