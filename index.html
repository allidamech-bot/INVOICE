  <style id="lourex-boot-style">
    html,body,#root{min-height:100%;margin:0}
    #lourex-boot{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:calc(28px + env(safe-area-inset-top)) 28px calc(28px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 38%,rgba(201,164,88,.16),transparent 34%),linear-gradient(160deg,#071722 0%,#0b1d2d 58%,#102b3b 100%);color:#f7f2e7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
    .lourex-boot-card{display:flex;flex-direction:column;align-items:center;gap:9px;transform:translateY(-2vh)}
    .lourex-boot-mark{width:70px;height:70px;border:1px solid rgba(222,190,117,.52);border-radius:20px;display:grid;place-items:center;margin-bottom:7px;background:rgba(255,255,255,.055);box-shadow:0 18px 55px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.08);font:800 34px/1 Georgia,serif;color:#dec079;letter-spacing:-2px}
    .lourex-boot-brand{font-size:27px;line-height:1;letter-spacing:.16em;font-weight:800;margin-left:.16em}
    .lourex-boot-product{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:rgba(247,242,231,.64)}
    .lourex-boot-track{width:126px;height:3px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.12);margin-top:16px}
    .lourex-boot-track>i{display:block;width:44%;height:100%;border-radius:inherit;background:#dec079;animation:lourex-boot-slide 1.05s ease-in-out infinite}
    .lourex-boot-copy{margin-top:5px;font-size:11px;line-height:1.65;color:rgba(247,242,231,.62);font-weight:600}
    @keyframes lourex-boot-slide{0%{transform:translateX(-110%)}50%{transform:translateX(80%)}100%{transform:translateX(250%)}}
    @media (prefers-reduced-motion:reduce){.lourex-boot-track>i{animation:none;transform:none;width:100%;opacity:.65}}
  </style>
