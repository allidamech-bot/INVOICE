name: Batch 13 finalize audit trail

on:
  push:
    branches:
      - feat/lourex-audit-trail-batch13
    paths:
      - 'scripts/batch13-finalize.py'
      - '.github/workflows/batch13-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/lourex-audit-trail-batch13
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Apply final Batch 13 wiring
        run: python3 scripts/batch13-finalize.py
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit final Batch 13 wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx src/lib/audit-trail.ts src/components/ActivityLogModal.tsx
          git commit -m "fix(audit): wire core persistence and unified activity projection"
          git rm scripts/batch13-finalize.py .github/workflows/batch13-finalize.yml
          git commit -m "chore(audit): remove one-shot Batch 13 finalizer"
          git push origin HEAD:feat/lourex-audit-trail-batch13
