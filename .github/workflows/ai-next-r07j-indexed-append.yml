name: LOUREX AI Next R07J Indexed Append

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ai-next/conversation-state/event-store.ts'
      - 'src/ai-next/storage/firestore-indexed-append.ts'
      - 'tests/ai-next/r07j-indexed-append.test.mjs'
      - 'tests/ai-next/r07j-real-firestore.test.mjs'
      - '.github/workflows/ai-next-r07j-indexed-append.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-next-r07j-${{ github.ref }}
  cancel-in-progress: true

jobs:
  indexed-append:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GCLOUD_PROJECT: demo-ai-next-r07h
      GOOGLE_CLOUD_PROJECT: demo-ai-next-r07h
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: TypeScript check and compile
        run: npm run typecheck && ./node_modules/.bin/tsc -p tsconfig.json
      - name: R03/R07G/R07J targeted synthetic contract regression
        run: node --test tests/ai-next/r03-conversation-state.test.mjs tests/ai-next/r07g-sharded-events.test.mjs tests/ai-next/r07j-indexed-append.test.mjs
      - name: R07J true Firebase Admin and official Firestore emulator
        run: >-
          npx --yes --package firebase-tools@14.16.0 firebase
          emulators:exec
          --only firestore
          --project demo-ai-next-r07h
          --config tests/ai-next/r07h-firebase-emulator.json
          --non-interactive
          "node --test tests/ai-next/r07j-real-firestore.test.mjs"
