name: LOUREX AI Next R01 Isolated Contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ai-next/domain/**'
      - 'tests/ai-next/r01-core.test.mjs'
      - '.github/workflows/ai-next-r01-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-next-r01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Strict whole-repository TypeScript check
        run: npm run typecheck
      - name: Compile modules without invoking legacy patch-build scripts
        run: ./node_modules/.bin/tsc -p tsconfig.json
      - name: Run synthetic pure contracts and isolation regression tests
        run: node --test tests/ai-next/r01-core.test.mjs
