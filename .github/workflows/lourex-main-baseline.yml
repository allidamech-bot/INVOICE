name: LOUREX Main Baseline Full Test

on:
  push:
    branches:
      - qa/audit-main-baseline-20261009

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Full repository tests on unchanged main sources
        run: node --test --test-concurrency=2 tests/*.test.mjs
