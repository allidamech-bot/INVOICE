name: LOUREX v300 PO semantic closeout

on:
  push:
    branches:
      - feature/home-clean-rebuild-v284
    paths:
      - scripts/fix-v300-po-semantics.mjs
      - .github/workflows/fix-v300-po-semantics.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node scripts/fix-v300-po-semantics.mjs
      - run: npm run typecheck
      - run: node --test tests/v300-purchase-order-attachments-pin.test.mjs
      - run: git diff --check
      - name: Commit fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "LOUREX v300 automation"
          git config user.email "actions@users.noreply.github.com"
          git add src tests
          git commit -m "fix: isolate purchase-order delivery and cancellation semantics v300"
          git push origin HEAD:feature/home-clean-rebuild-v284
