name: LOUREX AI Provider Diagnostics
on:
  pull_request:
    branches: [main]
    paths:
      - 'api/_ai/provider-diagnostic-classifier.js'
      - 'api/_ai/provider-diagnostics.js'
      - 'api/_ai/router.js'
      - 'api/ai-core.js'
      - 'tests/ai-provider-diagnostic-classifier.test.mjs'
      - 'tests/ai-provider-diagnostics.test.mjs'
      - 'tests/ai-multi-provider-router.test.mjs'
      - 'tests/ai-provider-financial-accuracy.test.mjs'
      - 'tests/ai-provider-credential-preflight.test.mjs'
      - 'tests/ai-provider-diagnostic-rate-limit.test.mjs tests/ai-multi-provider-router.test.mjs'
      - 'tests/ai-diagnostics-access-reasons.test.mjs'
      - 'tests/ai-mistral-removed.test.mjs'
      - 'tests/ai-six-provider-inventory.test.mjs'
      - 'tests/ai-openrouter-probe-budget.test.mjs'
      - 'public/health.js'
      - 'public/health.html'
      - '.github/workflows/ai-provider-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-provider-diagnostics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-provider-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Offline synthetic provider probes (no API keys, no customer data)
        run: node --test --test-concurrency=1 tests/ai-diagnostics-access-reasons.test.mjs tests/ai-provider-diagnostic-classifier.test.mjs tests/ai-provider-diagnostics.test.mjs tests/ai-provider-financial-accuracy.test.mjs tests/ai-provider-credential-preflight.test.mjs tests/ai-provider-diagnostic-rate-limit.test.mjs tests/ai-mistral-removed.test.mjs tests/ai-six-provider-inventory.test.mjs tests/ai-openrouter-probe-budget.test.mjs tests/ai-new-provider-fallbacks-20261017.test.mjs tests/ai-provider-configuration-visibility-20261023.test.mjs tests/admin-diagnostics-authorization.test.mjs tests/ai-multi-provider-router.test.mjs
