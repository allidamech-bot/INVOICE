name: Long customer supplier account statement print acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/visual/obsidian-financial.html'
      - 'tests/visual/supplier-statement-print.html'
      - 'tests/visual/run-statement-text-extremes.cjs'
      - '.github/workflows/statement-text-extremes.yml'
permissions:
  contents: read
concurrency:
  group: statement-text-extremes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  statement-text:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check tests/visual/run-statement-text-extremes.cjs
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1 http-server@14.1.1
      - name: Real statement modal to native PDF text extremes
        shell: bash
        run: |
          node node_modules/http-server/bin/http-server . -p 4173 -c-1 > /tmp/lourex-statement-text.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node --input-type=module -e 'let ready=false;for(let i=0;i<50;i++){try{const r=await fetch("http://127.0.0.1:4173/tests/visual/supplier-statement-print.html");if(r.ok){ready=true;break;}}catch{}await new Promise(r=>setTimeout(r,100));}if(!ready)throw Error("Statement fixture did not start");'
          node tests/visual/run-statement-text-extremes.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-statement-qa
          path: visual-qa-output/account-statement-text-extremes/
          retention-days: 7
