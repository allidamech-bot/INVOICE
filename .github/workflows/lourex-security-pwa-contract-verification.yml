name: LOUREX Security PWA Contract Verification
on:
  push:
    branches:
      - fix/qa-pwa-diagnostics-finance-contracts-20261010
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: node --test tests/foundation-hardening-v120.test.mjs tests/product-os-v451.test.mjs tests/v302-real-pin-doc-entry.test.mjs
      - run: node --test --test-concurrency=2 tests/*.test.mjs
