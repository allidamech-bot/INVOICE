name: v365 finalize targeted tests

on:
  push:
    branches:
      - fix/v365-mobile-editor-scroll-draft-templates
    paths:
      - .github/workflows/v365-finalize-tests.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v365-mobile-editor-scroll-draft-templates
          fetch-depth: 0
      - name: Apply targeted Draft QA update
        run: python scripts/v365-finalize-tests.py
      - name: Verify and commit
        run: |
          git diff --check
          git diff -- tests/visual/run-v364-core-workflows.cjs
          git config user.name "lourex-v365-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/run-v364-core-workflows.cjs
          git commit -m "v365 update Draft live workflow QA for shared templates"
          git push origin HEAD:fix/v365-mobile-editor-scroll-draft-templates
