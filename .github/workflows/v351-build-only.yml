name: LOUREX v351 Build + Preview

on:
  push:
    branches:
      - audit/v351-layer-spacing-dedup-closeout

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Apply final v351 visual closeout
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          let changed=false;

          const draftPath='src/styles/v331-draft-scroll-recovery.css';
          let draft=fs.readFileSync(draftPath,'utf8');
          const replacements=[
            ['padding-bottom:calc(132px + env(safe-area-inset-bottom,0px))!important;','padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))!important;'],
            ['scroll-padding-bottom:calc(132px + env(safe-area-inset-bottom,0px))!important;','scroll-padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))!important;'],
            ['padding:10px 10px calc(138px + env(safe-area-inset-bottom,0px))!important;','padding:10px 10px calc(76px + env(safe-area-inset-bottom,0px))!important;'],
            ['scroll-padding-bottom:calc(138px + env(safe-area-inset-bottom,0px))!important;','scroll-padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))!important;']
          ];
          for(const [from,to] of replacements){
            if(draft.includes(from)){draft=draft.replace(from,to);changed=true;}
            else if(!draft.includes(to))throw new Error(`Draft spacing owner missing: ${from}`);
          }
          if(changed)fs.writeFileSync(draftPath,draft);

          const financePath='src/styles/tailadmin-finance-v320.css';
          let finance=fs.readFileSync(financePath,'utf8');
          const duplicate='@import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap");\n\n';
          if(finance.includes(duplicate)){
            finance=finance.replace(duplicate,'');
            fs.writeFileSync(financePath,finance);
            changed=true;
          }

          const tabletPath='src/styles/v330-template-contrast-guard.css';
          let tablet=fs.readFileSync(tabletPath,'utf8');
          const tabletFrom='  html body .app-ui .screen-editor .editor-topbar{\n    grid-template-columns:minmax(0,1fr) auto auto!important;';
          const tabletTo='  html body .app-ui .screen-editor .editor-topbar{\n    height:auto!important;\n    grid-template-columns:minmax(0,1fr) auto auto!important;';
          if(tablet.includes(tabletFrom)){
            tablet=tablet.replace(tabletFrom,tabletTo);
            fs.writeFileSync(tabletPath,tablet);
            changed=true;
          } else if(!tablet.includes(tabletTo)) {
            throw new Error('iPad editor topbar owner missing');
          }

          const index=fs.readFileSync('index.html','utf8');
          if(!/family=Outfit:wght@400;500;600;700;800/.test(index))throw new Error('Canonical Outfit preload is missing from index.html');

          console.log(changed?'Applied final v351 visual closeout.':'Final v351 visual closeout already present.');
          NODE
      - name: Commit final visual closeout if needed
        run: |
          if git diff --quiet -- src/styles/v331-draft-scroll-recovery.css src/styles/tailadmin-finance-v320.css src/styles/v330-template-contrast-guard.css; then
            exit 0
          fi
          git config user.name "allidamech-bot"
          git config user.email "allidamech@gmail.com"
          git add src/styles/v331-draft-scroll-recovery.css src/styles/tailadmin-finance-v320.css src/styles/v330-template-contrast-guard.css
          git commit -m "fix: finish v351 iPad topbar flow"
          git push origin HEAD:audit/v351-layer-spacing-dedup-closeout
      - run: npm ci
      - name: Production build only
        run: npm run build
      - name: Start built preview
        run: |
          npx http-server dist -p 4173 -c-1 >/tmp/lourex-preview.log 2>&1 &
          echo $! >/tmp/lourex-preview.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lourex-preview.log
          exit 1
      - name: Capture real browser previews
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium executable available on runner"
            exit 1
          fi
          mkdir -p preview-artifacts
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=8000 --window-size=390,844 --screenshot=preview-artifacts/app-iphone-390x844.png http://127.0.0.1:4173/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=8000 --window-size=1024,1366 --screenshot=preview-artifacts/app-ipad-1024x1366.png http://127.0.0.1:4173/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=8000 --window-size=1440,1000 --screenshot=preview-artifacts/app-desktop-1440x1000.png http://127.0.0.1:4173/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=10000 --window-size=390,844 --screenshot=preview-artifacts/editor-iphone-390x844.png 'http://127.0.0.1:4173/qa/obsidian-editor.html'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=10000 --window-size=1024,1366 --screenshot=preview-artifacts/editor-ipad-1024x1366.png 'http://127.0.0.1:4173/qa/obsidian-editor.html'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=10000 --window-size=390,844 --screenshot=preview-artifacts/editor-ar-iphone-390x844.png 'http://127.0.0.1:4173/qa/obsidian-editor.html?lang=ar'
          curl -fsS http://127.0.0.1:4173/health.html > preview-artifacts/health.html
          cat /tmp/lourex-preview.log > preview-artifacts/server.log || true
      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lourex-v351-preview
          path: preview-artifacts/
          if-no-files-found: error
          retention-days: 3
