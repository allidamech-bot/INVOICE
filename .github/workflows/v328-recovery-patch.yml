name: v328 Recovery Patch

on:
  push:
    branches:
      - recovery/v328-production-stability-ui

permissions:
  contents: write

jobs:
  patch-and-prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Apply v328 recovery patch
        run: python3 scripts/v328-recovery-patch.py
      - name: Apply browser-proof adjustments
        run: python3 scripts/v328-recovery-adjust.py
      - name: Install dependencies
        run: npm ci
      - name: Recovery contracts
        run: node --test tests/v328-recovery-contract.test.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install browser runtimes
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Browser recovery proof
        shell: bash
        run: |
          set -euo pipefail
          npx http-server . -p 4173 -c-1 > /tmp/lourex-v328.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/tests/visual/obsidian-shell.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/visual/run-v328-production-recovery.cjs
          node tests/visual/run-v327-production-recovery.cjs
          node tests/visual/run-template-visual-qa.cjs visual-qa-output/v328-templates
          node tests/visual/run-mobile-final-quote-stack.cjs
          node tests/visual/run-mobile-modal-overlap-v176.cjs
      - name: Commit verified application changes
        run: |
          if git diff --quiet; then
            echo "No application changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "fix(v328): recover production stability and mobile UX"
          git push origin HEAD:recovery/v328-production-stability-ui
