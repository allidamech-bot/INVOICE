name: LOUREX Focused Safety Finance QA
on:
  push:
    branches:
      - fix/qa-pwa-diagnostics-finance-contracts-20261010
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Production build, no deployment
        run: npm run build
      - name: Focused PWA and finance contracts
        run: node --test tests/foundation-hardening-v120.test.mjs tests/product-os-v451.test.mjs
      - name: Full unsuppressed historical suite
        run: node --test --test-concurrency=2 tests/*.test.mjs
