name: LOUREX Fiscal Trusted Provisioning Bridge QA

on:
  pull_request:
    paths:
      - 'api/_fiscal/production-provisioning-bridge.js'
      - 'api/_fiscal/production-enrollment-runtime.js'
      - 'tests/fiscal-production-provisioning-bridge.test.mjs'
      - '.github/workflows/lourex-fiscal-provisioning-bridge-qa.yml'

permissions:
  contents: read

jobs:
  offline-provisioning-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LOUREX_FISCAL_LIVE_ENABLED: 'false'
      LOUREX_AWS_WORKER_ENABLED: 'false'
      LOUREX_AWS_DISPATCH_APPROVED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check api/_fiscal/production-provisioning-bridge.js
          node --check api/_fiscal/production-enrollment-runtime.js
      - name: Run independent producer and registration authority tests
        run: |
          node --test tests/fiscal-production-provisioning-bridge.test.mjs tests/fiscal-production-registration-coordinator.test.mjs tests/fiscal-production-scope.test.mjs
