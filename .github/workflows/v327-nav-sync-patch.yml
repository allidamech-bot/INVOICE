name: v327 Nav Sync Patch

on:
  push:
    branches:
      - hotfix/v327-production-create-menu-scroll

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hotfix/v327-production-create-menu-scroll
          fetch-depth: 0
      - name: Patch editor navigation synchronization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/components/EditorPage.tsx')
          s=p.read_text()
          old="if(form){this.navMutationObserver=new MutationObserver(()=>this.syncSectionMeta());this.navMutationObserver.observe(form,{attributes:true,subtree:true,attributeFilter:['class']});}"
          new="if(form){this.navMutationObserver=new MutationObserver(()=>{this.syncSectionMeta();this.syncActiveSection();});this.navMutationObserver.observe(form,{attributes:true,childList:true,subtree:true,attributeFilter:['class']});}"
          if old in s:
              p.write_text(s.replace(old,new,1))
              print('Editor navigation observer hardened')
          elif new in s:
              print('Editor navigation observer already hardened')
          else:
              raise SystemExit('Expected EditorPage observer anchor not found')

          p=Path('tests/visual/run-functional-editor-controls-v201.cjs')
          s=p.read_text()
          s=s.replace("document.querySelectorAll('.editor-section-nav-button').length===7","document.querySelectorAll('.ta-editor-step-list>button').length===7")
          s=s.replace("document.querySelectorAll('.editor-section-nav-button').length","document.querySelectorAll('.ta-editor-step-list>button').length")
          s=s.replace(".mobile-editor-actionbar button,.editor-section-nav-button",".mobile-editor-actionbar button,.ta-editor-step-list>button")
          p.write_text(s)
          print('Editor controls test aligned to current TailAdmin stepper')
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit verified patch
        shell: bash
        run: |
          if git diff --quiet -- src/components/EditorPage.tsx tests/visual/run-functional-editor-controls-v201.cjs; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/EditorPage.tsx tests/visual/run-functional-editor-controls-v201.cjs
          git commit -m 'fix(v327): keep editor step navigation synchronized'
          git push origin HEAD:hotfix/v327-production-create-menu-scroll
