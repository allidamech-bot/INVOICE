name: LOUREX Tax VAT QA
on:
  pull_request:
    paths:
      - 'src/lib/tax-vat.ts'
      - 'src/lib/tax-vat-style.ts'
      - 'src/components/TaxVatCenter.tsx'
      - 'src/components/ReportsPage.tsx'
      - 'src/styles/tax-vat-batch10.css'
      - 'tests/tax-vat-batch10.test.mjs'
      - 'tests/visual/run-tax-vat-batch10.cjs'
      - '.github/workflows/batch10-tax-vat.yml'
permissions:
  contents: read
jobs:
  tax-vat:
    name: Batch 10 Tax VAT gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Batch 10 Tax VAT contracts
        run: node --test tests/tax-vat-batch10.test.mjs
      - name: Install browser QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Tax VAT browser QA
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/lourex-tax-vat-batch10.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lourex-tax-vat-batch10.log
            exit 1
          fi
          node tests/visual/run-tax-vat-batch10.cjs
