name: Apply Document Design Recovery v139

on:
  push:
    branches:
      - fix/restore-document-designs-v139

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - name: Apply design recovery patch
        run: node scripts/apply-document-design-recovery-v139.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Commit recovered document design pipeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build.mjs public/sw.js tests/document-design-recovery-v139.test.mjs
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "Fix document template design delivery v139"
          git push
