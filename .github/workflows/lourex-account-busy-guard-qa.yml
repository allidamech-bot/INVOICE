name: LOUREX Account Busy Guard QA
on:
  push:
    branches:
      - fix/qa-account-mode-race-20261010
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: node --test tests/site-shell-audit-v86.test.mjs
      - run: node --test --test-concurrency=2 tests/*.test.mjs
