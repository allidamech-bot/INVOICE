name: LOUREX AI Next R07T Blind Dialogue Quality (Offline)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ai-next/router/semantic-dialogue-benchmark.ts'
      - 'src/ai-next/router/semantic-evaluation.ts'
      - 'src/ai-next/router/local-structured-intents.ts'
      - 'scripts/ai-next-semantic-dialogue.mjs'
      - 'tests/ai-next/r07t-dialogue-gold.json'
      - 'tests/ai-next/r07t-dialogue-benchmark.test.mjs'
      - '.github/workflows/ai-next-r07t-dialogue-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-next-r07t-dialogue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dialogue-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Strict TypeScript and isolated build
        run: npm run typecheck && ./node_modules/.bin/tsc -p tsconfig.json
      - name: Synthetic dialogue truthfulness and scorer regressions
        run: >-
          node --test
          tests/ai-next/r07t-dialogue-benchmark.test.mjs
          tests/ai-next/r07p-blind-benchmark.test.mjs
          tests/ai-next/r07p-multilingual-report.test.mjs
          tests/ai-next/r07p-local-structured-intents.test.mjs
      - name: Production and finance isolation
        run: node scripts/verify-deployment-isolation.mjs
