name: LOUREX v312 pre-merge audit fixes

on:
  push:
    branches:
      - feature/v312-business-document-suite

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v312-business-document-suite
          fetch-depth: 0
      - name: Apply audited fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text()
          def save(path, text):
              Path(path).write_text(text)
          def replace(path, old, new, *, required=True, all=False):
              s=load(path)
              if new in s and old not in s:
                  return
              if old not in s:
                  if required:
                      raise SystemExit(f'{path}: missing expected text: {old[:100]!r}')
                  return
              s=s.replace(old,new) if all else s.replace(old,new,1)
              save(path,s)
          def insert_after(path, marker, addition):
              s=load(path)
              if addition.strip() in s:
                  return
              if marker not in s:
                  raise SystemExit(f'{path}: missing insert marker')
              save(path,s.replace(marker,marker+addition,1))
          def regex(path, pattern, repl, *, flags=0, required=True):
              s=load(path)
              n=re.subn(pattern,repl,s,count=1,flags=flags)
              if n[1]==0 and required:
                  raise SystemExit(f'{path}: regex did not match: {pattern[:100]}')
              if n[1]:save(path,n[0])

          # Central document semantics.
          insert_after('src/lib/document-kinds.ts',
            "export function documentBankAllowed(kind:DocumentKind):boolean{return businessDocumentDefinition(kind).bankAllowed;}",
            "\n\nexport type DocumentSecondaryDateKind='none'|'valid-until'|'requested-delivery'|'due-date'|'response-due';\nexport function documentSecondaryDateKind(kind:DocumentKind,role:DocumentRole='standard'):DocumentSecondaryDateKind{\n  if(role==='credit-note'||kind==='draft'||kind==='delivery-note'||kind==='payment-receipt'||kind==='statement-account')return'none';\n  if(kind==='proforma'||kind==='proforma-invoice')return'valid-until';\n  if(kind==='purchase-order')return'requested-delivery';\n  if(kind==='rfq')return'response-due';\n  return'due-date';\n}\nexport function documentUsesCommercialDefaults(kind:DocumentKind):boolean{return kind!=='draft'&&kind!=='payment-receipt'&&kind!=='statement-account';}\n")

          # Numbering, defaults, validation semantics.
          replace('src/lib/documents.ts',
            "import { documentBankAllowed, documentNumberPrefix, documentPriceOptional, isSupplierDocumentKind } from './document-kinds.js';",
            "import { documentBankAllowed, documentNumberPrefix, documentPriceOptional, documentSecondaryDateKind, documentUsesCommercialDefaults, isSupplierDocumentKind } from './document-kinds.js';")
          insert_after('src/lib/documents.ts',
            "const liveNumberReservations=new WeakMap<object,NumberReservation>();",
            "\nconst liveAuxiliaryReservations=new WeakMap<object,{year:number;values:Record<string,number>}>();")
          replace('src/lib/documents.ts',
            "    seq=vault.documents.reduce((max,document)=>{const match=document.number.trim().match(matchPattern);return match?Math.max(max,Number(match[1])||0):max;},0);\n    let number='';\n    do{seq+=1;number=`${prefix}-${year}-${String(seq).padStart(4,'0')}`;}while(used.has(number.toLowerCase()));\n    return {number,vault};",
            "    const scanned=vault.documents.reduce((max,document)=>{const match=document.number.trim().match(matchPattern);return match?Math.max(max,Number(match[1])||0):max;},0);\n    const auxiliaryLive=liveAuxiliaryReservations.get(sourceNumbering);\n    const reserved=auxiliaryLive?.year===year?(auxiliaryLive.values[kind]??0):0;\n    seq=Math.max(scanned,reserved);\n    let number='';\n    do{seq+=1;number=`${prefix}-${year}-${String(seq).padStart(4,'0')}`;}while(used.has(number.toLowerCase()));\n    const values=auxiliaryLive?.year===year?{...auxiliaryLive.values}:{};values[kind]=seq;\n    liveAuxiliaryReservations.set(sourceNumbering,{year,values});\n    return {number,vault};")
          replace('src/lib/documents.ts',
            "  const taxPreset=defaultTaxPreset(company);\n  return {",
            "  const taxPreset=defaultTaxPreset(company);\n  const usesCommercialDefaults=documentUsesCommercialDefaults(kind);\n  return {")
          replace('src/lib/documents.ts',
