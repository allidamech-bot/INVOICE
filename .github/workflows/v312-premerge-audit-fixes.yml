            "    adjustments: { discountEnabled: false, discountMode: 'fixed', discountValue: '0.00', shippingEnabled: false, shipping: '0.00', otherChargesEnabled: false, otherCharges: '0.00', taxEnabled: !documentPriceOptional(kind)&&Boolean(taxPreset), taxPercent: taxPreset?.rate||'0' },")
          old_dates="""  if ((doc.kind === 'proforma' || doc.kind === 'proforma-invoice') && !doc.dueDate) errors.dueDate = 'Valid until date is required.';
  if (doc.kind === 'purchase-order' && !doc.dueDate) errors.dueDate = 'Requested delivery date is required.';
  if(doc.dueDate&&!isIsoDate(doc.dueDate))errors.dueDate=(doc.kind==='proforma'||doc.kind==='proforma-invoice'||doc.kind==='rfq')?'Valid until date is invalid.':doc.kind==='purchase-order'?'Requested delivery date is invalid.':'Due date is invalid.';
  else if(doc.dueDate&&isIsoDate(doc.issueDate)&&compareIsoDates(doc.dueDate,doc.issueDate)<0)errors.dueDate=(doc.kind==='proforma'||doc.kind==='proforma-invoice'||doc.kind==='rfq')?'Valid until date cannot be before issue date.':doc.kind==='purchase-order'?'Requested delivery cannot be before order date.':'Due date cannot be before issue date.';"""
          new_dates="""  const secondaryDate=documentSecondaryDateKind(doc.kind,doc.role);
  if (secondaryDate==='valid-until' && !doc.dueDate) errors.dueDate = 'Valid until date is required.';
  if (secondaryDate==='requested-delivery' && !doc.dueDate) errors.dueDate = 'Requested delivery date is required.';
  if(doc.dueDate&&!isIsoDate(doc.dueDate))errors.dueDate=secondaryDate==='valid-until'?'Valid until date is invalid.':secondaryDate==='requested-delivery'?'Requested delivery date is invalid.':secondaryDate==='response-due'?'Response due date is invalid.':'Due date is invalid.';
  else if(doc.dueDate&&isIsoDate(doc.issueDate)&&compareIsoDates(doc.dueDate,doc.issueDate)<0)errors.dueDate=secondaryDate==='valid-until'?'Valid until date cannot be before issue date.':secondaryDate==='requested-delivery'?'Requested delivery cannot be before order date.':secondaryDate==='response-due'?'Response due date cannot be before issue date.':'Due date cannot be before issue date.';"""
          replace('src/lib/documents.ts',old_dates,new_dates)

          # Readiness must not require pricing for RFQ / Delivery Note.
          replace('src/lib/readiness.ts',
            "import { decimalToScaled, isDecimalInput } from './money.js';",
            "import { decimalToScaled, isDecimalInput } from './money.js';\nimport { documentPriceOptional, isSupplierDocumentKind } from './document-kinds.js';")
          replace('src/lib/readiness.ts',
            "  const errors=validateDocument(doc);\n  const requirements: boolean[] = [];",
            "  const errors=validateDocument(doc);\n  const priceOptional=documentPriceOptional(doc.kind);\n  const requirements: boolean[] = [];")
          replace('src/lib/readiness.ts',
