            "      const party=documentParty(document);\n      const labelMeta=documentKindLabel(document.kind,document.role);\n      const label=t(labelMeta.en,labelMeta.ar);\n      candidates.push({key:`doc-${document.id}`,kind:'document',title:document.number,subtitle:`${label} · ${party}`,searchText:[document.number,party,document.customerSnapshot?.companyNameEn,document.customerSnapshot?.companyNameAr,document.supplierSnapshot?.nameEn,document.supplierSnapshot?.nameAr,document.supplierReference,document.currency,document.issueDate,label].join(' '),action:()=>this.openDocument(document)});")

