name: LOUREX AI Next R07P Authenticated History Context

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ai-next/conversation-state/trusted-history-context.ts'
      - 'src/ai-next/router/semantic-planner.ts'
      - 'tests/ai-next/r07m-semantic-durable.test.mjs'
      - '.github/workflows/ai-next-r07p-trusted-history.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-next-r07p-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audited-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript and isolated compiler
        run: npm run typecheck && ./node_modules/.bin/tsc -p tsconfig.json
      - name: Real indexed-journal to unsaved-draft context tests
        run: node --test tests/ai-next/r07m-semantic-durable.test.mjs
      - name: R07P model and guarded draft regressions
        run: >-
          node --test
          tests/ai-next/r07p-semantic-planner.test.mjs
          tests/ai-next/r07r-draft-preparation.test.mjs
          tests/ai-next/r07m-fast-coordinator.test.mjs
      - name: Financial/prod isolation
        run: node scripts/verify-deployment-isolation.mjs
