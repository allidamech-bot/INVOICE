name: LOUREX v312 final document closeout

on:
  push:
    branches:
      - feature/v312-business-document-suite

permissions:
  contents: write

concurrency:
  group: v312-final-document-closeout
  cancel-in-progress: true

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v312-business-document-suite
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final audited document patch
        run: python3 scripts/v312-final-closeout.py
      - name: Apply clean regression audit
        run: python3 scripts/v312-final-clean-audit.py
      - name: Normalize touched text files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths=[
            'src/lib/document-kinds.ts','src/lib/defaults.ts','src/storage/vault.ts','src/lib/documents.ts',
            'src/app/App.tsx','src/components/EditorPageCore.tsx','src/templates/TemplateRenderer.tsx',
            'src/lib/document-quality.ts','src/components/DocumentLifecyclePanel.tsx','src/lib/i18n.ts',
            'tests/v312-business-document-suite.test.mjs','tests/account-authoritative-sync.test.mjs','tests/audit-batch3.test.mjs',
            'tests/commercial-output-hardening-v167.test.mjs','tests/documents-workspace-v168.test.mjs',
            'tests/v300-purchase-order-attachments-pin.test.mjs'
          ]
          for path in paths:
            p=Path(path)
            if p.exists(): p.write_text(p.read_text().rstrip()+"\n")
          PY
      - name: Diff sanity
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Full unit suite
        run: node scripts/run-unit-tests.mjs
      - name: v312 focused regression
        run: node --test tests/v312-business-document-suite.test.mjs
      - name: Related document regression
        run: node --test tests/editor-flow-hardening-v167.test.mjs tests/documents-workspace-v168.test.mjs tests/commercial-output-hardening-v167.test.mjs tests/v300-purchase-order-attachments-pin.test.mjs
      - name: Commit clean closeout
        run: |
          rm scripts/v312-final-closeout.py
          rm scripts/v312-final-clean-audit.py
          rm .github/workflows/v312-final-closeout.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(v312): finalize document suite semantics"
          git push origin HEAD:feature/v312-business-document-suite
