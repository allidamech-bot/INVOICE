name: Apply Receivables Batch 4
on:
  push:
    branches: [agent/customer-receivables-aging-batch-4]
    paths:
      - scripts/apply-receivables-batch4.mjs
      - .github/workflows/apply-receivables-batch4.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/customer-receivables-aging-batch-4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: node scripts/apply-receivables-batch4.mjs
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-receivables-batch4.yml scripts/apply-receivables-batch4.mjs
          git add -A
          git commit -m "feat: integrate receivables aging and statements"
          git push origin HEAD:agent/customer-receivables-aging-batch-4
