name: LOUREX v351 Targeted Diagnostics

on:
  push:
    branches:
      - audit/v351-layer-spacing-dedup-closeout
    paths:
      - .github/workflows/v351-deep-audit.yml

permissions:
  contents: read

jobs:
  targeted-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Install browser diagnostics runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Start fixture server
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/lourex-targeted-server.log 2>&1 &
          echo $! > /tmp/lourex-targeted-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/tests/visual/template-visual-qa.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lourex-targeted-server.log
          exit 1
      - name: Run targeted mobile and WebKit diagnostics
        shell: bash
        run: |
          mkdir -p targeted-diagnostics
          status=0
          run_case(){
            name="$1"; shift
            echo "===== $name =====" | tee "targeted-diagnostics/${name}.log"
            set +e
            timeout --signal=TERM --kill-after=10s 240s "$@" 2>&1 | tee -a "targeted-diagnostics/${name}.log"
            code=${PIPESTATUS[0]}
            set -e
            echo "exit=$code" | tee -a "targeted-diagnostics/${name}.log"
            if [ "$code" -ne 0 ]; then status=1; fi
          }
          run_case mobile-final node tests/visual/run-mobile-final-quote-stack.cjs
          run_case mobile-modal node tests/visual/run-mobile-modal-overlap-v176.cjs
          run_case editor-stability node tests/visual/run-v338-editor-stability.cjs
          run_case ipad-landscape-draft node tests/visual/run-v339-ipad-landscape-draft.cjs
          run_case ipad-landscape-commercial node tests/visual/run-v339-ipad-landscape-commercial.cjs
          run_case ipad-portrait-draft node tests/visual/run-v339-ipad-portrait-draft.cjs
          run_case shell-navigation node tests/visual/run-v337-shell-navigation.cjs
          run_case shell-overlay-release node tests/visual/run-v339-shell-overlay-release.cjs
          run_case signout-guard node tests/visual/run-v339-signout-guard.cjs
          cp /tmp/lourex-targeted-server.log targeted-diagnostics/server.log || true
          exit "$status"
      - name: Upload targeted diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lourex-v351-targeted-diagnostics
          path: targeted-diagnostics
          if-no-files-found: error
