name: LOUREX v351 Deep Audit

on:
  push:
    branches:
      - audit/v351-layer-spacing-dedup-closeout
    paths:
      - .github/workflows/v351-deep-audit.yml

permissions:
  contents: write

jobs:
  deep-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Apply canonical document-flow fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/styles/document-premium-redesign-v141.css')
          s = p.read_text()
          old_comment = '''/* Commercial close. The whole closing band consumes spare A4 space as one unit.\n   On short documents margin-top:auto pushes subtotal/total/terms/bank/signature to\n   the footer. On long pages auto margin collapses to zero and normal flow wins. */'''
          new_comment = '''/* Commercial close. Keep subtotal/total/terms/bank/signature in normal document flow.\n   Short documents must not synthesize a large empty band between line items and the\n   commercial close; long documents continue naturally and paginate through the renderer. */'''
          old_rule = '.final-details{flex:0 0 auto;min-height:0;margin-top:auto;padding-top:6mm}'
          new_rule = '.final-details{flex:0 0 auto;min-height:0;margin-top:8mm;padding-top:0}'
          if old_comment not in s:
              raise SystemExit('Expected v141 commercial-close comment not found')
          if old_rule not in s:
              raise SystemExit('Expected v141 commercial-close rule not found')
          s = s.replace(old_comment, new_comment, 1).replace(old_rule, new_rule, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- src/styles/document-premium-redesign-v141.css

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency audit report
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high > npm-audit.txt 2>&1
          code=$?
          set -e
          echo "npm audit exit=$code" | tee audit-status.txt
          cat npm-audit.txt

      - name: Static security gate
        shell: bash
        run: |
          set +e
          node scripts/security-check.mjs > static-security.txt 2>&1
          code=$?
          set -e
          echo "security-check exit=$code" | tee -a audit-status.txt
          cat static-security.txt

      - name: Typecheck and production build
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.txt 2>&1
          tc=$?
          npm run build > build.txt 2>&1
          build=$?
          set -e
          echo "typecheck exit=$tc" | tee -a audit-status.txt
          echo "build exit=$build" | tee -a audit-status.txt
          cat typecheck.txt
          cat build.txt
          test "$tc" -eq 0
          test "$build" -eq 0

      - name: Collect architecture and risk inventory
        shell: bash
        run: |
          {
            echo '# LOUREX v351 deep static inventory'
            echo
            echo '## source counts'
            printf 'TS/TSX files: '; find src -type f \( -name '*.ts' -o -name '*.tsx' \) | wc -l
            printf 'CSS files: '; find src -type f -name '*.css' | wc -l
            printf 'test files: '; find tests -type f | wc -l
            echo
            echo '## dependency/runtime package summary'
            node -e "const p=require('./package.json'); console.log('dependencies',Object.keys(p.dependencies||{}).length); console.log('devDependencies',Object.keys(p.devDependencies||{}).length)"
            echo
            echo '## source risk-pattern counts (inventory, not findings by itself)'
            for pat in 'dangerouslySetInnerHTML' 'innerHTML' 'eval(' 'new Function' 'localStorage' 'sessionStorage' 'indexedDB' 'overflow:hidden' '100vh' '100dvh' 'position:fixed' '!important' 'z-index:' 'TODO' 'FIXME' 'HACK'; do
              count=$(grep -R -F --include='*.ts' --include='*.tsx' --include='*.js' --include='*.css' "$pat" src 2>/dev/null | wc -l || true)
              printf '%-28s %s\n' "$pat" "$count"
            done
            echo
            echo '## Firebase/storage/cloud references'
            grep -R -n -E 'Firebase|firestore|storage|uploadBytes|uploadString|getDownloadURL|hasCloudConflict|saveFirestoreData|loadFirestoreData' src --include='*.ts' --include='*.tsx' | head -n 600 || true
            echo
            echo '## auth/PIN/lock references'
            grep -R -n -E 'PIN|pin|lock|auth|signIn|signOut|reauth|credential|passkey|MFA' src --include='*.ts' --include='*.tsx' | head -n 800 || true
            echo
            echo '## high z-index declarations'
            grep -R -n -E 'z-index:[[:space:]]*([5-9][0-9]{2,}|[1-9][0-9]{3,})' src --include='*.css' | head -n 500 || true
            echo
            echo '## fixed/viewport/overflow declarations'
            grep -R -n -E 'position:[[:space:]]*fixed|overflow(-[xy])?:[[:space:]]*hidden|100(vh|dvh|svh)' src --include='*.css' | head -n 700 || true
            echo
            echo '## duplicate Google font imports'
            grep -R -n -E '@import.*fonts\.googleapis\.com' src --include='*.css' || true
            echo
            echo '## bundle outputs'
            find dist -type f -printf '%s %p\n' 2>/dev/null | sort -nr | head -n 50 || true
          } > deep-static-inventory.txt
          cat deep-static-inventory.txt

      - name: Commit proven layout correction
        run: |
          if git diff --quiet -- src/styles/document-premium-redesign-v141.css; then
            echo 'No CSS change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/document-premium-redesign-v141.css
          git commit -m 'fix: remove synthetic document preview dead zone'
          git push origin HEAD:audit/v351-layer-spacing-dedup-closeout

      - name: Upload deep audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lourex-v351-deep-audit
          path: |
            audit-status.txt
            npm-audit.txt
            static-security.txt
            typecheck.txt
            build.txt
            deep-static-inventory.txt
          if-no-files-found: warn
