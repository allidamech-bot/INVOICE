name: LOUREX AI Next R07M Verified Unsaved Review Reply

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ai-next/coordinator/fast-local-coordinator.ts'
      - 'tests/ai-next/r07r-atomic-edit-receipts.test.mjs'
      - 'tests/ai-next/r07m-r07d-real-emulator-reconciliation.test.mjs'
      - '.github/workflows/ai-next-r07m-verified-reply.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-next-r07m-verified-reply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verified-review-reply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCLOUD_PROJECT: demo-ai-next-r07h
      GOOGLE_CLOUD_PROJECT: demo-ai-next-r07h
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Strict types and isolated compilation
        run: npm run typecheck && ./node_modules/.bin/tsc -p tsconfig.json
      - name: Never-false-positive test and existing Controller regressions
        run: >-
          node --test
          tests/ai-next/r07r-atomic-edit-receipts.test.mjs
          tests/ai-next/r07m-semantic-durable.test.mjs
          tests/ai-next/r07r-trusted-review-session.test.mjs
      - name: Real Firestore Emulator cross-client confirmation and recovery
        run: >-
          npx --yes --package firebase-tools@14.16.0 firebase
          emulators:exec
          --only firestore
          --project demo-ai-next-r07h
          --config tests/ai-next/r07h-firebase-emulator.json
          --non-interactive
          "node --test tests/ai-next/r07m-r07d-real-emulator-reconciliation.test.mjs"
      - name: Financial and live deployment isolation
        run: node scripts/verify-deployment-isolation.mjs
