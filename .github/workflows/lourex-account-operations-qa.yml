name: LOUREX Current Account and Operations QA
on:
  push:
    branches:
      - fix/audit-historical-settings-operations-20261010
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: node --test tests/maintenance-closeout-v207.test.mjs tests/account-cloud-separation-v186.test.mjs tests/final-functional-navigation-auth-v200.test.mjs
      - run: node --test --test-concurrency=2 tests/*.test.mjs
