name: LOUREX Release Gate Verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/verify-local.mjs'
      - 'tests/local-verification-no-actions.test.mjs'
      - 'docs/LOCAL_VERIFICATION_NO_ACTIONS.md'
      - '.github/workflows/lourex-release-gates-qa.yml'

permissions:
  contents: read

concurrency:
  group: lourex-release-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  full-release-gate:
    name: Node 24 / security / build / contracts / Chromium / WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out final PR snapshot with comparison history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use required Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked project dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare isolated browser QA dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Run full mandatory release gate (not --quick)
        run: node scripts/verify-local.mjs
      - name: Compare first failing browser suite against unchanged main
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          baseline="${RUNNER_TEMP}/lourex-main-baseline"
          git worktree add --detach "$baseline" origin/main
          cd "$baseline"
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.55.0
          npm run build
          node node_modules/http-server/bin/http-server . -p 4173 -c-1 > "${RUNNER_TEMP}/lourex-main-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/tests/visual/v338-editor-stability.html >/dev/null; then break; fi
            sleep 1
          done
          set +e
          node tests/visual/run-v338-editor-stability.cjs > "${RUNNER_TEMP}/lourex-main-browser.log" 2>&1
          result=$?
          set -e
          echo "UNCHANGED_MAIN_V338_EXIT=$result"
          cat "${RUNNER_TEMP}/lourex-main-browser.log"
          echo "The unchanged-main result is diagnostic only. The PR release gate still fails closed."
