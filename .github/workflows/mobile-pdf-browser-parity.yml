name: Mobile PDF browser parity
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/ios-print-bridge.js'
      - 'tests/pdf-pagination-parity-v542.test.mjs'
      - 'tests/safari-pdf-single-page-v580.test.mjs'
      - 'tests/visual/run-v542-pagination-parity.cjs'
      - 'tests/visual/run-finance-iphone-pdf-axis31.cjs'
      - 'tests/visual/v542-pagination-parity.html'
      - 'tests/visual/v542-pagination-parity.js'
      - '.github/workflows/mobile-pdf-browser-parity.yml'
permissions:
  contents: read
concurrency:
  group: mobile-pdf-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Existing PDF and pagination regressions
        run: node --test tests/pdf-pagination-parity-v542.test.mjs tests/safari-pdf-single-page-v580.test.mjs tests/final-details-pagination-v127.test.mjs
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Compare mobile preview with downloaded PDF in Chromium and WebKit
        shell: bash
        run: |
          node node_modules/http-server/bin/http-server . -p 4173 -c-1 > /tmp/lourex-mobile-pdf-http.log 2>&1 &
          qa_server_pid=$!
          trap 'kill "$qa_server_pid" 2>/dev/null || true' EXIT
          node --input-type=module -e 'let ready=false;for(let i=0;i<50;i++){try{const r=await fetch("http://127.0.0.1:4173/tests/visual/v542-pagination-parity.html");if(r.ok){ready=true;break;}}catch{}await new Promise(r=>setTimeout(r,100));}if(!ready)throw new Error("Fixture server did not start");'
          node tests/visual/run-finance-iphone-pdf-axis31.cjs
          node tests/visual/run-v542-pagination-parity.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-pdf-parity
          path: visual-qa-output/document-design-final-deep/
          retention-days: 7
