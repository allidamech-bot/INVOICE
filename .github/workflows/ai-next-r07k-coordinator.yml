name: LOUREX AI Next R07K Indexed Coordinator Compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ai-next/coordinator/local-coordinator.ts'
      - 'src/ai-next/coordinator/indexed-ledger-bridge.ts'
      - 'tests/ai-next/r07k-coordinator-indexed-bridge.test.mjs'
      - 'tests/ai-next/r07k-coordinator-firestore-emulator.test.mjs'
      - '.github/workflows/ai-next-r07k-coordinator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-next-r07k-${{ github.ref }}
  cancel-in-progress: true

jobs:
  indexed-coordinator:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GCLOUD_PROJECT: demo-ai-next-r07h
      GOOGLE_CLOUD_PROJECT: demo-ai-next-r07h
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Strict TypeScript and compile
        run: npm run typecheck && ./node_modules/.bin/tsc -p tsconfig.json
      - name: R07B + indexed event + R07K compatibility regression
        run: >-
          node --test
          tests/ai-next/r07b-local-coordinator.test.mjs
          tests/ai-next/r07j-indexed-append.test.mjs
          tests/ai-next/r07k-coordinator-indexed-bridge.test.mjs
      - name: R07K official Firestore Emulator with R07D unsaved quotation
        run: >-
          npx --yes --package firebase-tools@14.16.0 firebase
          emulators:exec
          --only firestore
          --project demo-ai-next-r07h
          --config tests/ai-next/r07h-firebase-emulator.json
          --non-interactive
          "node --test tests/ai-next/r07k-coordinator-firestore-emulator.test.mjs"
