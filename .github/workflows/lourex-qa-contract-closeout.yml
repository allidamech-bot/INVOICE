name: LOUREX QA Contract Closeout
on:
  push:
    branches:
      - fix/final-qa-contracts-closeout-20261010
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Locked install
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Production build (no deploy)
        run: npm run build
      - name: Focused current-runtime regressions
        run: node --test tests/documents-workspace-v104.test.mjs tests/interface-polish-v256.test.mjs tests/design-semantic-closeout-batch2.test.mjs tests/design-system-v164.test.mjs tests/document-dark-contrast-v126.test.mjs tests/document-design-recovery-v139.test.mjs tests/document-final-qa-v130.test.mjs tests/document-layout-cleanup-v140.test.mjs tests/document-output-quality-v157.test.mjs tests/document-premium-redesign-v141.test.mjs tests/document-template-distinction-v143.test.mjs tests/workspace-v54.test.mjs tests/workspace-v60.test.mjs tests/editor-detail-polish-v230.test.mjs tests/editor-guided-flow-v107.test.mjs tests/editor-hierarchy-v93.test.mjs tests/editor-premium-v56.test.mjs tests/editor-workflow-v61.test.mjs tests/editor-memory-v53.test.mjs tests/entry-acceleration-v62.test.mjs
      - name: Full historical suite with no exclusions
        run: node --test --test-concurrency=2 tests/*.test.mjs
