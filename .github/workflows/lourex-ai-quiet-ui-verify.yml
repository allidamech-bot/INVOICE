name: LOUREX AI Quiet UI — Scoped Validation
on:
  push:
    branches:
      - design/lourex-ai-next-generation-20261017
    paths:
      - src/components/AiCopilot.tsx
      - src/components/AiConversationWorkspace.tsx
      - src/components/AiIdentityMark.tsx
      - src/styles/ai-conversation-workspace.css
      - tests/ai-assistant-help-batch3.test.mjs
      - .github/workflows/lourex-ai-quiet-ui-verify.yml
permissions:
  contents: read
concurrency:
  group: lourex-ai-quiet-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-ai-ui-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Build existing production pipeline once
        run: npm run build
      - name: Focused AI conversation and iPad source regressions
        run: >
          node --test --test-concurrency=2
          tests/ai-assistant-help-batch3.test.mjs
          tests/ai-conversation-workspace.test.mjs
          tests/ai-chat-ipad-conversation-20261014.test.mjs
