name: Apply invoice conversion settlement
on:
  push:
    branches:
      - feature/invoice-conversion-settlement
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/invoice-conversion-settlement
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply targeted source changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text()
          def write(path,text): Path(path).write_text(text)
          def rep(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing replacement anchor: {label}')
              return text.replace(old,new,1)
          def sub(text, pattern, repl, label, flags=0):
              next_text,count=re.subn(pattern,repl,text,count=1,flags=flags)
              if count!=1:
                  raise SystemExit(f'expected one regex replacement for {label}, got {count}')
              return next_text

          # types.ts — settlement intent is encrypted with the document draft.
          p='src/types.ts'; s=read(p)
          s=rep(s,"export type PaymentMethod = 'cash' | 'bank-transfer' | 'card' | 'cheque' | 'other';","export type PaymentMethod = 'cash' | 'bank-transfer' | 'card' | 'cheque' | 'other';\nexport type InvoiceSettlementMode = 'due-on-receipt' | 'on-account' | 'partial' | 'paid';",'settlement mode type')
          s=rep(s,"export interface LourexDocument {","export interface InvoiceSettlementPlan {\n  mode: InvoiceSettlementMode;\n  dueDate: string;\n  paymentTermPresetId: string;\n  paymentTerms: string;\n  paymentAmount: string;\n  paymentDate: string;\n  paymentMethod: PaymentMethod;\n  paymentReference: string;\n  paymentNotes: string;\n}\n\nexport interface LourexDocument {",'settlement plan interface')
          s=rep(s,"  paymentTermPresetId: string;\n  number: string;","  paymentTermPresetId: string;\n  settlementPlan: InvoiceSettlementPlan | null;\n  number: string;",'document settlement field')
          write(p,s)

          # defaults.ts — schema v12 carries settlement intent.
          p='src/lib/defaults.ts'; s=read(p)
          s=rep(s,"// v11 adds encrypted suppliers, purchases, expenses and inventory ledger records.\nexport const APP_SCHEMA_VERSION = 11;","// v11 adds encrypted suppliers, purchases, expenses and inventory ledger records.\n// v12 adds encrypted quote-to-invoice settlement intent for safe payment-on-issue workflows.\nexport const APP_SCHEMA_VERSION = 12;",'schema version')
          write(p,s)

          # documents.ts — initialize safely, never duplicate pending payment intent, require due dates.
          p='src/lib/documents.ts'; s=read(p)
          s=rep(s,"id: makeId('doc'), kind, role:'standard', status: 'draft', lifecycleStatus:'active', revision:1, creditForId:'', creditForNumber:'', voidedAt:'', voidReason:'', bankAccountId:company.defaultBankAccountId||'primary', paymentTermPresetId:paymentPreset?.id||'', number, issueDate,","id: makeId('doc'), kind, role:'standard', status: 'draft', lifecycleStatus:'active', revision:1, creditForId:'', creditForNumber:'', voidedAt:'', voidReason:'', bankAccountId:company.defaultBankAccountId||'primary', paymentTermPresetId:paymentPreset?.id||'', settlementPlan:null, number, issueDate,",'blank settlement')
          s=rep(s,"return { ...structuredClone(source), id: makeId('doc'), number, issueDate, dueDate, role:'standard', status: 'draft', lifecycleStatus:'active', revision:1, creditForId:'', creditForNumber:'', voidedAt:'', voidReason:'', convertedFromId: '', createdAt: now, updatedAt: now, items:","return { ...structuredClone(source), id: makeId('doc'), number, issueDate, dueDate, role:'standard', status: 'draft', lifecycleStatus:'active', revision:1, creditForId:'', creditForNumber:'', voidedAt:'', voidReason:'', settlementPlan:null, convertedFromId: '', createdAt: now, updatedAt: now, items:",'duplicate clears settlement')
          s=rep(s,"  if (doc.kind === 'proforma' && !doc.dueDate) errors.dueDate = 'Valid until date is required.';","  if (!doc.dueDate) errors.dueDate = doc.kind==='proforma' ? 'Valid until date is required.' : 'Due date is required.';",'invoice due required')
          write(p,s)

          # Arabic validation copy.
          p='src/lib/i18n.ts'; s=read(p)
          s=rep(s,"    'Due date is invalid.':'تاريخ الاستحقاق غير صالح.',","    'Due date is required.':'تاريخ الاستحقاق مطلوب.',\n    'Due date is invalid.':'تاريخ الاستحقاق غير صالح.',",'due required translation')
          write(p,s)

          # Vault migration/normalization.
          p='src/storage/vault.ts'; s=read(p)
          s=rep(s,"const PAYMENT_METHODS = new Set(['cash','bank-transfer','card','cheque','other']);","const PAYMENT_METHODS = new Set(['cash','bank-transfer','card','cheque','other']);\nconst SETTLEMENT_MODES = new Set(['due-on-receipt','on-account','partial','paid']);",'settlement modes set')
          anchor="function normalizePaymentTermPresets(value:unknown,fallback:any[]):any[]{if(!Array.isArray(value))return fallback.map(item=>({...item}));const seen=new Set<string>();const result:any[]=[];value.forEach((preset:any,index)=>{const id=stringValue(preset?.id,`term-${index+1}`).trim()||`term-${index+1}`;if(seen.has(id))return;seen.add(id);result.push({id,label:stringValue(preset?.label),days:Math.min(3650,Math.max(0,Math.trunc(finiteNumber(preset?.days,0))))});});return result;}"
          helper="""function normalizePaymentTermPresets(value:unknown,fallback:any[]):any[]{if(!Array.isArray(value))return fallback.map(item=>({...item}));const seen=new Set<string>();const result:any[]=[];value.forEach((preset:any,index)=>{const id=stringValue(preset?.id,`term-${index+1}`).trim()||`term-${index+1}`;if(seen.has(id))return;seen.add(id);result.push({id,label:stringValue(preset?.label),days:Math.min(3650,Math.max(0,Math.trunc(finiteNumber(preset?.days,0))))});});return result;}
function normalizeSettlementPlan(value:unknown):any{const plan=value as any;if(!plan||typeof plan!=='object'||!SETTLEMENT_MODES.has(plan.mode))return null;return{mode:plan.mode,dueDate:stringValue(plan.dueDate),paymentTermPresetId:stringValue(plan.paymentTermPresetId),paymentTerms:stringValue(plan.paymentTerms),paymentAmount:stringValue(plan.paymentAmount),paymentDate:stringValue(plan.paymentDate),paymentMethod:PAYMENT_METHODS.has(plan.paymentMethod)?plan.paymentMethod:'bank-transfer',paymentReference:stringValue(plan.paymentReference),paymentNotes:stringValue(plan.paymentNotes)};}"""
          s=rep(s,anchor,helper,'settlement normalizer')
          s=rep(s,"voidReason:stringValue(document?.voidReason), bankAccountId:stringValue(document?.bankAccountId), paymentTermPresetId:stringValue(document?.paymentTermPresetId),\n      number:stringValue(document?.number)","voidReason:stringValue(document?.voidReason), bankAccountId:stringValue(document?.bankAccountId), paymentTermPresetId:stringValue(document?.paymentTermPresetId), settlementPlan:normalizeSettlementPlan(document?.settlementPlan),\n      number:stringValue(document?.number)",'normalize settlement field')
          s=rep(s,"snapshot.role=snapshot.role==='credit-note'?'credit-note':'standard';snapshot.lifecycleStatus=snapshot.lifecycleStatus==='voided'?'voided':'active';snapshot.revision=Math.max(1,Math.trunc(finiteNumber(snapshot.revision,1)));snapshot.creditForId=stringValue(snapshot.creditForId);snapshot.creditForNumber=stringValue(snapshot.creditForNumber);snapshot.voidedAt=stringValue(snapshot.voidedAt);snapshot.voidReason=stringValue(snapshot.voidReason);","snapshot.role=snapshot.role==='credit-note'?'credit-note':'standard';snapshot.lifecycleStatus=snapshot.lifecycleStatus==='voided'?'voided':'active';snapshot.revision=Math.max(1,Math.trunc(finiteNumber(snapshot.revision,1)));snapshot.creditForId=stringValue(snapshot.creditForId);snapshot.creditForNumber=stringValue(snapshot.creditForNumber);snapshot.voidedAt=stringValue(snapshot.voidedAt);snapshot.voidReason=stringValue(snapshot.voidReason);snapshot.settlementPlan=normalizeSettlementPlan(snapshot.settlementPlan);",'revision settlement normalize')
          write(p,s)

          # Editor core — due date is a required invoice field too.
          p='src/components/EditorPageCore.tsx'; s=read(p)
          s=rep(s,"className={d.kind==='proforma'?'required-field':''} error={error('dueDate')}","className=\"required-field\" error={error('dueDate')}",'due date required UI')
          write(p,s)

          # Editor wrapper — conversion modal + relationship navigation.
          p='src/components/EditorPage.tsx'; s=read(p)
          s=rep(s,"import type { AppSettings, CompanySettings, Customer, DocumentEventRecord, DocumentItem, DocumentRevisionRecord, LourexDocument, PaymentRecord, SavedItem } from '../types.js';","import type { AppSettings, CompanySettings, Customer, DocumentEventRecord, DocumentItem, DocumentRevisionRecord, InvoiceSettlementPlan, LourexDocument, PaymentRecord, SavedItem } from '../types.js';",'editor settlement type import')
          s=rep(s,"import { ProfitabilityPanel } from './ProfitabilityPanel.js';","import { ProfitabilityPanel } from './ProfitabilityPanel.js';\nimport { InvoiceConversionModal } from './InvoiceConversionModal.js';",'conversion modal import')
          s=rep(s,"onCreateCreditNote:(doc:LourexDocument)=>Promise<void>; onConvert:(doc:LourexDocument)=>Promise<void>; onPrint:","onCreateCreditNote:(doc:LourexDocument)=>Promise<void>; onConvert:(doc:LourexDocument,plan:InvoiceSettlementPlan)=>Promise<void>; onOpenRelated:(doc:LourexDocument)=>void; onPrint:",'editor props')
          s=rep(s,"interface State {\n  sections:EditorSectionNavItem[];\n  activeSectionId:string;\n}","interface State {\n  sections:EditorSectionNavItem[];\n  activeSectionId:string;\n  conversionOpen:boolean;\n}",'editor state')
          s=rep(s,"this.state={sections:[],activeSectionId:''};","this.state={sections:[],activeSectionId:'',conversionOpen:false};",'editor initial state')
          marker="  render():any{\n    const props=this.props;"
          methods="""  private openConversion=(doc:LourexDocument)=>{
    const existing=this.props.documents.find(item=>item.kind==='invoice'&&item.role!=='credit-note'&&item.convertedFromId===doc.id);
    if(existing){this.props.onOpenRelated(existing);return;}
    this.setState({conversionOpen:true});
  };
  private confirmConversion=async(plan:InvoiceSettlementPlan)=>{await this.props.onConvert(this.props.document,plan);this.setState({conversionOpen:false});};

  render():any{
    const props=this.props;"""
          s=rep(s,marker,methods,'editor conversion methods')
          s=rep(s,"    const canConvertFinalQuote=props.document.kind==='proforma'&&props.document.status==='final'&&props.document.lifecycleStatus!=='voided';","    const convertedInvoice=props.document.kind==='proforma'?props.documents.find(item=>item.kind==='invoice'&&item.role!=='credit-note'&&item.convertedFromId===props.document.id):undefined;\n    const sourceQuote=props.document.kind==='invoice'&&props.document.convertedFromId?props.documents.find(item=>item.id===props.document.convertedFromId&&item.kind==='proforma'):undefined;\n    const canConvertFinalQuote=props.document.kind==='proforma'&&props.document.status==='final'&&props.document.lifecycleStatus!=='voided'&&!convertedInvoice;",'related documents')
          s=rep(s,"      <EditorPageCore key={props.document.id} {...props} onSave={this.saveWithProtectedRetry}/>","      <EditorPageCore key={props.document.id} {...props} onSave={this.saveWithProtectedRetry} onConvert={this.openConversion}/>",'core conversion interception')
          relationship="""      {convertedInvoice?<div className="document-relationship-bar is-converted"><div><Icon name="invoice" size={18}/><span><strong>{t('Converted invoice','الفاتورة المحوّلة')}</strong><small>{convertedInvoice.number}</small></span></div><Button variant="secondary" onClick={()=>props.onOpenRelated(convertedInvoice)}>{t('Open linked invoice','فتح الفاتورة المرتبطة')}</Button></div>:null}
      {sourceQuote?<div className="document-relationship-bar"><div><Icon name="proforma" size={18}/><span><strong>{t('Source quote','عرض السعر المصدر')}</strong><small>{sourceQuote.number}</small></span></div><Button variant="secondary" onClick={()=>props.onOpenRelated(sourceQuote)}>{t('Open source quote','فتح عرض السعر المصدر')}</Button></div>:null}
      {props.document.kind==='invoice'&&props.document.status==='draft'&&props.document.settlementPlan?<div className="pending-settlement-banner"><Icon name="invoice" size={16}/><span><strong>{t('Settlement selected','تم اختيار طريقة السداد')}</strong> · {props.document.settlementPlan.paymentTerms}{props.document.settlementPlan.paymentAmount?` · ${props.document.settlementPlan.paymentAmount} ${props.document.currency}`:''}</span></div>:null}
"""
          s=rep(s,"      <DocumentLifecyclePanel document={props.document}",relationship+"      <DocumentLifecyclePanel document={props.document}",'relationship bars')
          s=rep(s,"onClick={()=>void props.onConvert(props.document)}","onClick={()=>this.openConversion(props.document)}",'final quote convert action')
          s=rep(s,"      {canConvertFinalQuote?<div className=\"final-quote-convert-bar\"","      {props.document.kind==='proforma'?<InvoiceConversionModal open={this.state.conversionOpen} source={props.document} paymentTermPresets={props.company.commercial.paymentTermPresets} onClose={()=>this.setState({conversionOpen:false})} onConfirm={this.confirmConversion}/>:null}\n      {canConvertFinalQuote?<div className=\"final-quote-convert-bar\"",'conversion modal render')
          write(p,s)

          # App — safe conversion, duplicate protection, and payment-on-issue.
          p='src/app/App.tsx'; s=read(p)
          s=rep(s,"import type { AppSettings, CompanySettings, Customer, DocumentKind, EncryptedVaultRecord, ExpenseRecord, InventoryMovementRecord, LourexDocument, PaymentRecord, PurchaseRecord, SavedItem, Supplier, UiLanguage, VaultPayload } from '../types.js';","import type { AppSettings, CompanySettings, Customer, DocumentKind, EncryptedVaultRecord, ExpenseRecord, InventoryMovementRecord, InvoiceSettlementPlan, LourexDocument, PaymentRecord, PurchaseRecord, SavedItem, Supplier, UiLanguage, VaultPayload } from '../types.js';",'app settlement type import')
          s=rep(s,"import { safeFilename } from '../lib/id.js';","import { makeId, safeFilename } from '../lib/id.js';",'make id import')

          save_method="""  private saveDocument=async(doc:LourexDocument,auto=false)=>{
    const vault=this.requireVault();
    if(vault.documents.some(d=>d.id!==doc.id&&d.number.trim().toLowerCase()===doc.number.trim().toLowerCase()))throw new Error(t('Document number already exists.','رقم المستند مستخدم بالفعل.'));
    const index=vault.documents.findIndex(d=>d.id===doc.id);const existing=index>=0?vault.documents[index]:undefined;
    if(existing?.lifecycleStatus==='voided')throw new Error(t('Voided documents are locked permanently.','المستندات الملغاة مقفلة بشكل دائم.'));
    let updated={...doc,role:doc.role||'standard',lifecycleStatus:doc.lifecycleStatus||'active',revision:Math.max(1,doc.revision||1),creditForId:doc.creditForId||'',creditForNumber:doc.creditForNumber||'',voidedAt:doc.voidedAt||'',voidReason:doc.voidReason||'',bankAccountId:doc.bankAccountId||'',paymentTermPresetId:doc.paymentTermPresetId||'',settlementPlan:doc.settlementPlan||null,updatedAt:new Date().toISOString()};
    const issuing=updated.status==='final'&&existing?.status!=='final';
    if(issuing)assertCustomerCreditLimit(updated,vault.customers,vault.documents,vault.payments);
    let payments=vault.payments;let issuedPayment:PaymentRecord|undefined;
    const draftDocuments=[...vault.documents];if(index>=0)draftDocuments[index]=updated;else draftDocuments.push(updated);
    const plan=issuing?updated.settlementPlan:null;
    if(plan&&(plan.mode==='paid'||plan.mode==='partial')&&!vault.payments.some(payment=>payment.invoiceId===updated.id)){
      const now=new Date().toISOString();
      const raw:PaymentRecord={id:makeId('pay'),invoiceId:updated.id,invoiceNumber:updated.number,customerId:updated.customerSnapshot?.sourceCustomerId||'',customerNameEn:updated.customerSnapshot?.companyNameEn||'',customerNameAr:updated.customerSnapshot?.companyNameAr||'',currency:updated.currency,amount:plan.paymentAmount,date:plan.paymentDate||updated.issueDate,method:plan.paymentMethod,reference:plan.paymentReference,notes:plan.paymentNotes,createdAt:now,updatedAt:now};
      issuedPayment=normalizePaymentRecord(updated,payments,raw,draftDocuments);payments=[...payments,issuedPayment];
    }
    if(issuing&&updated.settlementPlan)updated={...updated,settlementPlan:null};
    const documents=[...vault.documents];if(index>=0)documents[index]=updated;else documents.push(updated);
    assertInvoicePaymentInvariant(updated,payments,documents);assertDocumentLifecycleInvariant(updated,documents,payments);
    let documentEvents=vault.documentEvents;
    if(!existing){documentEvents=[...documentEvents,createDocumentEvent(updated,'created')];if(updated.status==='final')documentEvents=[...documentEvents,createDocumentEvent(updated,updated.revision>1?'reissued':'issued')];}
    else if(existing.status==='draft'&&updated.status==='final')documentEvents=[...documentEvents,createDocumentEvent(updated,updated.revision>1?'reissued':'issued')];
    if(issuedPayment)documentEvents=[...documentEvents,createDocumentEvent(updated,'payment-recorded',issuedPayment.reference,undefined,issuedPayment.amount)];
    const appSettings=auto?vault.appSettings:{...vault.appSettings,smartDefaults:{...vault.appSettings.smartDefaults,currency:updated.currency,language:updated.language,incoterm:updated.terms.incoterm,paymentTerms:updated.terms.paymentTerms,deliveryTime:updated.terms.deliveryTime,[updated.kind==='proforma'?'quoteTemplateId':'invoiceTemplateId']:updated.appearance.templateId}};
    await this.persist({...vault,documents,payments,documentEvents,appSettings});this.setState({editorDoc:updated});if(!auto)this.showToast(t('Document saved. Smart defaults updated.','تم حفظ المستند وتحديث الإعدادات الذكية.'),'success');
  };
"""
          s=sub(s,r"  private saveDocument=async\(doc:LourexDocument,auto=false\)=>\{.*?\n  private beginRevision=",save_method+"  private beginRevision=",'save document payment-on-issue',re.S)

          convert_method="""  private convert=async(source:LourexDocument,plan:InvoiceSettlementPlan)=>{try{
    const current=this.requireVault();
    if(source.kind!=='proforma'||source.status!=='final')throw new Error(t('Only a Final quote can be converted to an invoice.','يمكن تحويل عرض سعر نهائي فقط إلى فاتورة.'));
    if(source.lifecycleStatus==='voided')throw new Error(t('A cancelled quote cannot be converted to an invoice.','لا يمكن تحويل عرض سعر ملغى إلى فاتورة.'));
    const already=current.documents.find(d=>d.kind==='invoice'&&d.role!=='credit-note'&&d.convertedFromId===source.id);
    if(already)throw new Error(t(`This quote has already been converted to ${already.number}.`,`تم تحويل عرض السعر هذا مسبقًا إلى ${already.number}.`));
    const errors=validateDocument(source);if(Object.keys(errors).length)throw new Error(t('Save a valid Proforma before converting it.','احفظ عرض سعر صالحًا قبل تحويله.'));
    if(current.documents.some(d=>d.id!==source.id&&d.number.trim().toLowerCase()===source.number.trim().toLowerCase()))throw new Error(t('Document number already exists.','رقم المستند مستخدم بالفعل.'));
    const savedSource={...source,updatedAt:new Date().toISOString()};const sourceIndex=current.documents.findIndex(d=>d.id===source.id);const sourceDocuments=[...current.documents];if(sourceIndex>=0)sourceDocuments[sourceIndex]=savedSource;else sourceDocuments.push(savedSource);
    const withSource={...current,documents:sourceDocuments};const numbered=nextDocumentNumber(withSource,'invoice');let converted=convertToInvoice(savedSource,numbered.number);
    const preset=plan.paymentTermPresetId?paymentTermPresetById(current.company,plan.paymentTermPresetId):null;if(preset)converted=applyPaymentTermPreset(converted,preset);
    const immediate=plan.mode==='paid'||plan.mode==='due-on-receipt';const dueDate=immediate?converted.issueDate:(plan.dueDate||converted.dueDate);
    if(!dueDate)throw new Error(t('Choose an invoice due date.','اختر تاريخ استحقاق الفاتورة.'));
    const normalizedPlan:InvoiceSettlementPlan={...plan,dueDate,paymentTermPresetId:preset?.id||plan.paymentTermPresetId||'',paymentTerms:plan.paymentTerms||preset?.label||converted.terms.paymentTerms,paymentAmount:plan.mode==='paid'?plan.paymentAmount:plan.mode==='partial'?plan.paymentAmount:'',paymentDate:(plan.mode==='paid'||plan.mode==='partial')?(plan.paymentDate||converted.issueDate):'',paymentReference:(plan.paymentReference||'').trim(),paymentNotes:(plan.paymentNotes||'').trim()};
    converted={...converted,dueDate,paymentTermPresetId:normalizedPlan.paymentTermPresetId,terms:{...converted.terms,paymentTerms:normalizedPlan.paymentTerms},settlementPlan:normalizedPlan};
    const convertedDocuments=[...sourceDocuments,converted];const documentEvents=[...current.documentEvents,createDocumentEvent(savedSource,'converted','',converted),createDocumentEvent(converted,'created','',savedSource)];
    await this.persist({...numbered.vault,documents:convertedDocuments,documentEvents});this.setState({screen:'editor',editorDoc:converted});this.showToast(t(`Created ${converted.number}. Review it, then issue it.`,`تم إنشاء ${converted.number}. راجع الفاتورة ثم قم بإصدارها.`),'success');
  }catch(e){this.showToast(e instanceof Error?e.message:t('Conversion failed.','فشل التحويل.'),'error');throw e;}};
"""
          s=sub(s,r"  private convert=async\(source:LourexDocument\)=>\{.*?\n  private deleteDocument=",convert_method+"  private deleteDocument=",'convert workflow',re.S)
          s=rep(s,"onCreateCreditNote={this.createCreditNote} onConvert={this.convert} onPrint={this.requestPrint}","onCreateCreditNote={this.createCreditNote} onConvert={this.convert} onOpenRelated={(doc)=>void this.openDocument(doc)} onPrint={this.requestPrint}",'related open prop')
          write(p,s)

          # index and PWA cache.
          p='index.html'; s=read(p)
          s=rep(s,'  <link rel="stylesheet" href="./styles/document-premium-redesign-v141.css" />','  <link rel="stylesheet" href="./styles/document-premium-redesign-v141.css" />\n  <link rel="stylesheet" href="./styles/invoice-conversion-v194.css" />','conversion css link')
          write(p,s)

          p='public/sw.js'; s=read(p)
          s=rep(s,"const CACHE = 'lourex-invoice-v159';","const CACHE = 'lourex-invoice-v160';",'pwa cache bump')
          s=rep(s,'"./styles/document-premium-redesign-v141.css"','"./styles/document-premium-redesign-v141.css","./styles/invoice-conversion-v194.css"','pwa conversion css')
          s=rep(s,'"./src/components/InvoicePaymentsPanel.js"','"./src/components/InvoiceConversionModal.js","./src/components/InvoicePaymentsPanel.js"','pwa conversion module')
          write(p,s)
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-invoice-conversion-settlement.yml
          git add src index.html public/sw.js tests .github/workflows/apply-invoice-conversion-settlement.yml
          git commit -m "Build invoice conversion settlement workflow"
          git push origin HEAD:feature/invoice-conversion-settlement
