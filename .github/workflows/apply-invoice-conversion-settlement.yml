name: Apply invoice conversion settlement
on:
  push:
    branches:
      - feature/invoice-conversion-settlement
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/invoice-conversion-settlement
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply targeted source changes
        run: |
          python scripts/apply_invoice_conversion.py
          python scripts/fix_invoice_conversion_signature.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-invoice-conversion-settlement.yml scripts/apply_invoice_conversion.py scripts/fix_invoice_conversion_signature.py
          git add src index.html public/sw.js tests .github/workflows scripts
          git commit -m "Build invoice conversion settlement workflow"
          git push origin HEAD:feature/invoice-conversion-settlement
