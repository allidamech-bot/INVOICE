name: LOUREX Free Pre-Merge Verification

on:
  push:
    branches:
      - fix/audit-workspace-payables-asof-20261009
      - fix/audit-ai-verified-auth-20261009
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24 · typecheck · build · integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript validation
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Focused accounting and AI integration regressions
        shell: bash
        run: |
          files=()
          for f in \
            tests/audit-supplier-payables-asof.test.mjs \
            tests/audit-supplier-payment-void-merge.test.mjs \
            tests/audit-treasury-void-history.test.mjs \
            tests/audit-inventory-planning-scope.test.mjs \
            tests/accounts-payable-batch9.test.mjs \
            tests/audit-ai-firebase-auth.test.mjs \
            tests/audit-ai-client-token-safety.test.mjs \
            tests/ai-reliability-batch5.test.mjs \
            tests/b04-attachment-progress.test.mjs \
            tests/b04-ai-planner-failure-visibility.test.mjs \
            tests/b04-source-aware-tool-planner.test.mjs
          do
            if [[ -f "$f" ]]; then files+=("$f"); fi
          done
          printf 'Running %s focused test files\n' "${#files[@]}"
          node --test --test-concurrency=2 "${files[@]}"
      - name: Complete Node test suite
        run: node --test --test-concurrency=2 tests/*.test.mjs

  combined-integration:
    name: Integrate PR652 + PR653 safely (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: In-memory merge of security branch into accounting branch
        shell: bash
        run: |
          git fetch origin fix/audit-ai-verified-auth-20261009:refs/remotes/origin/fix/audit-ai-verified-auth-20261009
          if ! git -c user.name='LOUREX QA' -c user.email='qa@invalid.local' merge --no-edit --no-commit --no-ff origin/fix/audit-ai-verified-auth-20261009; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            # Both independent PRs created the same QA workflow file. Keep the
            # current job definition, but reject ALL source/test merge conflicts.
            if [[ "$conflicts" != ".github/workflows/lourex-free-premerge.yml" ]]; then
              printf 'UNRESOLVED SOURCE CONFLICTS: %s\\n' "$conflicts"
              exit 1
            fi
            git checkout --ours .github/workflows/lourex-free-premerge.yml
            git add .github/workflows/lourex-free-premerge.yml
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          git status --short
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Locked install
        run: npm ci --no-audit --no-fund
      - name: Combined TypeScript check
        run: npm run typecheck
      - name: Combined production build
        run: npm run build
      - name: Combined accounting and AI regression tests
        run: >
          node --test --test-concurrency=2
          tests/audit-supplier-payables-asof.test.mjs
          tests/audit-supplier-payment-void-merge.test.mjs
          tests/audit-treasury-void-history.test.mjs
          tests/audit-inventory-planning-scope.test.mjs
          tests/accounts-payable-batch9.test.mjs
          tests/audit-ai-firebase-auth.test.mjs
          tests/audit-ai-client-token-safety.test.mjs
          tests/ai-reliability-batch5.test.mjs
          tests/b04-attachment-progress.test.mjs
          tests/b04-ai-planner-failure-visibility.test.mjs
          tests/b04-source-aware-tool-planner.test.mjs
          tests/ai-review-safety-contract.test.mjs
