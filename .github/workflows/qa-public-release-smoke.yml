name: LOUREX production public release smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/qa-public-release-smoke.mjs'
      - 'scripts/qa-production-ai-auth-boundary.mjs'
      - '.github/workflows/qa-public-release-smoke.yml'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Require exact deployed SHA on manual release acceptance; blank means check identity only'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify-public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check publicly served build identity and app assets (read-only, zero provider calls)
        env:
          LOUREX_EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || '' }}
        run: node scripts/qa-public-release-smoke.mjs
      - name: Assert live AI gateways reject unsigned and cross-origin requests
        run: node scripts/qa-production-ai-auth-boundary.mjs
