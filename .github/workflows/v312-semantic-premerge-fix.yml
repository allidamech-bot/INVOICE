name: LOUREX v312 final semantic pre-merge fixes

on:
  push:
    branches:
      - feature/v312-business-document-suite

permissions:
  contents: write

concurrency:
  group: v312-semantic-premerge-fix
  cancel-in-progress: true

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v312-business-document-suite
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply audited semantic fixes
        run: python3 scripts/v312-semantic-premerge-fix.py
      - name: Diff sanity
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Full unit suite
        run: node scripts/run-unit-tests.mjs
      - name: v312 focused regression suite
        run: node --test tests/v312-business-document-suite.test.mjs
      - name: Commit clean fixes and remove temporary tooling
        run: |
          rm scripts/v312-semantic-premerge-fix.py
          rm .github/workflows/v312-semantic-premerge-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/document-entry-v302.js src/app/App.tsx src/components/DocumentLifecyclePanel.tsx src/components/EditorPageCore.tsx src/lib/document-kinds.ts src/lib/document-quality.ts src/lib/documents.ts src/lib/i18n.ts src/templates/TemplateRenderer.tsx tests/v312-business-document-suite.test.mjs scripts/v312-semantic-premerge-fix.py .github/workflows/v312-semantic-premerge-fix.yml
          git commit -m "fix(v312): finalize semantic pre-merge audit"
          git push origin HEAD:feature/v312-business-document-suite
