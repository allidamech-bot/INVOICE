name: LOUREX Auth Regression Remediation (Free)
on:
  push:
    branches:
      - fix/audit-legacy-security-logout-20261009
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lourex-auth-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build production candidate locally without deploying
        run: npm run build
      - name: Enforce real logout and account isolation regressions
        run: |
          node --test \
            tests/audit-confirmed-signout.test.mjs \
            tests/audit-account-transition-runtime.test.mjs \
            tests/account-required-after-logout-v188.test.mjs \
            tests/account-data-isolation-v215.test.mjs
      - name: Record unresolved historical suite failures without hiding them
        shell: bash
        run: |
          set +e
          node --test tests/*.test.mjs > "${RUNNER_TEMP}/historical-node-suite.log" 2>&1
          exit_code=$?
          set -e
          grep -E '^ℹ (tests|pass|fail) ' "${RUNNER_TEMP}/historical-node-suite.log" || true
          echo "Full historical suite exit code: $exit_code"
          if [[ "$exit_code" != "0" ]]; then
            echo "::warning::Existing failures remain; historical suite is not green."
          fi

  combined-branch-security:
    name: PR652 + PR653 + PR660 integration (no push or Production)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Merge accounting and AI branches in local runner only
        shell: bash
        run: |
          git config user.name 'LOUREX QA'
          git config user.email 'qa@invalid.local'
          for branch in fix/audit-workspace-payables-asof-20261009 fix/audit-ai-verified-auth-20261009; do
            git fetch origin "$branch:refs/remotes/origin/$branch"
            if [[ "$branch" == "fix/audit-ai-verified-auth-20261009" ]] && [[ "$(git rev-parse "origin/$branch")" != "ae6500ca69a6cdde88fdd3992872fc59bddf76fb" ]]; then
              echo 'AI PR changed after manual review of its account-transition hunks; re-audit required.'
              exit 1
            fi
            if ! git merge --no-ff --no-edit "origin/$branch"; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              while IFS= read -r file; do
                case "$file" in
                  .github/workflows/lourex-free-premerge.yml)
                    # Both independent PRs install the same diagnostic workflow.
                    git checkout --ours "$file"; git add "$file" ;;
                  tests/account-data-isolation-v215.test.mjs|tests/account-required-after-logout-v188.test.mjs)
                    # PR660 replaces obsolete source-shape assertions with stronger
                    # executable auth and account transition behavior regressions.
                    git checkout --ours "$file"; git add "$file" ;;
                  src/app/App.tsx|src/app/index.tsx)
                    # At the reviewed pinned AI commit, PR653 touches these two
                    # files ONLY in the older auth transition/logout implementation.
                    # Retain the newer PR660 fail-closed implementation together
                    # with all already-merged PR652 finance changes. AI endpoint
                    # changes elsewhere are still merged and exercised below.
                    if [[ "$branch" != "fix/audit-ai-verified-auth-20261009" ]]; then
                      echo "Unexpected application conflict before AI branch: $file"
                      exit 1
                    fi
                    git checkout --ours "$file"; git add "$file" ;;
                  *)
                    echo "Unresolved application/source conflict: $file"
                    exit 1 ;;
                esac
              done <<< "$conflicts"
              git commit --no-edit
            fi
          done
          test -z "$(git diff --name-only --diff-filter=U)"
          echo 'Three-branch local integration succeeded without pushing.'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and typecheck combined candidate
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Build combined production bundle locally (no deploy)
        run: npm run build
      - name: Run combined high-risk auth, accounting and AI tests
        run: |
          node --test --test-concurrency=2 \
            tests/audit-confirmed-signout.test.mjs \
            tests/audit-account-transition-runtime.test.mjs \
            tests/account-data-isolation-v215.test.mjs \
            tests/account-required-after-logout-v188.test.mjs \
            tests/audit-supplier-payables-asof.test.mjs \
            tests/audit-supplier-payment-void-merge.test.mjs \
            tests/audit-treasury-void-history.test.mjs \
            tests/audit-ai-firebase-auth.test.mjs \
            tests/audit-ai-client-token-safety.test.mjs
      - name: Entire three-branch Node suite (must pass for final release)
        shell: bash
        run: |
          set +e
          timeout --signal=TERM 120s node --test --test-concurrency=2 tests/*.test.mjs > "${RUNNER_TEMP}/combined-three-pr-suite.log" 2>&1
          exit_code=$?
          set -e
          if [[ "$exit_code" == "124" ]]; then
            echo "::error::Combined full suite exceeded 120 seconds: probable hanging test or open handle."
            echo 'Last 80 lines before timeout:'
            tail -n 80 "${RUNNER_TEMP}/combined-three-pr-suite.log"
          fi
          echo "Full combined suite (PR652 + PR653 + PR660):"
          grep -E '^ℹ (tests|pass|fail) ' "${RUNNER_TEMP}/combined-three-pr-suite.log" || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const log=fs.readFileSync(process.env.RUNNER_TEMP+'/combined-three-pr-suite.log','utf8');
          const summary=['### Full combined suite (not a differential waiver)'];
          for(const key of ['tests','pass','fail']){
            const value=log.match(new RegExp('ℹ '+key+' (\\d+)'))?.[1]??'unknown';
            summary.push('- '+key+': '+value);
          }
          const failures=log.split('✖ failing tests:')[1]||'';
          const tests=failures.split(/\r?\n/).filter(line=>line.startsWith('✖ ')).map(line=>line.replace(/ \([\d.]+ms\)$/,''));
          summary.push('- Failure listings: '+tests.length,'');
          summary.push(...tests.slice(0,80).map(line=>'- '+line));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary.join('\n')+'\n');
          NODE
          if [[ "$exit_code" != "0" ]]; then
            echo "::error::Full three-branch suite is not green. This is a release blocker."
            exit "$exit_code"
          fi
