name: QA Live Preview v562

on:
  push:
    branches:
      - qa/live-fixes-v562
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token)
      - name: Probe protected Vercel preview
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          PREVIEW_URL: https://invoice-git-qa-live-fixes-v562-alidaamishs-projects.vercel.app
        run: |
          set -euo pipefail
          inspect() {
            path="$1"
            name=$(echo "$path" | tr '/?' '__')
            headers="/tmp/$name.headers"
            body="/tmp/$name.body"
            code=$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' \
              -H "x-vercel-trusted-oidc-idp-token: $OIDC_TOKEN" \
              "$PREVIEW_URL$path")
            echo "DIRECT $path -> HTTP $code"
            sed -n '1,20p' "$headers" | grep -Ev 'set-cookie|authorization' || true
            final=$(curl -sS -L -o "$body.follow" -w '%{http_code} %{url_effective}' \
              -H "x-vercel-trusted-oidc-idp-token: $OIDC_TOKEN" \
              "$PREVIEW_URL$path")
            echo "FOLLOW $path -> $final"
            head -c 300 "$body.follow" | tr '\n' ' '
            echo
          }
          inspect "/"
          inspect "/runtime-config.js"
          inspect "/health.html"
          curl -sS -L -o /tmp/runtime.js \
            -H "x-vercel-trusted-oidc-idp-token: $OIDC_TOKEN" \
            "$PREVIEW_URL/runtime-config.js"
          grep -q "invoice-three-puce.vercel.app\|runtimeConfig\|__LOUREX" /tmp/runtime.js
          ! grep -q "FUNCTION_INVOCATION_FAILED" /tmp/runtime.js
