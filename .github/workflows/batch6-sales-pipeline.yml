name: LOUREX Sales Pipeline QA

on:
  pull_request:
    paths:
      - 'src/lib/sales-pipeline.ts'
      - 'src/lib/sales-pipeline-style.ts'
      - 'src/components/SalesPipelineLive.tsx'
      - 'src/components/CustomersPage.tsx'
      - 'src/styles/sales-pipeline-batch6.css'
      - 'tests/sales-pipeline-batch6.test.mjs'
      - 'tests/visual/sales-pipeline-batch6.html'
      - 'tests/visual/run-sales-pipeline-batch6.cjs'
      - '.github/workflows/batch6-sales-pipeline.yml'

permissions:
  contents: read

jobs:
  sales-pipeline:
    name: Batch 6 sales pipeline gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Batch 6 CRM engine and placement contracts
        run: node --test tests/sales-pipeline-batch6.test.mjs
      - name: Install Chromium QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run Pipeline mobile RTL and desktop browser QA
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/lourex-batch6-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/tests/visual/sales-pipeline-batch6.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lourex-batch6-server.log
            exit 1
          fi
          timeout --signal=TERM --kill-after=15s 180s node tests/visual/run-sales-pipeline-batch6.cjs
      - name: Upload Batch 6 visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lourex-batch6-sales-pipeline-visual-qa
          path: visual-qa-output/sales-pipeline-batch6
          if-no-files-found: ignore
