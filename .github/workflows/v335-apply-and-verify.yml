name: v335 apply and verify

on:
  push:
    branches:
      - audit/v335-inventory-purchasing-deep-closeout

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/v335-inventory-purchasing-deep-closeout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply audited v335 edits
        run: node scripts/v335-apply.mjs
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Security gate
        run: node scripts/security-check.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Inventory and purchasing regressions
        run: node --test tests/operations-production-hardening.test.mjs tests/v335-inventory-purchasing-deep-closeout.test.mjs
      - name: Commit verified v335 changes
        shell: bash
        run: |
          git config user.name 'allidamech-bot'
          git config user.email 'allidamech@gmail.com'
          git rm .github/workflows/v335-apply-and-verify.yml scripts/v335-apply.mjs
          git add src/lib/operations.ts src/components/OperationsPage.tsx src/app/App.tsx src/storage/vault-merge.ts src/styles/tailadmin-operations-v320.css tests/v335-inventory-purchasing-deep-closeout.test.mjs
          git commit -m 'v335: harden inventory and purchasing workflows'
          git push origin HEAD:audit/v335-inventory-purchasing-deep-closeout
