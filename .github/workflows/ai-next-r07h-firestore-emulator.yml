name: LOUREX AI Next R07H Real Firestore Emulator Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/ai-next/r07h-firestore-emulator.test.mjs'
      - 'tests/ai-next/r07h-firebase-emulator.json'
      - '.github/workflows/ai-next-r07h-firestore-emulator.yml'
      - 'src/ai-next/storage/firestore-sharded-events.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-next-r07h-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      GCLOUD_PROJECT: demo-ai-next-r07h
      GOOGLE_CLOUD_PROJECT: demo-ai-next-r07h
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Compile real SDK test target
        run: npm run typecheck && ./node_modules/.bin/tsc -p tsconfig.json
      - name: Run strictly local Firestore Emulator via pinned Firebase CLI
        env:
          FIREBASE_CLI_EXPERIMENTS: ''
        run: >-
          npx --yes --package firebase-tools@14.16.0 firebase
          emulators:exec
          --only firestore
          --project demo-ai-next-r07h
          --config tests/ai-next/r07h-firebase-emulator.json
          --non-interactive
          "node --test tests/ai-next/r07h-firestore-emulator.test.mjs"
