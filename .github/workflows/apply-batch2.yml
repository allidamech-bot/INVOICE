name: Apply Batch 2 Payments
on:
  push:
    branches: [agent/payments-collection-batch-2]
    paths:
      - scripts/apply-payments-batch2.mjs
      - .github/workflows/apply-batch2.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/payments-collection-batch-2
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: node scripts/apply-payments-batch2.mjs
      - name: Commit transformed batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-batch2.yml scripts/apply-payments-batch2.mjs
          git add -A
          git commit -m "feat: add payments and collection workflow"
          git push origin HEAD:agent/payments-collection-batch-2
