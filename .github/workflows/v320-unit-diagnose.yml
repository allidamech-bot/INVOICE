name: LOUREX v320 Unit Diagnose

on:
  push:
    branches:
      - feature/v320-tailadmin-finance-full-ui-rebuild
    paths:
      - .github/workflows/v320-unit-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Production build prerequisite
        run: npm run build
      - name: v320 current release contracts
        run: node --test tests/v320-release-contract.test.mjs
