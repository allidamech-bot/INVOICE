name: LOUREX v320 Unit Diagnose

on:
  push:
    branches:
      - feature/v320-tailadmin-finance-full-ui-rebuild
    paths:
      - .github/workflows/v320-unit-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Isolate unit test failures
        run: |
          mkdir -p /tmp/unit-logs
          : > /tmp/unit-failures.txt
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' -print | sort)
          for file in "${files[@]}"; do
            base=$(basename "$file")
            echo "### RUN $file"
            if node --test "$file" > "/tmp/unit-logs/${base}.log" 2>&1; then
              echo "### PASS $file"
            else
              echo "### FAIL $file"
              echo "$file" >> /tmp/unit-failures.txt
            fi
          done
          echo '## Failing unit test files' >> "$GITHUB_STEP_SUMMARY"
          if [ -s /tmp/unit-failures.txt ]; then
            cat /tmp/unit-failures.txt | tee -a "$GITHUB_STEP_SUMMARY"
            echo '--- concise failure excerpts ---'
            while IFS= read -r file; do
              base=$(basename "$file")
              echo "===== $file ====="
              grep -E -B3 -A10 'not ok|AssertionError|ERR_ASSERTION|Error:|error:' "/tmp/unit-logs/${base}.log" | tail -80 || tail -80 "/tmp/unit-logs/${base}.log"
            done < /tmp/unit-failures.txt
            exit 1
          else
            echo 'None' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload unit diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v320-unit-diagnostics
          path: |
            /tmp/unit-failures.txt
            /tmp/unit-logs
