name: Fix reports v135
on:
  push:
    branches:
      - agent/reports-multicurrency-batch-6
    paths:
      - scripts/fix-reports-v135.mjs
      - .github/workflows/fix-reports-v135.yml
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/reports-multicurrency-batch-6
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: node scripts/fix-reports-v135.mjs
      - run: rm scripts/fix-reports-v135.mjs .github/workflows/fix-reports-v135.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix reports typecheck and mobile navigation"
          git push origin HEAD:agent/reports-multicurrency-batch-6
