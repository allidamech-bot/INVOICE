name: LOUREX Documents ownership one-shot patch

on:
  push:
    branches:
      - feature/ia-ai-advisor-v276
    paths:
      - .github/workflows/ia-autofix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/ia-ai-advisor-v276
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Give credit notes a canonical Documents view
        shell: python
        run: |
          from pathlib import Path
          path=Path('src/components/DocumentsPage.tsx')
          text=path.read_text(encoding='utf-8')
          replacements=[
            ("tab:'all'|'proforma'|'invoice';","tab:'all'|'proforma'|'invoice'|'credit';"),
            ("""      if(this.state.tab!=='all'&&doc.kind!==this.state.tab)return false;""","""      if(this.state.tab==='proforma'&&(doc.kind!=='proforma'||doc.role!=='standard'))return false;\n      if(this.state.tab==='invoice'&&(doc.kind!=='invoice'||doc.role!=='standard'))return false;\n      if(this.state.tab==='credit'&&doc.role!=='credit-note')return false;"""),
            ("const invoices=this.props.documents.filter(doc=>doc.kind==='invoice').length;","const invoices=this.props.documents.filter(doc=>doc.kind==='invoice'&&doc.role==='standard').length;\n    const creditNotes=this.props.documents.filter(doc=>doc.role==='credit-note').length;"),
            ("Find, review and manage every quotation and invoice from one workspace.","Find, review and manage every quotation, invoice and credit note from one workspace."),
            ("ابحث وراجع وأدر كل عرض سعر وفاتورة من مساحة عمل واحدة.","ابحث وراجع وأدر عروض الأسعار والفواتير والإشعارات الدائنة من مساحة عمل واحدة."),
            ("""        <button type=\"button\" className={this.overviewActive('invoice','all')?'active':''} aria-pressed={this.overviewActive('invoice','all')} onClick={()=>this.setOverview('invoice','all')}><span>{t('Invoices','الفواتير')}</span><strong>{invoices}</strong></button>\n        <button type=\"button\" className={`${drafts?'has-drafts ':''}${this.overviewActive('all','draft')?'active':''}`}""","""        <button type=\"button\" className={this.overviewActive('invoice','all')?'active':''} aria-pressed={this.overviewActive('invoice','all')} onClick={()=>this.setOverview('invoice','all')}><span>{t('Invoices','الفواتير')}</span><strong>{invoices}</strong></button>\n        <button type=\"button\" className={this.overviewActive('credit','all')?'active':''} aria-pressed={this.overviewActive('credit','all')} onClick={()=>this.setOverview('credit','all')}><span>{t('Credit Notes','الإشعارات الدائنة')}</span><strong>{creditNotes}</strong></button>\n        <button type=\"button\" className={`${drafts?'has-drafts ':''}${this.overviewActive('all','draft')?'active':''}`}""")
          ]
          for old,new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected Documents anchor missing: {old[:80]}')
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
      - name: Verify TypeScript
        run: |
          npm ci
          npm run typecheck
      - name: Commit Documents ownership
        run: |
          git config user.name "allidamech-bot"
          git config user.email "allidamech-bot@users.noreply.github.com"
          git add src/components/DocumentsPage.tsx
          git commit -m "Give credit notes a canonical Documents view"
          git push origin HEAD:feature/ia-ai-advisor-v276
