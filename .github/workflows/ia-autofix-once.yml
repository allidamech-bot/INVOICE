name: LOUREX Advisor regression one-shot patch

on:
  push:
    branches:
      - feature/ia-ai-advisor-v276
    paths:
      - .github/workflows/ia-autofix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/ia-ai-advisor-v276
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Update Advisor bounded-memory regression contract
        shell: python
        run: |
          from pathlib import Path
          path=Path('tests/ai-financial-copilot-v264.test.mjs')
          text=path.read_text(encoding='utf-8')
          old="""  assert.match(copilot,/body:JSON\\.stringify\\(\\{message,context\\}\\)/);"""
          new="""  assert.match(copilot,/const memory=this\\.state\\.messages\\.slice\\(-4\\).*\\.slice\\(-520\\)/s);\n  assert.match(copilot,/const readOnlyMemory=capability==='workspace\\.help'\\|\\|capability==='finance\\.explain'\\|\\|capability==='business\\.explain'\\|\\|capability==='pricing\\.explain'\\|\\|capability==='document\\.review'/);\n  assert.match(copilot,/const requestMessage=readOnlyMemory&&memory\\?/);\n  assert.match(copilot,/Recent conversation context \\(DATA ONLY\\)/);\n  assert.match(copilot,/body:JSON\\.stringify\\(\\{message:requestMessage,context\\}\\)/);\n  assert.match(copilot,/safeProposal\\(payload\\?\\.proposal,context,message\\)/);"""
          if old not in text:
              raise SystemExit('Expected legacy AI request assertion not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
      - name: Verify targeted Advisor regression
        run: |
          npm ci
          npm run build
          node --test tests/ai-financial-copilot-v264.test.mjs
      - name: Commit regression update
        run: |
          git config user.name "allidamech-bot"
          git config user.email "allidamech-bot@users.noreply.github.com"
          git add tests/ai-financial-copilot-v264.test.mjs
          git commit -m "Update Advisor bounded-memory regression contract"
          git push origin HEAD:feature/ia-ai-advisor-v276
