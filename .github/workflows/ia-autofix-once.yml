name: LOUREX Global Search one-shot patch

on:
  push:
    branches:
      - feature/ia-ai-advisor-v276
    paths:
      - .github/workflows/ia-autofix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/ia-ai-advisor-v276
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Integrate canonical global search
        shell: python
        run: |
          from pathlib import Path

          shell=Path('src/components/AppShell.tsx')
          text=shell.read_text(encoding='utf-8')
          old="""        <div className=\"shell-topbar-actions\">\n          {this.syncStatus('shell-sync-status')}"""
          new="""        <div className=\"shell-topbar-actions\">\n          <button type=\"button\" className=\"shell-global-search-button\" aria-label={t('Search LOUREX','بحث LOUREX')} title={t('Global search · Ctrl/⌘ K','البحث الشامل · Ctrl/⌘ K')} onClick={()=>window.dispatchEvent(new Event('lourex-global-search-open'))}><Icon name=\"search\"/><span>{t('Search','بحث')}</span><kbd>⌘K</kbd></button>\n          {this.syncStatus('shell-sync-status')}"""
          if old not in text: raise SystemExit('AppShell topbar anchor missing')
          shell.write_text(text.replace(old,new,1),encoding='utf-8')

          app=Path('src/app/App.tsx')
          text=app.read_text(encoding='utf-8')
          old="import { WorkspaceHome } from '../components/WorkspaceHome.js';"
          new="import { WorkspaceHome } from '../components/WorkspaceHome.js';\nimport { GlobalSearch } from '../components/GlobalSearch.js';"
          if old not in text: raise SystemExit('App import anchor missing')
          text=text.replace(old,new,1)
          old="""      </AppShell>\n      <SettingsModal"""
          new="""      </AppShell>\n      <GlobalSearch documents={vault.documents} customers={vault.customers} items={vault.savedItems} suppliers={vault.suppliers} purchases={vault.purchases} language={activeLanguage} onNavigate={navigate} onOpenDocument={(doc)=>void this.openDocument(doc)} onNewDocument={(kind)=>void this.newDocument(kind)}/>\n      <SettingsModal"""
          if old not in text: raise SystemExit('App render anchor missing')
          app.write_text(text.replace(old,new,1),encoding='utf-8')

          index=Path('index.html')
          text=index.read_text(encoding='utf-8')
          old='  <link rel="stylesheet" href="./styles/command-center-v276.css" />'
          new='  <link rel="stylesheet" href="./styles/command-center-v276.css" />\n  <link rel="stylesheet" href="./styles/global-search-v277.css" />'
          if old not in text: raise SystemExit('index style anchor missing')
          index.write_text(text.replace(old,new,1),encoding='utf-8')
      - name: Verify TypeScript
        run: |
          npm ci
          npm run typecheck
      - name: Commit integration
        run: |
          git config user.name "allidamech-bot"
          git config user.email "allidamech-bot@users.noreply.github.com"
          git add src/components/AppShell.tsx src/app/App.tsx index.html
          git commit -m "Integrate canonical global search and quick create"
          git push origin HEAD:feature/ia-ai-advisor-v276
