name: LOUREX IA one-shot autofix

on:
  push:
    branches:
      - feature/ia-ai-advisor-v276
    paths:
      - .github/workflows/ia-autofix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/ia-ai-advisor-v276
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Apply narrowly scoped source fixes
        shell: python
        run: |
          from pathlib import Path

          app = Path('src/app/App.tsx')
          text = app.read_text(encoding='utf-8')
          old = "<ProductsInventoryWorkspace items={vault.savedItems} currency={defaultCurrency} onSaveItem={this.saveSavedItem} onSaveItems={this.saveSavedItemsBatch} onDeleteItem={this.deleteSavedItem} {...operationsProps}/>"
          new = "<ProductsInventoryWorkspace currency={defaultCurrency} onSaveItem={this.saveSavedItem} onSaveItems={this.saveSavedItemsBatch} onDeleteItem={this.deleteSavedItem} {...operationsProps}/>"
          if old not in text:
              raise SystemExit('Expected ProductsInventoryWorkspace call was not found')
          app.write_text(text.replace(old, new, 1), encoding='utf-8')

          home = Path('src/components/WorkspaceHome.tsx')
          text = home.read_text(encoding='utf-8')
          replacements = {
          """function shiftIso(iso:string,days:number):string{\n  const [year,month,day]=iso.split('-').map(Number);\n  const date=new Date(Date.UTC(year,month-1,day+days));\n  return date.toISOString().slice(0,10);\n}""": """function shiftIso(iso:string,days:number):string{\n  const year=Number(iso.slice(0,4)),month=Number(iso.slice(5,7)),day=Number(iso.slice(8,10));\n  const date=new Date(Date.UTC(year,month-1,day+days));\n  return date.toISOString().slice(0,10);\n}""",
          """function monthKey(iso:string,offset:number):string{\n  const [year,month]=iso.split('-').map(Number);\n  const date=new Date(Date.UTC(year,month-1+offset,1));\n  return date.toISOString().slice(0,7);\n}""": """function monthKey(iso:string,offset:number):string{\n  const year=Number(iso.slice(0,4)),month=Number(iso.slice(5,7));\n  const date=new Date(Date.UTC(year,month-1+offset,1));\n  return date.toISOString().slice(0,7);\n}""",
          """function previousMonthPeriod(today:string):{from:string;to:string}{\n  const [year,month]=today.split('-').map(Number);\n  const start=new Date(Date.UTC(year,month-2,1));\n  const end=new Date(Date.UTC(year,month-1,0));\n  return{from:start.toISOString().slice(0,10),to:end.toISOString().slice(0,10)};\n}""": """function previousMonthPeriod(today:string):{from:string;to:string}{\n  const year=Number(today.slice(0,4)),month=Number(today.slice(5,7));\n  const start=new Date(Date.UTC(year,month-2,1));\n  const end=new Date(Date.UTC(year,month-1,0));\n  return{from:start.toISOString().slice(0,10),to:end.toISOString().slice(0,10)};\n}""",
          """function compactMonthLabel(month:string):string{\n  const [year,value]=month.split('-').map(Number);\n  const date=new Date(Date.UTC(year,value-1,1));\n  return new Intl.DateTimeFormat(getUiLanguage()==='ar'?'ar':'en',{month:'short'}).format(date);\n}""": """function compactMonthLabel(month:string):string{\n  const year=Number(month.slice(0,4)),value=Number(month.slice(5,7));\n  const date=new Date(Date.UTC(year,value-1,1));\n  return new Intl.DateTimeFormat(getUiLanguage()==='ar'?'ar':'en',{month:'short'}).format(date);\n}""",
          """function compactDayLabel(iso:string):string{\n  const [year,month,day]=iso.split('-').map(Number);\n  const date=new Date(Date.UTC(year,month-1,day));\n  return new Intl.DateTimeFormat(getUiLanguage()==='ar'?'ar':'en',{day:'numeric',month:'short'}).format(date);\n}""": """function compactDayLabel(iso:string):string{\n  const year=Number(iso.slice(0,4)),month=Number(iso.slice(5,7)),day=Number(iso.slice(8,10));\n  const date=new Date(Date.UTC(year,month-1,day));\n  return new Intl.DateTimeFormat(getUiLanguage()==='ar'?'ar':'en',{day:'numeric',month:'short'}).format(date);\n}"""
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('Expected WorkspaceHome date helper was not found')
              text = text.replace(old, new, 1)
          home.write_text(text, encoding='utf-8')
      - name: Verify TypeScript
        run: |
          npm ci
          npm run typecheck
      - name: Commit fixes
        run: |
          git config user.name "allidamech-bot"
          git config user.email "allidamech-bot@users.noreply.github.com"
          git add src/app/App.tsx src/components/WorkspaceHome.tsx
          git commit -m "Fix IA command center TypeScript integration"
          git push origin HEAD:feature/ia-ai-advisor-v276
