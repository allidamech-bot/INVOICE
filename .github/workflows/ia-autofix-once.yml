name: LOUREX Advisor locale one-shot patch

on:
  push:
    branches:
      - feature/ia-ai-advisor-v276
    paths:
      - .github/workflows/ia-autofix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/ia-ai-advisor-v276
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Use current UI language in deterministic advisor calculations
        shell: python
        run: |
          from pathlib import Path
          path=Path('src/components/AiCopilot.tsx')
          text=path.read_text(encoding='utf-8')
          old="const calculation=advisorCalculation(message);"
          new="const calculation=advisorCalculation(message,this.props.language==='ar'?'ar':'en');"
          if old not in text:
              raise SystemExit('Expected advisor calculation call not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
      - name: Verify TypeScript
        run: |
          npm ci
          npm run typecheck
      - name: Commit locale fix
        run: |
          git config user.name "allidamech-bot"
          git config user.email "allidamech-bot@users.noreply.github.com"
          git add src/components/AiCopilot.tsx
          git commit -m "Honor UI language in Advisor calculations"
          git push origin HEAD:feature/ia-ai-advisor-v276
