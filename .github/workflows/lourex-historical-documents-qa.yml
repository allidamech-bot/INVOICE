name: LOUREX Historical Document QA
on:
  push:
    branches:
      - fix/audit-historical-document-qa-20261010
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Actual document-quality and A4 regression coverage
        run: node --test tests/document-ux-v82.test.mjs tests/document-workflow-production-audit.test.mjs tests/document-language-v151.test.mjs
      - name: Full suite, unfiltered
        run: node --test --test-concurrency=2 tests/*.test.mjs
