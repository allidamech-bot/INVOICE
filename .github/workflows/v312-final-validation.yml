name: LOUREX v312 final non-visual validation

on:
  push:
    branches:
      - feature/v312-business-document-suite

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v312-business-document-suite
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: v312 document suite checks
        run: node --test tests/v312-business-document-suite.test.mjs
      - name: Remove temporary validation workflow
        if: always()
        run: |
          rm .github/workflows/v312-final-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/v312-final-validation.yml
          git commit -m "chore(v312): remove temporary validation workflow"
          git push origin HEAD:feature/v312-business-document-suite
