name: v321 Hotfix Verification

on:
  push:
    branches:
      - hotfix/v321-startup-loading-deadlock

permissions:
  contents: read

jobs:
  verify-v321:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - name: Static security gate
        run: node scripts/security-check.mjs
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Build full production artifact pipeline
        run: npm run build
      - name: v321 startup regression test
        run: node --test tests/startup-watchdog-v321.test.mjs
