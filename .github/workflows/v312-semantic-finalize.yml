name: LOUREX v312 semantic finalize

on:
  push:
    branches:
      - feature/v312-business-document-suite

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v312-business-document-suite
          fetch-depth: 0
      - name: Apply semantic closeout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new, label):
              p=Path(path); s=p.read_text()
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'{path}: missing {label}')
              p.write_text(s.replace(old,new,1))

          patch('src/components/AiCopilot.tsx',
            "import type { DocumentItem, DocumentLanguage, LourexDocument, SavedItem, UiLanguage, VaultPayload } from '../types.js';",
            "import type { DocumentItem, DocumentKind, DocumentLanguage, LourexDocument, SavedItem, UiLanguage, VaultPayload } from '../types.js';",
            'DocumentKind import')
          patch('src/components/AiCopilot.tsx',
            "import { SupplierDocumentImport } from './SupplierDocumentImport.js';",
            "import { SupplierDocumentImport } from './SupplierDocumentImport.js';\nimport { isSupplierDocumentKind } from '../lib/document-kinds.js';",
            'supplier helper import')
          patch('src/components/AiCopilot.tsx',
            "interface DraftActiveDocument {id:string;number:string;kind:'proforma'|'invoice'|'purchase-order';",
            "interface DraftActiveDocument {id:string;number:string;kind:Exclude<DocumentKind,'draft'>;",
            'active document kind')
          patch('src/components/AiCopilot.tsx',
            "customerName:activeDocument.kind==='purchase-order'?'':activeDocument.customerSnapshot?.companyNameEn||activeDocument.customerSnapshot?.companyNameAr||'',",
            "customerName:isSupplierDocumentKind(activeDocument.kind)?'':activeDocument.customerSnapshot?.companyNameEn||activeDocument.customerSnapshot?.companyNameAr||'',",
            'AI customer ownership')
          patch('src/components/AiCopilot.tsx',
            "supplierName:activeDocument.kind==='purchase-order'?(activeDocument.supplierSnapshot?.nameEn||activeDocument.supplierSnapshot?.nameAr||''):'',",
            "supplierName:isSupplierDocumentKind(activeDocument.kind)?(activeDocument.supplierSnapshot?.nameEn||activeDocument.supplierSnapshot?.nameAr||''):'',",
            'AI supplier ownership')

          patch('src/components/EditorPageCore.tsx',
            "    // A purchase order owns an explicit requested-delivery date. Changing the\n    // order date must never apply customer invoice terms or overwrite delivery.\n    if(d.kind==='purchase-order')return next;\n    const preset=paymentTermPresetById(this.props.company,d.paymentTermPresetId);",
            "    // Only a Commercial Invoice owns customer payment-due calculations.\n    // RFQ, PO, delivery, receipt and statement dates must never inherit invoice terms.\n    if(d.kind!=='invoice')return next;\n    const preset=paymentTermPresetById(this.props.company,d.paymentTermPresetId);",
            'invoice-only payment due logic')

          patch('src/app/App.tsx',
            "templateId:kind==='proforma'?smart.quoteTemplateId:kind==='draft'?base.appearance.templateId:smart.invoiceTemplateId",
            "templateId:(kind==='proforma'||kind==='proforma-invoice')?smart.quoteTemplateId:kind==='invoice'?smart.invoiceTemplateId:base.appearance.templateId",
            'template routing')

          patch('src/templates/TemplateRenderer.tsx',
            "import { documentKindTitle, isSupplierDocumentKind } from '../lib/document-kinds.js';",
            "import { documentBankAllowed, documentKindTitle, documentPriceOptional, isSupplierDocumentKind } from '../lib/document-kinds.js';",
            'renderer semantic imports')
          patch('src/templates/TemplateRenderer.tsx',
            "<td className=\"money-cell\">{continuation?'':item.unitPrice}</td><td className=\"money-cell strong\">{continuation?'':lineTotal(item.quantity,item.unitPrice)}</td>",
            "<td className=\"money-cell\">{continuation?'':documentPriceOptional(doc.kind)?'—':item.unitPrice}</td><td className=\"money-cell strong\">{continuation?'':documentPriceOptional(doc.kind)?'—':lineTotal(item.quantity,item.unitPrice)}</td>",
            'non-priced table values')
          patch('src/templates/TemplateRenderer.tsx',
            "function Totals({ document: doc }: { document: LourexDocument }): any {\n  const currency=documentCurrency(doc);",
            "function Totals({ document: doc }: { document: LourexDocument }): any {\n  if(documentPriceOptional(doc.kind))return null;\n  const currency=documentCurrency(doc);",
            'non-priced totals guard')
          patch('src/templates/TemplateRenderer.tsx',
            "  if (doc.kind==='purchase-order' || !doc.appearance.showBank) return null;",
            "  if (!documentBankAllowed(doc.kind) || !doc.appearance.showBank) return null;",
            'bank output guard')
          patch('src/templates/TemplateRenderer.tsx',
            "  const bank = doc.appearance.showBank && Object.values(doc.companySnapshot.bank).some(value => value.trim());",
            "  const bank = documentBankAllowed(doc.kind) && doc.appearance.showBank && Object.values(doc.companySnapshot.bank).some(value => value.trim());",
            'details bank pressure')

          patch('src/components/DocumentsPage.tsx',
            "            <div className=\"document-detail-totals\">",
            "            {!priceOptional?<div className=\"document-detail-totals\">",
            'detail totals opening')
          patch('src/components/DocumentsPage.tsx',
            "              <div className=\"grand\"><span>{t('Grand total','الإجمالي النهائي')}</span><strong>{formatMoney(totals.grandTotal,doc.currency)}</strong></div>\n            </div>\n          </section>",
            "              <div className=\"grand\"><span>{t('Grand total','الإجمالي النهائي')}</span><strong>{formatMoney(totals.grandTotal,doc.currency)}</strong></div>\n            </div>:null}\n          </section>",
            'detail totals closing')
          PY
      - name: Commit semantic fixes and remove temporary workflow
        run: |
          rm .github/workflows/v312-semantic-finalize.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(v312): finalize document semantics"
          git push origin HEAD:feature/v312-business-document-suite
