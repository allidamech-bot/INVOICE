name: LOUREX v326 Foundation QA

on:
  push:
    branches:
      - feature/v326-foundation-recovery

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - name: Security gate
        run: node scripts/security-check.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: v326 static foundation contract
        run: node --test tests/v326-foundation-recovery.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: v326 mobile overlay hit testing
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/lourex-v326-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/tests/visual/obsidian-shell.html >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/lourex-v326-server.log; exit 1; fi
          node tests/visual/run-v326-foundation-hit-testing.cjs
      - name: Upload v326 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lourex-v326-foundation-qa
          path: visual-qa-output/v326-foundation
          if-no-files-found: ignore
