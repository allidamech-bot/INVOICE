name: Recorded payment vouchers
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/payment-voucher.ts'
      - 'src/components/PaymentVoucherModal.tsx'
      - 'src/components/InvoicePaymentsPanel.tsx'
      - 'src/components/SupplierPayablesPage.tsx'
      - 'src/styles/payables-batch9.css'
      - 'tests/payment-vouchers-20261021.test.mjs'
      - 'tests/payment-voucher-ui.test.mjs'
      - 'src/lib/document-kinds.ts'
      - 'src/components/AppShell.tsx'
      - 'src/components/DocumentsPage.tsx'
      - 'tests/visual/payment-vouchers.html'
      - 'tests/visual/run-payment-vouchers.cjs'
      - 'tests/visual/run-payment-voucher-hardening.cjs'
      - '.github/workflows/payment-vouchers.yml'
permissions:
  contents: read
concurrency:
  group: recorded-payment-voucher-${{ github.ref }}
  cancel-in-progress: true
jobs:
  voucher-print:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Pure financial identity and payment lifecycle tests
        run: node --test tests/payment-vouchers-20261021.test.mjs tests/payment-voucher-ui.test.mjs tests/receivables-v133.test.mjs tests/purchase-payment-saved-cycle.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1 http-server@14.1.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Actual payment receipt and supplier voucher browser and native PDF checks
        shell: bash
        run: |
          node node_modules/http-server/bin/http-server . -p 4173 -c-1 > /tmp/lourex-voucher-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node --input-type=module -e 'let ready=false;for(let i=0;i<50;i++){try{const r=await fetch("http://127.0.0.1:4173/tests/visual/payment-vouchers.html");if(r.ok){ready=true;break;}}catch{}await new Promise(r=>setTimeout(r,100));}if(!ready)throw Error("Voucher test server missing");'
          node tests/visual/run-payment-vouchers.cjs
          node tests/visual/run-payment-voucher-hardening.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recorded-payment-vouchers
          path: visual-qa-output/payment-vouchers/
          retention-days: 7
