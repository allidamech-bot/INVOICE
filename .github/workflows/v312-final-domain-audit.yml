name: LOUREX v312 final domain audit

on:
  push:
    branches:
      - feature/v312-business-document-suite

permissions:
  contents: write

concurrency:
  group: v312-final-domain-audit
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v312-business-document-suite
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final domain audit patch
        run: python3 scripts/v312-final-domain-audit.py
      - name: Diff sanity
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Full non-visual unit suite
        run: npm test
      - name: v312 regression suite
        run: node --test tests/v312-business-document-suite.test.mjs
      - name: Commit clean final fixes
        run: |
          rm scripts/v312-final-domain-audit.py
          rm .github/workflows/v312-final-domain-audit.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(v312): finalize document domain semantics"
          git push origin HEAD:feature/v312-business-document-suite
