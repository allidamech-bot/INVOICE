name: LOUREX v312 compile check

on:
  push:
    branches:
      - feature/v312-business-document-suite

permissions:
  contents: write

jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v312-business-document-suite
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Apply semantic closeout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def ensure(path, old, new, label):
              p=Path(path); s=p.read_text()
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'{path}: missing {label}')
              p.write_text(s.replace(old,new,1))

          ensure('src/components/AiCopilot.tsx',
            "import type { DocumentItem, DocumentLanguage, LourexDocument, SavedItem, UiLanguage, VaultPayload } from '../types.js';",
            "import type { DocumentItem, DocumentKind, DocumentLanguage, LourexDocument, SavedItem, UiLanguage, VaultPayload } from '../types.js';",
            'DocumentKind import')
          ensure('src/components/AiCopilot.tsx',
            "import { SupplierDocumentImport } from './SupplierDocumentImport.js';",
            "import { SupplierDocumentImport } from './SupplierDocumentImport.js';\nimport { isSupplierDocumentKind } from '../lib/document-kinds.js';",
            'supplier helper import')
          ensure('src/components/AiCopilot.tsx',
            "interface DraftActiveDocument {id:string;number:string;kind:'proforma'|'invoice'|'purchase-order';",
            "interface DraftActiveDocument {id:string;number:string;kind:Exclude<DocumentKind,'draft'>;",
            'AI active kind')
          ensure('src/components/AiCopilot.tsx',
            "customerName:activeDocument.kind==='purchase-order'?'':activeDocument.customerSnapshot?.companyNameEn||activeDocument.customerSnapshot?.companyNameAr||'',supplierName:activeDocument.kind==='purchase-order'?(activeDocument.supplierSnapshot?.nameEn||activeDocument.supplierSnapshot?.nameAr||''):'',",
            "customerName:isSupplierDocumentKind(activeDocument.kind)?'':activeDocument.customerSnapshot?.companyNameEn||activeDocument.customerSnapshot?.companyNameAr||'',supplierName:isSupplierDocumentKind(activeDocument.kind)?(activeDocument.supplierSnapshot?.nameEn||activeDocument.supplierSnapshot?.nameAr||''):'',",
            'AI active party')

          ensure('src/components/EditorPageCore.tsx',
            "    if(d.kind==='proforma'||d.kind==='proforma-invoice'){\n      if(!isIsoDate(value))return next;",
            "    if(d.kind==='proforma'||d.kind==='proforma-invoice'||d.kind==='rfq'){\n      if(!isIsoDate(value))return next;",
            'validity date kinds')
          ensure('src/components/EditorPageCore.tsx',
            "    if(d.kind==='purchase-order')return next;\n    const preset=paymentTermPresetById(this.props.company,d.paymentTermPresetId);",
            "    if(d.kind!=='invoice')return next;\n    const preset=paymentTermPresetById(this.props.company,d.paymentTermPresetId);",
            'invoice-only payment due logic')

          ensure('src/app/App.tsx',
            "templateId:kind==='proforma'?smart.quoteTemplateId:kind==='draft'?base.appearance.templateId:smart.invoiceTemplateId",
            "templateId:(kind==='proforma'||kind==='proforma-invoice'||kind==='rfq')?smart.quoteTemplateId:kind==='invoice'?smart.invoiceTemplateId:base.appearance.templateId",
            'template routing')

          ensure('src/lib/documents.ts',
            "if(doc.dueDate&&!isIsoDate(doc.dueDate))errors.dueDate=(doc.kind==='proforma'||doc.kind==='proforma-invoice')?'Valid until date is invalid.':doc.kind==='purchase-order'?'Requested delivery date is invalid.':'Due date is invalid.';",
            "if(doc.dueDate&&!isIsoDate(doc.dueDate))errors.dueDate=(doc.kind==='proforma'||doc.kind==='proforma-invoice'||doc.kind==='rfq')?'Valid until date is invalid.':doc.kind==='purchase-order'?'Requested delivery date is invalid.':'Due date is invalid.';",
            'due date invalid wording')
          ensure('src/lib/documents.ts',
            "else if(doc.dueDate&&isIsoDate(doc.issueDate)&&compareIsoDates(doc.dueDate,doc.issueDate)<0)errors.dueDate=(doc.kind==='proforma'||doc.kind==='proforma-invoice')?'Valid until date cannot be before issue date.':doc.kind==='purchase-order'?'Requested delivery cannot be before order date.':'Due date cannot be before issue date.';",
            "else if(doc.dueDate&&isIsoDate(doc.issueDate)&&compareIsoDates(doc.dueDate,doc.issueDate)<0)errors.dueDate=(doc.kind==='proforma'||doc.kind==='proforma-invoice'||doc.kind==='rfq')?'Valid until date cannot be before issue date.':doc.kind==='purchase-order'?'Requested delivery cannot be before order date.':'Due date cannot be before issue date.';",
            'due date order wording')

          ensure('src/templates/TemplateRenderer.tsx',
            "import { documentKindTitle, isSupplierDocumentKind } from '../lib/document-kinds.js';",
            "import { documentBankAllowed, documentKindTitle, documentPriceOptional, isSupplierDocumentKind } from '../lib/document-kinds.js';",
            'template semantic imports')
          ensure('src/templates/TemplateRenderer.tsx',
            "function Totals({ document: doc }: { document: LourexDocument }): any {\n  const currency=documentCurrency(doc);",
            "function Totals({ document: doc }: { document: LourexDocument }): any {\n  if(documentPriceOptional(doc.kind))return null;\n  const currency=documentCurrency(doc);",
            'hide nonfinancial totals')
          ensure('src/templates/TemplateRenderer.tsx',
            "  if (doc.kind==='purchase-order' || !doc.appearance.showBank) return null;",
            "  if (!documentBankAllowed(doc.kind) || !doc.appearance.showBank) return null;",
            'bank output guard')
          ensure('src/templates/TemplateRenderer.tsx',
            "<td className=\"money-cell\">{continuation?'':item.unitPrice}</td><td className=\"money-cell strong\">{continuation?'':lineTotal(item.quantity,item.unitPrice)}</td>",
            "<td className=\"money-cell\">{continuation?'':documentPriceOptional(doc.kind)?'—':item.unitPrice}</td><td className=\"money-cell strong\">{continuation?'':documentPriceOptional(doc.kind)?'—':lineTotal(item.quantity,item.unitPrice)}</td>",
            'nonfinancial item values')

          ensure('src/components/DocumentsPage.tsx',
            "import { documentKindLabel, isSupplierDocumentKind } from '../lib/document-kinds.js';",
            "import { documentKindLabel, documentPriceOptional, isSupplierDocumentKind } from '../lib/document-kinds.js';",
            'DocumentsPage semantic import')
          ensure('src/components/DocumentsPage.tsx',
            "    const totals=calculateTotals(doc.items,doc.adjustments);\n    const collection=this.paymentStatus(doc)?invoicePaymentSummary(doc,this.props.payments,undefined,this.props.documents):null;",
            "    const totals=calculateTotals(doc.items,doc.adjustments);\n    const priceOptional=documentPriceOptional(doc.kind);\n    const collection=this.paymentStatus(doc)?invoicePaymentSummary(doc,this.props.payments,undefined,this.props.documents):null;",
            'detail price mode')
          ensure('src/components/DocumentsPage.tsx',
            "<div className=\"document-detail-value\"><small>{doc.kind==='purchase-order'?t('Order Total','إجمالي الطلب'):t('Total','الإجمالي')}</small><strong>{formatMoney(totals.grandTotal,doc.currency)}</strong>",
            "<div className=\"document-detail-value\"><small>{priceOptional?t('Non-financial','غير مالي'):doc.kind==='purchase-order'?t('Order Total','إجمالي الطلب'):t('Total','الإجمالي')}</small><strong>{priceOptional?'—':formatMoney(totals.grandTotal,doc.currency)}</strong>",
            'detail hero amount')
          ensure('src/components/DocumentsPage.tsx',
            "<div><small>{doc.kind==='invoice'?t('Due date','تاريخ الاستحقاق'):doc.kind==='purchase-order'?t('Requested delivery','التسليم المطلوب'):t('Valid until','صالح حتى')}</small><strong>{doc.dueDate?displayDate(doc.dueDate,getUiLanguage()):'—'}</strong></div>",
            "<div><small>{doc.kind==='invoice'?t('Due date','تاريخ الاستحقاق'):doc.kind==='purchase-order'?t('Requested delivery','التسليم المطلوب'):(doc.kind==='proforma'||doc.kind==='proforma-invoice'||doc.kind==='rfq')?t('Valid until','صالح حتى'):t('Additional date','تاريخ إضافي')}</small><strong>{doc.dueDate?displayDate(doc.dueDate,getUiLanguage()):'—'}</strong></div>",
            'detail date label')
          ensure('src/components/DocumentsPage.tsx',
            "<span data-label={doc.kind==='purchase-order'?t('Unit Cost: ','تكلفة الوحدة: '):t('Price: ','السعر: ')}>{formatMoney(item.unitPrice,doc.currency)}</span><span data-label={t('Total: ','الإجمالي: ')}>{formatMoney(lineTotal(item.quantity,item.unitPrice),doc.currency)}</span>",
            "<span data-label={doc.kind==='purchase-order'?t('Unit Cost: ','تكلفة الوحدة: '):t('Price: ','السعر: ')}>{priceOptional?'—':formatMoney(item.unitPrice,doc.currency)}</span><span data-label={t('Total: ','الإجمالي: ')}>{priceOptional?'—':formatMoney(lineTotal(item.quantity,item.unitPrice),doc.currency)}</span>",
            'detail item values')

          ensure('src/components/WorkspaceHome.tsx',
            "import { documentKindLabel, isSupplierDocumentKind } from '../lib/document-kinds.js';",
            "import { documentKindLabel, documentPriceOptional, isSupplierDocumentKind } from '../lib/document-kinds.js';",
            'home semantic import')
          ensure('src/components/WorkspaceHome.tsx',
            "  if(doc.role==='credit-note')return{tone:'issued',label:t('Issued','صادر')};\n  const payment=invoicePaymentSummary(doc,payments,today,documents).status;",
            "  if(doc.role==='credit-note')return{tone:'issued',label:t('Issued','صادر')};\n  if(doc.kind!=='invoice')return{tone:'issued',label:t('Issued','صادر')};\n  const payment=invoicePaymentSummary(doc,payments,today,documents).status;",
            'invoice-only payment status')
          ensure('src/components/WorkspaceHome.tsx',
            "<strong className=\"dashboard-document-amount\">{doc.kind==='draft'?'—':formatMoney(total,doc.currency)}</strong>",
            "<strong className=\"dashboard-document-amount\">{doc.kind==='draft'||documentPriceOptional(doc.kind)?'—':formatMoney(total,doc.currency)}</strong>",
            'home amount')
          PY
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit fixes and remove temporary workflow
        run: |
          rm .github/workflows/v312-compile-check.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(v312): close business document semantics"
          git push origin HEAD:feature/v312-business-document-suite
