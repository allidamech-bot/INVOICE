name: LOUREX Batches 1-3 Integrated QA
on:
  push:
    branches:
      - fix/ai-provider-deadline-20261011
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lourex-batches-1-3-integration-20261011
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Integrate PIN-free UI and conversation work without pushing main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LOUREX QA'
          git config user.email 'qa@invalid.local'
          git fetch origin fix/pinless-security-guide-20261011:refs/remotes/origin/fix/pinless-security-guide-20261011
          git fetch origin fix/ai-workspace-loading-20261011:refs/remotes/origin/fix/ai-workspace-loading-20261011
          git merge --no-edit --no-ff origin/fix/pinless-security-guide-20261011
          git merge --no-edit --no-ff origin/fix/ai-workspace-loading-20261011
          test -z "$(git diff --name-only --diff-filter=U)"
          git log -3 --oneline
          echo "Integrated candidate only; no remote changes or deployments."
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Strict TypeScript validation
        run: npm run typecheck
      - name: Full production build and postprocessor syntax verification
        run: npm run build
      - name: PIN-free, conversation and provider regressions
        run: |
          node --test --test-concurrency=2 \
            tests/pinless-active-ui-contract.test.mjs \
            tests/ai-conversation-loading-recovery.test.mjs \
            tests/ai-multi-provider-router.test.mjs \
            tests/audit-batch7-attachments-behavior.test.mjs \
            tests/ai-conversation-workspace.test.mjs \
            tests/ai-intelligence-foundation.test.mjs \
            tests/ai-pinless-workspace-session.test.mjs \
            tests/cloud-first-pinless-contract.test.mjs \
            tests/audit-ai-firebase-auth.test.mjs \
            tests/audit-ai-client-token-safety.test.mjs
      - name: Business data, account isolation and backup regressions
        run: |
          node --test --test-concurrency=2 \
            tests/account-data-isolation-v215.test.mjs \
            tests/b03-manual-backup-recovery.test.mjs \
            tests/number-reservation.test.mjs \
            tests/document-language-v151.test.mjs \
            tests/production.test.mjs \
            tests/v302-real-pin-doc-entry.test.mjs
      - name: Full historical Node suite (no ignored failures)
        shell: bash
        run: |
          set -o pipefail
          timeout 900s node --test --test-concurrency=2 tests/*.test.mjs > "$RUNNER_TEMP/lourex-batches-full-tests.log" 2>&1 || status=$?
          grep -E '^[[:space:]]*ℹ (tests|pass|fail|skipped) ' "$RUNNER_TEMP/lourex-batches-full-tests.log" || true
          if [ "${status:-0}" -ne 0 ]; then
            sed -n '/^✖ failing tests:/,$p' "$RUNNER_TEMP/lourex-batches-full-tests.log" | head -n 160 || true
            exit "${status}"
          fi
      - name: Real Chromium browser smoke — phone, tablet and desktop
        run: node scripts/qa-free-chrome-smoke.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Real Firebase Auth plus Firestore emulator — two isolated Chromium profiles
        shell: bash
        run: |
          printf '%s\n' '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"host":"127.0.0.1","port":8080},"auth":{"host":"127.0.0.1","port":9099},"ui":{"enabled":false}}}' > firebase-emulator.qa.json
          npx --yes firebase-tools@14 emulators:exec --only auth,firestore --project lourex-invoice --config firebase-emulator.qa.json "node scripts/qa-cloud-auth-emulator-browser.mjs"
      - name: Safari WebKit browser QA — iPhone, iPad and desktop
        shell: bash
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps webkit
          node scripts/qa-pinless-webkit.mjs
      - name: Upload full-suite diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lourex-batches-1-3-full-node-tests
          path: ${{ runner.temp }}/lourex-batches-full-tests.log
          if-no-files-found: warn
          retention-days: 3
