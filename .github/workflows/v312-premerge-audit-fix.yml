name: LOUREX v312 pre-merge audit fixes

on:
  push:
    branches:
      - feature/v312-business-document-suite

permissions:
  contents: write

concurrency:
  group: v312-premerge-audit-fix
  cancel-in-progress: true

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v312-business-document-suite
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply deterministic audit patch
        run: python3 scripts/v312-premerge-audit-fix.py
      - name: Diff sanity
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: v312 regression tests
        run: node --test tests/v312-business-document-suite.test.mjs
      - name: Commit clean audit fixes
        run: |
          rm scripts/v312-premerge-audit-fix.py
          rm .github/workflows/v312-premerge-audit-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(v312): close pre-merge document audit gaps"
          git push origin HEAD:feature/v312-business-document-suite
