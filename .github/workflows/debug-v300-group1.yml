name: v300 group1 diagnostics

on:
  push:
    branches: [feature/home-clean-rebuild-v284]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: account-authoritative-sync
        if: always()
        run: node --test tests/account-authoritative-sync.test.mjs
