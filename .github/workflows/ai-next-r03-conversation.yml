name: LOUREX AI Next R03 Conversation Persistence

on:
  pull_request:
    branches:
      - main
      - feature/ai-next-r02-document-engine
    paths:
      - 'src/ai-next/conversation-state/**'
      - 'tests/ai-next/r03-conversation-state.test.mjs'
      - '.github/workflows/ai-next-r03-conversation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-next-r03-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-conversation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Strict project TypeScript typecheck
        run: npm run typecheck
      - name: Compile standalone AI-next modules
        run: ./node_modules/.bin/tsc -p tsconfig.json
      - name: Synthetic R01 R02 R03 safety tests without providers
        run: node --test tests/ai-next/r01-core.test.mjs tests/ai-next/r02-documents.test.mjs tests/ai-next/r03-conversation-state.test.mjs
