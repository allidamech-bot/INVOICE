name: LOUREX Notification Center QA

on:
  pull_request:
    paths:
      - 'src/lib/notification-center.ts'
      - 'src/lib/notification-center-style.ts'
      - 'src/components/NotificationCenterLive.tsx'
      - 'src/components/AppShell.tsx'
      - 'src/styles/notification-center-batch5.css'
      - 'tests/notification-center-batch5.test.mjs'
      - 'tests/notification-center-browser-batch5.test.mjs'
      - 'tests/visual/notification-center-batch5.html'
      - 'tests/visual/run-notification-center-batch5.cjs'
      - '.github/workflows/batch5-notification-center.yml'

permissions:
  contents: read

jobs:
  notification-center:
    name: Batch 5 notifications + follow-up gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Batch 5 deterministic engine and storage contracts
        run: node --test tests/notification-center-batch5.test.mjs tests/notification-center-browser-batch5.test.mjs
      - name: Install Chromium QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run Notification Center mobile and desktop browser QA
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/lourex-batch5-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/tests/visual/notification-center-batch5.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lourex-batch5-server.log
            exit 1
          fi
          timeout --signal=TERM --kill-after=15s 180s node tests/visual/run-notification-center-batch5.cjs
      - name: Upload Batch 5 visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lourex-batch5-notification-center-visual-qa
          path: visual-qa-output/notification-center-batch5
          if-no-files-found: ignore
