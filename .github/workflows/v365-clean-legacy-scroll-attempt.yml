name: v365 clean obsolete legacy scroll attempt

on:
  push:
    branches:
      - fix/v365-mobile-editor-scroll-draft-templates
    paths:
      - .github/workflows/v365-clean-legacy-scroll-attempt.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v365-mobile-editor-scroll-draft-templates
          fetch-depth: 0
      - name: Restore untouched v337-era owners from current main
        run: |
          git fetch origin main
          git checkout origin/main -- src/styles/v331-draft-scroll-recovery.css tests/v337-template-layout-site-pass.test.mjs
          git diff --check
          git diff -- src/styles/v331-draft-scroll-recovery.css tests/v337-template-layout-site-pass.test.mjs
          git config user.name "lourex-v365-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/v331-draft-scroll-recovery.css tests/v337-template-layout-site-pass.test.mjs
          git commit -m "v365 remove obsolete legacy scroll-owner edits"
          git push origin HEAD:fix/v365-mobile-editor-scroll-draft-templates
