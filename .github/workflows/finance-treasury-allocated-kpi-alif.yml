name: Finance Treasury Ledger KPI (Alif)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/treasury-ledger.ts'
      - 'src/components/TreasuryLedgerPage.tsx'
      - 'tests/finance-treasury-allocated-kpi-alif.test.mjs'
      - 'tests/finance-treasury-account-kpi-history-alif.test.mjs'
      - '.github/workflows/finance-treasury-allocated-kpi-alif.yml'

permissions:
  contents: read

concurrency:
  group: finance-treasury-allocated-kpi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  treasury-kpi-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Focused synthetic treasury ledger KPI tests
        run: node --test tests/finance-treasury-allocated-kpi-alif.test.mjs tests/finance-treasury-account-kpi-history-alif.test.mjs
