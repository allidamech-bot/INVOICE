name: v322 Mobile UI Verification

on:
  push:
    branches:
      - feature/v322-hostinger-mobile-ui-rebuild

permissions:
  contents: read

jobs:
  verify-v322:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - name: Security gate
        run: node scripts/security-check.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install browser QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: TailAdmin mobile visual QA
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/lourex-v322-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node tests/visual/run-tailadmin-v320.cjs
