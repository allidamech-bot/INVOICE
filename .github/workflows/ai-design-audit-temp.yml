name: Temporary AI Conversation Design Audit

on:
  push:
    branches:
      - audit/ai-conversation-design-20261007
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Install browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Run conversation visual matrix
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/lourex-ai-design-audit.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/tests/visual/contextual-ai-batch4.html >/dev/null; then
              break
            fi
            sleep 1
          done
          node tests/visual/run-ai-conversation-final-batch5.cjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ai-conversation-design-audit
          path: visual-qa-output/ai-conversation-final-batch5
          if-no-files-found: error
