name: LOUREX Pricing QA
on:
  pull_request:
    paths:
      - 'src/lib/price-lists.ts'
      - 'src/lib/pricing-style.ts'
      - 'src/components/ProductPriceLists.tsx'
      - 'src/components/ProductsInventoryWorkspace.tsx'
      - 'src/styles/pricing-batch8.css'
      - 'tests/pricing-price-lists-batch8.test.mjs'
      - '.github/workflows/batch8-pricing.yml'
permissions:
  contents: read
jobs:
  pricing:
    name: Batch 8 pricing gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Batch 8 pricing contracts
        run: node --test tests/pricing-price-lists-batch8.test.mjs
