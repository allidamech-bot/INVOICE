name: Financial restore real IndexedDB
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/visual/*financial-restore-browser*'
      - 'tests/visual/run-financial-restore-iphone-axis30.cjs'
      - '.github/workflows/financial-restore-browser.yml'
      - 'src/storage/db.ts'
      - 'src/lib/backup.ts'
      - 'src/lib/period-local.ts'
      - 'src/app/App.tsx'
permissions:
  contents: read
concurrency:
  group: financial-restore-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  indexeddb:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: node node_modules/typescript/bin/tsc -p tsconfig.json
      - run: node tests/visual/prepare-financial-restore-browser.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1 http-server@14.1.1
      - name: Chromium and WebKit real IndexedDB restore acceptance
        shell: bash
        run: |
          node node_modules/http-server/bin/http-server . -p 4173 -c-1 > /tmp/lourex-restore-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node --input-type=module -e 'let ready=false;for(let i=0;i<50;i++){try{const r=await fetch("http://127.0.0.1:4173/tests/visual/financial-restore-browser.html");if(r.ok){ready=true;break;}}catch{}await new Promise(r=>setTimeout(r,100));}if(!ready)throw Error("Restore fixture did not start");'
          node tests/visual/run-financial-restore-browser.cjs
          node tests/visual/run-financial-restore-iphone-axis30.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-financial-restore-acceptance
          path: visual-qa-output/finance-iphone-axis30/financial-restore-iphone.json
          retention-days: 7
