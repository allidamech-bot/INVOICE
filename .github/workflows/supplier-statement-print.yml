name: Supplier statement print QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/SupplierPayablesPage.tsx'
      - 'src/lib/payables.ts'
      - 'src/styles/payables-batch9.css'
      - 'src/styles/app.css'
      - 'tests/visual/supplier-statement-print.html'
      - 'tests/visual/run-supplier-statement-print.cjs'
      - '.github/workflows/supplier-statement-print.yml'
permissions:
  contents: read
concurrency:
  group: supplier-statement-print-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Supplier statement and payables regressions
        run: node --test tests/accounts-payable-batch9.test.mjs tests/financial-e2e-v145.test.mjs
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Print supplier statements in Chromium and WebKit
        shell: bash
        run: |
          node node_modules/http-server/bin/http-server . -p 4173 -c-1 > /tmp/lourex-mobile-pdf-http.log 2>&1 &
          qa_server_pid=$!
          trap 'kill "$qa_server_pid" 2>/dev/null || true' EXIT
          node --input-type=module -e 'let ready=false;for(let i=0;i<50;i++){try{const r=await fetch("http://127.0.0.1:4173/tests/visual/supplier-statement-print.html");if(r.ok){ready=true;break;}}catch{}await new Promise(r=>setTimeout(r,100));}if(!ready)throw new Error("Fixture server did not start");'
          node tests/visual/run-supplier-statement-print.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supplier-statement-print
          path: visual-qa-output/supplier-statement-print/
          retention-days: 7
