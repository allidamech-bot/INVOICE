name: LOUREX Final Roadmap QA

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/types.ts'
      - 'src/lib/defaults.ts'
      - 'src/lib/workspaces.ts'
      - 'src/lib/treasury-ledger.ts'
      - 'src/lib/fx-rates.ts'
      - 'src/lib/stock-transfers.ts'
      - 'src/storage/vault.ts'
      - 'src/storage/vault-merge.ts'
      - 'src/app/App.tsx'
      - 'src/components/FinanceWorkspace.tsx'
      - 'src/components/TreasuryPage.tsx'
      - 'src/components/FxPage.tsx'
      - 'src/components/ProductsInventoryWorkspace.tsx'
      - 'src/components/StockLocationsPage.tsx'
      - 'tests/final-roadmap-qa-v473.test.mjs'
      - 'tests/workspaces-batch15.test.mjs'
      - 'tests/visual/final-roadmap-qa-v473.html'
      - 'tests/visual/run-final-roadmap-qa-v473.cjs'
      - '.github/workflows/final-roadmap-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-roadmap:
    name: Final roadmap finance + stock gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: LOUREX static security gate
        run: node scripts/security-check.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Workspace isolation regression contracts
        run: node --test tests/workspaces-batch15.test.mjs
      - name: Final roadmap accounting and stock contracts
        run: node --test tests/final-roadmap-qa-v473.test.mjs
      - name: Install browser QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Mobile + RTL browser QA
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/lourex-final-roadmap.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/tests/visual/final-roadmap-qa-v473.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/lourex-final-roadmap.log; exit 1; fi
          node tests/visual/run-final-roadmap-qa-v473.cjs
      - name: Upload final roadmap QA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lourex-final-roadmap-qa
          path: visual-qa-output/final-roadmap-v473
          if-no-files-found: ignore
