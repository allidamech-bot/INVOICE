name: LOUREX AI-001 Routing Regression
on:
  push:
    branches: [fix/ai-001-controller-advisor-routing]
  pull_request:
    paths:
      - 'src/lib/ai-conversation-mode.ts'
      - 'src/lib/ai-composer-input.ts'
      - 'tests/ai-composer-input-layout.test.mjs'
      - 'src/lib/ai-conversation-attachments.ts'
      - 'scripts/ai-batch3-premium-conversation.mjs'
      - 'scripts/ai-batch3-conversation-lifecycle-fix.mjs'
      - 'api/ai-core.js'
      - 'api/ai-inbox.js'
      - 'api/quote-source-ai.js'
      - 'tests/ai-source-request-deadlines.test.mjs'
      - 'tests/ai-explicit-carton-unit.test.mjs'
      - 'tests/ai-core-shared-deadline.test.mjs'
      - 'tests/ai-request-hard-deadline.test.mjs'
      - 'tests/ai-owner-planner-diagnostics.test.mjs'
      - 'tests/ai-advisor-visual-source.test.mjs'
      - 'tests/audit-batch7-attachments-behavior.test.mjs'
      - 'tests/ai-001-controller-advisor-routing.test.mjs'
      - 'tests/ai-premium-conversation-batch3.test.mjs'
      - 'tests/ai-advisor-exact-text.test.mjs'
      - 'tests/ai-retry-completed-attachments.test.mjs'
      - '.github/workflows/ai-001-routing.yml'
permissions:
  contents: read
concurrency:
  group: ai-001-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mode-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Final production build
        run: npm run build
      - name: Routing and existing read-only contracts (not a live-provider test)
        run: >
          node --test --test-concurrency=2
          tests/ai-001-controller-advisor-routing.test.mjs
          tests/ai-premium-conversation-batch3.test.mjs
          tests/ai-advisor-exact-text.test.mjs
          tests/ai-advisor-visual-source.test.mjs
          tests/ai-source-request-deadlines.test.mjs
          tests/ai-explicit-carton-unit.test.mjs
          tests/ai-core-shared-deadline.test.mjs
          tests/ai-request-hard-deadline.test.mjs
          tests/ai-owner-planner-diagnostics.test.mjs
          tests/ai-composer-input-layout.test.mjs
          tests/audit-batch7-attachments-behavior.test.mjs
          tests/ai-retry-completed-attachments.test.mjs
          tests/ai-advisor-data-v2-batch2.test.mjs
          tests/audit-ai-firebase-auth.test.mjs
          tests/audit-ai-branch-isolation.test.mjs
