name: LOUREX AI Assistant + Help QA

on:
  pull_request:
    paths:
      - 'src/components/AiCopilot.tsx'
      - 'src/components/UsageGuide.tsx'
      - 'src/components/ProductInfoModal.tsx'
      - 'src/styles/ai-assistant-help-batch3.css'
      - 'tests/ai-assistant-help-batch3.test.mjs'
      - 'tests/visual/ai-assistant-help-batch3.html'
      - 'tests/visual/run-ai-assistant-help-batch3.cjs'
      - '.github/workflows/batch3-ai-help.yml'

permissions:
  contents: read

jobs:
  batch3-ai-help:
    name: Batch 3 mobile AI + Help gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Batch 3 contracts
        run: node --test tests/ai-assistant-help-batch3.test.mjs
      - name: Install Chromium QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run mobile AI and Help browser QA
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/lourex-batch3-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/tests/visual/ai-assistant-help-batch3.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lourex-batch3-server.log
            exit 1
          fi
          timeout --signal=TERM --kill-after=15s 180s node tests/visual/run-ai-assistant-help-batch3.cjs
      - name: Upload Batch 3 visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lourex-batch3-ai-help-visual-qa
          path: visual-qa-output/ai-assistant-help-batch3
          if-no-files-found: ignore
