name: LOUREX QA Legacy Functional Remediation
on:
  push:
    branches:
      - fix/qa-legacy-functional-regressions-20261009

permissions:
  contents: read

concurrency:
  group: lourex-qa-legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Node 24 build and real functional regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Assert backup integrity, commercial PDF capacity, correct currency ordering
        run: |
          node --test --test-name-pattern='B03: backup read enforces|quality pagination counts long neutral|highest-total sorting' tests/b03-manual-backup-recovery.test.mjs tests/commercial-output-hardening-v167.test.mjs tests/audit-batch1.test.mjs

  entire-suite:
    name: Entire Node test suite (all failures visible, not waived)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Run all historical tests without suppressing failures
        run: node --test tests/*.test.mjs
