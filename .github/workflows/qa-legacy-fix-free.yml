name: LOUREX QA Legacy Functional Remediation
on:
  push:
    branches:
      - fix/qa-legacy-functional-regressions-20261009

permissions:
  contents: read

concurrency:
  group: lourex-qa-legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Node 24 build and real functional regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Assert backup integrity, commercial PDF capacity, correct currency ordering
        run: |
          node --test --test-name-pattern='B03: backup read enforces|quality pagination counts long neutral|highest-total sorting|English document identity never falls back' tests/b03-manual-backup-recovery.test.mjs tests/commercial-output-hardening-v167.test.mjs tests/audit-batch1.test.mjs tests/document-language-v151.test.mjs
          node --test --test-name-pattern='v215 a changed Firebase UID|v215 explicit account sign-out|v215 local cloud-account writes' tests/account-data-isolation-v215.test.mjs
          node --test tests/iphone-startup-deadlock-v184.test.mjs

  entire-suite:
    name: Entire Node test suite (all failures visible, not waived)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Run all historical tests without suppressing failures
        run: node --test tests/*.test.mjs

  browser-qa:
    name: Real Chromium and WebKit regression coverage
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Install browser test engines transiently
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Exercise mobile, tablet, RTL, PDF document and overlay paths
        shell: bash
        run: |
          npx http-server . -a 127.0.0.1 -p 4173 -c-1 >/tmp/lourex-free-browser.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          node tests/visual/run-responsive-batch1.cjs
          node tests/visual/run-v339-ipad-portrait-draft.cjs
          node tests/visual/run-v339-shell-overlay-release.cjs
