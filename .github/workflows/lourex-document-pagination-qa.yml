name: LOUREX Document Pagination QA

on:
  push:
    branches:
      - fix/qa-document-details-pagination-20261009
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lourex-document-pagination-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: A4 layout and document-quality regressions
        run: |
          node --test --test-concurrency=2 tests/commercial-output-hardening-v167.test.mjs tests/qa-long-document-terms.test.mjs
      - name: Run full test suite and retain failed test names
        shell: bash
        run: |
          node --test --test-concurrency=2 tests/*.test.mjs > "${RUNNER_TEMP}/candidate-tests.log" 2>&1 || true
          grep -E '^ℹ (tests|pass|fail) ' "${RUNNER_TEMP}/candidate-tests.log" || true
      - name: Compare historical failures to unchanged main
        shell: bash
        run: |
          git fetch origin main --depth=1
          git worktree add --detach "${RUNNER_TEMP}/baseline" origin/main
          (
            cd "${RUNNER_TEMP}/baseline"
            npm ci --no-audit --no-fund
            npm run build
            node --test --test-concurrency=2 tests/*.test.mjs > "${RUNNER_TEMP}/main-tests.log" 2>&1 || true
          )
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const log=key=>fs.readFileSync(process.env.RUNNER_TEMP+'/'+key+'-tests.log','utf8');
          function failures(content){
            const initial=content.split('✖ failing tests:')[0],counts=new Map();
            for(const row of initial.split(/\r?\n/).filter(line=>line.startsWith('✖ '))){
              const name=row.replace(/\s+\([\d.]+ms\)$/,'').trim();
              counts.set(name,(counts.get(name)||0)+1);
            }
            return counts;
          }
          const base=failures(log('main')),candidate=failures(log('candidate')),added=[];
          for(const [name,count] of candidate){
            for(let i=0;i<count-(base.get(name)||0);i++)added.push(name);
          }
          const num=(logName,key)=>Number(log(logName).match(new RegExp('ℹ '+key+' (\\d+)'))?.[1]||-1);
          console.log('main: '+num('main','pass')+' pass / '+num('main','fail')+' fail');
          console.log('candidate: '+num('candidate','pass')+' pass / '+num('candidate','fail')+' fail');
          console.log('New failed test names: '+added.length);
          for(const name of added.slice(0,40))console.log(name);
          if(added.length)process.exitCode=1;
          NODE
