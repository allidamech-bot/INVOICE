name: LOUREX Document Pagination QA

on:
  push:
    branches:
      - fix/qa-document-details-pagination-20261009
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lourex-document-pagination-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: A4 layout and document-quality regressions
        run: |
          node --test --test-concurrency=2 tests/commercial-output-hardening-v167.test.mjs tests/qa-long-document-terms.test.mjs
      - name: Historical complete suite diagnostics
        if: always()
        shell: bash
        run: |
          node --test --test-concurrency=2 tests/*.test.mjs > "${RUNNER_TEMP}/lourex-all-tests.log" 2>&1 || true
          grep -E '^ℹ (tests|pass|fail) ' "${RUNNER_TEMP}/lourex-all-tests.log" || true
