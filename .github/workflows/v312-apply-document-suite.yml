name: LOUREX v312 document suite patch
on:
  push:
    branches: [feature/v312-business-document-suite]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v312-business-document-suite
      - name: Apply v312 document suite
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text()
          def write(path,text): Path(path).write_text(text)
          def replace_once(text,old,new,label):
              count=text.count(old)
              if count!=1: raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old,new,1)
          def sub_once(text,pattern,repl,label,flags=0):
              text2,count=re.subn(pattern,repl,text,count=1,flags=flags)
              if count!=1: raise SystemExit(f'{label}: expected 1 regex match, found {count}')
              return text2

          # 1) First-class persisted document kinds. Credit Note intentionally remains
          # an invoice role because it is financially linked to an issued invoice.
          p='src/types.ts'; s=read(p)
          s=replace_once(s,"export type DocumentKind = 'proforma' | 'invoice' | 'purchase-order' | 'draft';","export type DocumentKind = 'draft' | 'rfq' | 'proforma' | 'proforma-invoice' | 'purchase-order' | 'invoice' | 'delivery-note' | 'payment-receipt' | 'statement-account';",'DocumentKind union')
          write(p,s)

          # 2) Creation, numbering and validation semantics.
          p='src/lib/documents.ts'; s=read(p)
          s=replace_once(s,"import { defaultLetterData, defaultWatermark } from './document-extras.js';","import { defaultLetterData, defaultWatermark } from './document-extras.js';\nimport { documentBankAllowed, documentNumberPrefix, documentPriceOptional, isSupplierDocumentKind } from './document-kinds.js';",'documents catalog import')
          marker="  const used=new Set(vault.documents.map(document=>document.number.trim().toLowerCase()).filter(Boolean));\n"
          aux="""  const used=new Set(vault.documents.map(document=>document.number.trim().toLowerCase()).filter(Boolean));
  const auxiliaryKind=kind==='rfq'||kind==='proforma-invoice'||kind==='delivery-note'||kind==='payment-receipt'||kind==='statement-account';
  if(auxiliaryKind){
    prefix=documentNumberPrefix(kind);
    const matchPattern=new RegExp(`^${prefix}-${year}-(\\d+)$`,'i');
    seq=vault.documents.reduce((max,document)=>{const match=document.number.trim().match(matchPattern);return match?Math.max(max,Number(match[1])||0):max;},0);
    let number='';
    do{seq+=1;number=`${prefix}-${year}-${String(seq).padStart(4,'0')}`;}while(used.has(number.toLowerCase()));
    return {number,vault};
  }
"""
          s=replace_once(s,marker,aux,'auxiliary numbering')
          s=replace_once(s,"    dueDate: kind === 'proforma' ? addDaysIso(issueDate, validityDays) : kind === 'purchase-order' || kind === 'draft' ? '' : paymentPreset ? addDaysIso(issueDate,paymentPreset.days) : '',","    dueDate: (kind === 'proforma' || kind === 'proforma-invoice' || kind === 'rfq') ? addDaysIso(issueDate, validityDays) : kind === 'purchase-order' || kind === 'draft' || kind === 'delivery-note' || kind === 'payment-receipt' || kind === 'statement-account' ? '' : paymentPreset ? addDaysIso(issueDate,paymentPreset.days) : '',",'due dates')
          s=replace_once(s,"    appearance: { templateId: 'executive', paletteMode: 'auto', accentColor: kind==='draft'?'#8e7cf3':'#b58b4f', latinFont: 'auto', arabicFont: 'auto', showBank: kind!=='purchase-order'&&kind!=='draft', showSignature: Boolean(company.signatureDataUrl), showStamp: Boolean(company.stampDataUrl), showHsCode: true, showOrigin: true, showPacking: false, watermark: defaultWatermark() },","    appearance: { templateId: 'executive', paletteMode: 'auto', accentColor: kind==='draft'?'#8e7cf3':kind==='rfq'?'#2563eb':kind==='purchase-order'?'#c88f37':kind==='delivery-note'?'#7c8b95':kind==='payment-receipt'?'#0f9f7f':kind==='statement-account'?'#6d5bd0':'#159fa7', latinFont: 'auto', arabicFont: 'auto', showBank: documentBankAllowed(kind), showSignature: Boolean(company.signatureDataUrl), showStamp: Boolean(company.stampDataUrl), showHsCode: true, showOrigin: true, showPacking: false, watermark: defaultWatermark() },",'appearance by kind')
          s=replace_once(s,"  if (doc.kind === 'proforma' && !doc.dueDate) errors.dueDate = 'Valid until date is required.';","  if ((doc.kind === 'proforma' || doc.kind === 'proforma-invoice') && !doc.dueDate) errors.dueDate = 'Valid until date is required.';",'proforma validation')
          s=replace_once(s,"  if(doc.kind==='purchase-order'){if(!hasDocumentSupplier(doc))errors.supplier='Select a supplier.';}\n  else if (!hasDocumentCustomer(doc)) errors.customer = 'Select a customer.';","  if(isSupplierDocumentKind(doc.kind)){if(!hasDocumentSupplier(doc))errors.supplier='Select a supplier.';}\n  else if (!hasDocumentCustomer(doc)) errors.customer = 'Select a customer.';",'party validation')
          s=replace_once(s,"    if (!item.unitPrice.trim()) errors[`item-${index}-price`] = 'Unit price is required.';\n    else if (!isNonNegativeDecimalInput(item.unitPrice)) errors[`item-${index}-price`] = 'Unit price must be 0 or greater.';","    if (!documentPriceOptional(doc.kind) && !item.unitPrice.trim()) errors[`item-${index}-price`] = 'Unit price is required.';\n    else if (item.unitPrice.trim() && !isNonNegativeDecimalInput(item.unitPrice)) errors[`item-${index}-price`] = 'Unit price must be 0 or greater.';",'optional price validation')
          write(p,s)

          # 3) Readiness follows supplier/customer ownership for RFQ too.
          p='src/lib/readiness.ts'; s=read(p)
          s=replace_once(s,"  const customerComplete = doc.kind==='purchase-order' ? !errors.supplier : !errors.customer;","  const customerComplete = (doc.kind==='purchase-order'||doc.kind==='rfq') ? !errors.supplier : !errors.customer;",'readiness party')
          write(p,s)

          # 4) Ordered create menu: exact requested business-document order.
          p='src/components/AppShell.tsx'; s=read(p)
          new_menu="""  private createMenu=(id:string,className:string)=>this.props.newMenu?<div className={`new-menu shell-new-menu ${className}`} id={id} role="menu" aria-label={t('New Document','مستند جديد')}>
    <button type="button" role="menuitem" data-kind="draft" data-order="1" onClick={()=>this.createDocument('draft')}><Icon name="edit"/><span><strong>{t('Draft','مسودة')}</strong><small>{t('Free-form company document','مستند شركة حر')}</small></span></button>
    <button type="button" role="menuitem" data-kind="rfq" data-order="2" onClick={()=>this.createDocument('rfq')}><Icon name="file"/><span><strong>{t('RFQ','طلب عرض سعر')}</strong><small>{t('Request prices and terms from a supplier','طلب أسعار وشروط من مورد')}</small></span></button>
    <button type="button" role="menuitem" data-kind="proforma" data-order="3" onClick={()=>this.createDocument('proforma')}><Icon name="proforma"/><span><strong>{t('Quotation','عرض سعر')}</strong><small>{t('Commercial quotation for a customer','عرض تجاري للعميل')}</small></span></button>
    <button type="button" role="menuitem" data-kind="proforma-invoice" data-order="4" onClick={()=>this.createDocument('proforma-invoice')}><Icon name="invoice"/><span><strong>{t('Proforma Invoice','فاتورة مبدئية')}</strong><small>{t('Pre-shipment / pre-payment invoice','فاتورة قبل الشحن أو الدفع')}</small></span></button>
    <button type="button" role="menuitem" data-kind="purchase-order" data-order="5" onClick={()=>this.createDocument('purchase-order')}><Icon name="file"/><span><strong>{t('Purchase Order','طلب شراء')}</strong><small>{t('Supplier order and delivery terms','طلب للمورد وشروط التسليم')}</small></span></button>
    <button type="button" role="menuitem" data-kind="invoice" data-order="6" onClick={()=>this.createDocument('invoice')}><Icon name="invoice"/><span><strong>{t('Commercial Invoice','فاتورة تجارية')}</strong><small>{t('Final commercial sales invoice','فاتورة البيع التجارية النهائية')}</small></span></button>
    <button type="button" role="menuitem" data-kind="delivery-note" data-order="7" onClick={()=>this.createDocument('delivery-note')}><Icon name="file"/><span><strong>{t('Delivery Note','سند تسليم')}</strong><small>{t('Confirm goods delivered to a customer','إثبات تسليم البضاعة للعميل')}</small></span></button>
    <button type="button" role="menuitem" data-kind="payment-receipt" data-order="8" onClick={()=>this.createDocument('payment-receipt')}><Icon name="invoice"/><span><strong>{t('Payment Receipt','إيصال دفع')}</strong><small>{t('Acknowledge a received payment','إثبات استلام دفعة')}</small></span></button>
    <button type="button" role="menuitem" data-kind="credit-note" data-order="9" onClick={()=>this.navigate('documents')}><Icon name="invoice"/><span><strong>{t('Credit Note','إشعار دائن')}</strong><small>{t('Create from an issued Commercial Invoice','يُنشأ من فاتورة تجارية صادرة')}</small></span></button>
    <button type="button" role="menuitem" data-kind="statement-account" data-order="10" onClick={()=>this.createDocument('statement-account')}><Icon name="file"/><span><strong>{t('Statement of Account','كشف حساب')}</strong><small>{t('Customer account statement','كشف حركة ورصيد حساب العميل')}</small></span></button>
  </div>:null;"""
          s=sub_once(s,r"  private createMenu=\(id:string,className:string\)=>this\.props\.newMenu\?<div.*?\n  </div>:null;",new_menu,'AppShell create menu',re.S)
          write(p,s)

          # 5) Documents registry: labels, party ownership, filters and exact type order.
          p='src/components/DocumentsPage.tsx'; s=read(p)
          s=replace_once(s,"import { letterPlainText } from '../lib/document-extras.js';","import { letterPlainText } from '../lib/document-extras.js';\nimport { documentKindLabel, isSupplierDocumentKind } from '../lib/document-kinds.js';",'DocumentsPage catalog import')
          s=replace_once(s,"  tab:'all'|'proforma'|'invoice'|'purchase-order'|'draft'|'credit';","  tab:'all'|DocumentKind|'credit';",'DocumentsPage tab type')
          old_kind="""function kindLabel(doc:LourexDocument):string{
  if(doc.role==='credit-note')return t('Credit Note','إشعار دائن');
  if(doc.kind==='purchase-order')return t('Purchase Order','طلب شراء');
  if(doc.kind==='draft')return t('Draft','مسودة');
  return doc.kind==='proforma'?t('Quotation','عرض سعر'):t('Invoice','فاتورة');
}"""
          new_kind="""function kindLabel(doc:LourexDocument):string{
  const label=documentKindLabel(doc.kind,doc.role);
  return t(label.en,label.ar);
}"""
          s=replace_once(s,old_kind,new_kind,'DocumentsPage kind label')
          s=replace_once(s,"  if(doc.kind!=='purchase-order')return customerName(doc);","  if(!isSupplierDocumentKind(doc.kind))return customerName(doc);",'DocumentsPage party kind')
          old_filters="""      if(this.state.tab==='proforma'&&(doc.kind!=='proforma'||doc.role!=='standard'))return false;
      if(this.state.tab==='invoice'&&(doc.kind!=='invoice'||doc.role!=='standard'))return false;
      if(this.state.tab==='purchase-order'&&(doc.kind!=='purchase-order'||doc.role!=='standard'))return false;
      if(this.state.tab==='draft'&&(doc.kind!=='draft'||doc.role!=='standard'))return false;
      if(this.state.tab==='credit'&&doc.role!=='credit-note')return false;"""
          new_filters="""      if(this.state.tab==='credit'&&doc.role!=='credit-note')return false;
      if(this.state.tab!=='all'&&this.state.tab!=='credit'&&(doc.kind!==this.state.tab||doc.role!=='standard'))return false;"""
          s=replace_once(s,old_filters,new_filters,'DocumentsPage filters')
          old_counts="""    const quotes=this.props.documents.filter(doc=>doc.kind==='proforma'&&doc.role==='standard').length;
    const invoices=this.props.documents.filter(doc=>doc.kind==='invoice'&&doc.role==='standard').length;
    const purchaseOrders=this.props.documents.filter(doc=>doc.kind==='purchase-order'&&doc.role==='standard').length;
    const freeDrafts=this.props.documents.filter(doc=>doc.kind==='draft'&&doc.role==='standard').length;
    const creditNotes=this.props.documents.filter(doc=>doc.role==='credit-note').length;"""
          new_counts="""    const typeCount=(kind:DocumentKind)=>this.props.documents.filter(doc=>doc.kind===kind&&doc.role==='standard').length;
    const freeDrafts=typeCount('draft');
    const rfqs=typeCount('rfq');
    const quotes=typeCount('proforma');
    const proformaInvoices=typeCount('proforma-invoice');
    const purchaseOrders=typeCount('purchase-order');
    const invoices=typeCount('invoice');
    const deliveryNotes=typeCount('delivery-note');
    const paymentReceipts=typeCount('payment-receipt');
    const creditNotes=this.props.documents.filter(doc=>doc.role==='credit-note').length;
    const statements=typeCount('statement-account');"""
          s=replace_once(s,old_counts,new_counts,'DocumentsPage counts')
          s=s.replace("doc.kind==='draft'?false:doc.kind==='purchase-order'?!doc.supplierSnapshot:!hasDocumentCustomer(doc)","doc.kind==='draft'?false:isSupplierDocumentKind(doc.kind)?!doc.supplierSnapshot:!hasDocumentCustomer(doc)")
          s=s.replace("doc.kind==='purchase-order'?t('Supplier required','المورد مطلوب'):t('Customer required','العميل مطلوب')","isSupplierDocumentKind(doc.kind)?t('Supplier required','المورد مطلوب'):t('Customer required','العميل مطلوب')")
          s=s.replace("doc.kind==='purchase-order'?t('Supplier','المورد'):t('Customer','العميل')","isSupplierDocumentKind(doc.kind)?t('Supplier','المورد'):t('Customer','العميل')")
          s=s.replace("doc.kind==='purchase-order'?(supplier?","isSupplierDocumentKind(doc.kind)?(supplier?")
          s=replace_once(s,"<div><p className=\"eyebrow\">{t('Business documents','مستندات الأعمال')}</p><h1>{t('Documents','المستندات')}</h1><p className=\"page-subtitle\">{t('Find and manage quotations, invoices, purchase orders, company drafts and credit notes from one workspace.','ابحث وأدر عروض الأسعار والفواتير وطلبات الشراء والمسودات والإشعارات الدائنة من مساحة عمل واحدة.')}</p></div>","<div><p className=\"eyebrow\">{t('Business documents','مستندات الأعمال')}</p><h1>{t('Documents','المستندات')}</h1><p className=\"page-subtitle\">{t('Create and manage the complete LOUREX trade-document workflow from one workspace.','أنشئ وأدر دورة مستندات LOUREX التجارية الكاملة من مساحة عمل واحدة.')}</p></div>",'DocumentsPage subtitle')
          s=replace_once(s,"<div className=\"heading-actions documents-heading-actions\"><Button icon=\"proforma\" variant=\"primary\" onClick={()=>this.props.onNew('proforma')}>{t('New Quote','عرض سعر جديد')}</Button><Button icon=\"invoice\" onClick={()=>this.props.onNew('invoice')}>{t('New Invoice','فاتورة جديدة')}</Button><Button icon=\"file\" onClick={()=>this.props.onNew('purchase-order')}>{t('New Purchase Order','طلب شراء جديد')}</Button><Button icon=\"edit\" className=\"new-draft-button\" onClick={()=>this.props.onNew('draft')}>{t('Draft','مسودة')}</Button></div>","<div className=\"heading-actions documents-heading-actions\"><Button icon=\"edit\" className=\"new-draft-button\" onClick={()=>this.props.onNew('draft')}>{t('Draft','مسودة')}</Button><Button icon=\"file\" onClick={()=>this.props.onNew('rfq')}>{t('RFQ','طلب عرض سعر')}</Button><Button icon=\"proforma\" variant=\"primary\" onClick={()=>this.props.onNew('proforma')}>{t('Quotation','عرض سعر')}</Button><Button icon=\"invoice\" onClick={()=>this.props.onNew('invoice')}>{t('Commercial Invoice','فاتورة تجارية')}</Button></div>",'DocumentsPage quick create')
          new_tabs="""      <div className="documents-register-tabs document-type-tabs" aria-label={t('Document types','أنواع المستندات')}>
        <button type="button" className={this.overviewActive('all','all')?'active':''} aria-pressed={this.overviewActive('all','all')} onClick={()=>this.setOverview('all','all')}><span>{t('All','الكل')}</span><strong>{this.props.documents.length}</strong></button>
        <button type="button" className={'draft-tab '+(this.overviewActive('draft','all')?'active':'')} onClick={()=>this.setOverview('draft','all')}><span>1 · {t('Draft','مسودة')}</span><strong>{freeDrafts}</strong></button>
        <button type="button" className={this.overviewActive('rfq','all')?'active':''} onClick={()=>this.setOverview('rfq','all')}><span>2 · {t('RFQ','طلب عرض سعر')}</span><strong>{rfqs}</strong></button>
        <button type="button" className={this.overviewActive('proforma','all')?'active':''} onClick={()=>this.setOverview('proforma','all')}><span>3 · {t('Quotation','عرض سعر')}</span><strong>{quotes}</strong></button>
        <button type="button" className={this.overviewActive('proforma-invoice','all')?'active':''} onClick={()=>this.setOverview('proforma-invoice','all')}><span>4 · {t('Proforma Invoice','فاتورة مبدئية')}</span><strong>{proformaInvoices}</strong></button>
        <button type="button" className={this.overviewActive('purchase-order','all')?'active':''} onClick={()=>this.setOverview('purchase-order','all')}><span>5 · {t('Purchase Order','طلب شراء')}</span><strong>{purchaseOrders}</strong></button>
        <button type="button" className={this.overviewActive('invoice','all')?'active':''} onClick={()=>this.setOverview('invoice','all')}><span>6 · {t('Commercial Invoice','فاتورة تجارية')}</span><strong>{invoices}</strong></button>
        <button type="button" className={this.overviewActive('delivery-note','all')?'active':''} onClick={()=>this.setOverview('delivery-note','all')}><span>7 · {t('Delivery Note','سند تسليم')}</span><strong>{deliveryNotes}</strong></button>
        <button type="button" className={this.overviewActive('payment-receipt','all')?'active':''} onClick={()=>this.setOverview('payment-receipt','all')}><span>8 · {t('Payment Receipt','إيصال دفع')}</span><strong>{paymentReceipts}</strong></button>
        <button type="button" className={this.overviewActive('credit','all')?'active':''} onClick={()=>this.setOverview('credit','all')}><span>9 · {t('Credit Note','إشعار دائن')}</span><strong>{creditNotes}</strong></button>
        <button type="button" className={this.overviewActive('statement-account','all')?'active':''} onClick={()=>this.setOverview('statement-account','all')}><span>10 · {t('Statement of Account','كشف حساب')}</span><strong>{statements}</strong></button>
        <button type="button" className={`${drafts?'has-drafts ':''}${this.overviewActive('all','draft')?'active':''}`} onClick={()=>this.setOverview('all','draft')}><span>{t('In progress','قيد التحرير')}</span><strong>{drafts}</strong></button>
        <button type="button" className={this.overviewActive('all','final')?'active':''} onClick={()=>this.setOverview('all','final')}><span>{t('Issued','صادرة')}</span><strong>{issued}</strong></button>
      </div>"""
          s=sub_once(s,r"      <div className=\"documents-register-tabs\" aria-label=\{t\('Document overview','ملخص المستندات'\)\}>.*?\n      </div>",new_tabs,'DocumentsPage tabs',re.S)
          s=s.replace("t('Start with a quotation, then issue the invoice when the deal is confirmed.','ابدأ بعرض سعر، ثم أصدر الفاتورة عند تأكيد الصفقة.')","t('Choose the business document you need and LOUREX will keep it in the same workspace.','اختر مستند الأعمال الذي تحتاجه وسيحتفظ به LOUREX في نفس مساحة العمل.')")
          write(p,s)

          # 6) Home recent activity uses the same names and RFQ supplier ownership.
          p='src/components/WorkspaceHome.tsx'; s=read(p)
          s=replace_once(s,"import { LourexAdvisorCard } from './LourexAdvisorCard.js';","import { LourexAdvisorCard } from './LourexAdvisorCard.js';\nimport { documentKindLabel, isSupplierDocumentKind } from '../lib/document-kinds.js';",'WorkspaceHome catalog import')
          s=replace_once(s,"  if(doc.kind==='purchase-order'){
    const supplier=doc.supplierSnapshot;","  if(isSupplierDocumentKind(doc.kind)){
    const supplier=doc.supplierSnapshot;",'WorkspaceHome supplier party')
          old="""function documentLabel(doc:LourexDocument):string{
  if(doc.role==='credit-note')return t('Credit note','إشعار دائن');
  return doc.kind==='proforma'?t('Quotation','عرض سعر'):doc.kind==='purchase-order'?t('Purchase Order','طلب شراء'):doc.kind==='draft'?t('Draft','مسودة'):t('Invoice','فاتورة');
}"""
          new="""function documentLabel(doc:LourexDocument):string{
  const label=documentKindLabel(doc.kind,doc.role);
  return t(label.en,label.ar);
}"""
          s=replace_once(s,old,new,'WorkspaceHome document label')
          s=s.replace("t('Quote, invoice, purchase order or company draft','عرض سعر أو فاتورة أو طلب شراء أو مسودة شركة')","t('10 business document workflows','10 أنواع رئيسية لمستندات الأعمال')")
          write(p,s)

          # 7) Core editor: correct type identity and supplier flow for RFQ.
          p='src/components/EditorPageCore.tsx'; s=read(p)
          s=replace_once(s,"import { DocumentAttachmentsSection } from './DocumentAttachmentsSection.js';","import { DocumentAttachmentsSection } from './DocumentAttachmentsSection.js';\nimport { documentBankAllowed, documentKindLabel, documentPriceOptional, isSupplierDocumentKind } from '../lib/document-kinds.js';",'Editor catalog import')
          s=replace_once(s,"    const isPurchaseOrder=d.kind==='purchase-order';","    const isPurchaseOrder=d.kind==='purchase-order';\n    const isSupplierDocument=isSupplierDocumentKind(d.kind);\n    const kindLabel=documentKindLabel(d.kind,d.role);\n    const priceOptional=documentPriceOptional(d.kind);",'Editor kind flags')
          s=s.replace("key==='customer'?(isPurchaseOrder?t('Supplier','المورد'):t('Customer','العميل'))","key==='customer'?(isSupplierDocument?t('Supplier','المورد'):t('Customer','العميل'))")
          s=s.replace("const credit=isPurchaseOrder?null:customerCreditStatus","const credit=isSupplierDocument||d.kind!=='invoice'?null:customerCreditStatus")
          s=replace_once(s,"<div className=\"editor-top-left\"><IconButton icon=\"arrowLeft\" label={t('Back','رجوع')} onClick={()=>void this.saveAndClose()}/><div><strong>{d.number}</strong><span>{d.role==='credit-note'?t('Credit Note','إشعار دائن'):d.kind==='proforma'?t('Quotation','عرض سعر'):isPurchaseOrder?t('Purchase Order','طلب شراء'):t('Invoice','فاتورة')}</span></div>","<div className=\"editor-top-left\"><IconButton icon=\"arrowLeft\" label={t('Back','رجوع')} onClick={()=>void this.saveAndClose()}/><div><strong>{d.number}</strong><span>{t(kindLabel.en,kindLabel.ar)}</span></div>",'Editor title')
          s=s.replace("d.kind==='proforma'?t('Valid Until','صالح حتى')","(d.kind==='proforma'||d.kind==='proforma-invoice')?t('Valid Until','صالح حتى')")
          s=s.replace("className={d.kind==='proforma'||isPurchaseOrder?'required-field':''}","className={d.kind==='proforma'||d.kind==='proforma-invoice'||isPurchaseOrder?'required-field':''}")
          s=s.replace("{isPurchaseOrder?<PurchaseOrderPartySection","{isSupplierDocument?<PurchaseOrderPartySection")
          s=s.replace("{!isPurchaseOrder?<Field label={t('Bank Account','الحساب البنكي')}>","{documentBankAllowed(d.kind)?<Field label={t('Bank Account','الحساب البنكي')}>")
          s=s.replace("{!isPurchaseOrder?<Toggle checked={d.appearance.showBank}","{documentBankAllowed(d.kind)?<Toggle checked={d.appearance.showBank}")
