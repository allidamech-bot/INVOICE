name: LOUREX AI Next R07U Audited Model Dialogue (Offline)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ai-next/conversation-state/trusted-history-context.ts'
      - 'src/ai-next/router/semantic-planner.ts'
      - 'src/ai-next/router/trusted-semantic-gateway.ts'
      - 'tests/ai-next/r07u-audited-dialogue-context.test.mjs'
      - 'tests/ai-next/r07q-routed-semantic.test.mjs'
      - '.github/workflows/ai-next-r07u-audited-dialogue.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-next-r07u-audited-dialogue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audited-dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Strict TypeScript and isolated output
        run: npm run typecheck && ./node_modules/.bin/tsc -p tsconfig.json
      - name: Audited context, private routing and receipt regressions, no providers
        run: >-
          node --test
          tests/ai-next/r07u-audited-dialogue-context.test.mjs
          tests/ai-next/r07q-routed-semantic.test.mjs
          tests/ai-next/r07p-semantic-planner.test.mjs
          tests/ai-next/r07m-unified-multiturn.test.mjs
          tests/ai-next/r07t-dialogue-benchmark.test.mjs
      - name: Finance and production isolation
        run: node scripts/verify-deployment-isolation.mjs
