name: LOUREX QA Desktop and Auth Contracts
on:
  push:
    branches:
      - fix/qa-desktop-navigation-matte-motion-20261010
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Current desktop and account security regressions
        run: node --test tests/desktop-startup-v249.test.mjs tests/premium-auth-gateway-v187.test.mjs
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Entire historical suite with no skipped failures
        run: node --test --test-concurrency=2 tests/*.test.mjs
