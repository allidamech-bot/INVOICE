name: v311 workspace dirty guard
on:
  push:
    branches: [audit/v311-full-site-quality-pass]
    paths: [.github/workflows/v311-dirty-guard.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/v311-full-site-quality-pass
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply source patch
        run: python3 scripts/v311_dirty_guard_patch.py
      - name: Commit source changes
        run: |
          git config user.name "allidamech-bot"
          git config user.email "228416871+allidamech-bot@users.noreply.github.com"
          git add src/app/App.tsx src/components/CustomersPage.tsx src/components/FinanceWorkspace.tsx src/components/ProductsInventoryWorkspace.tsx src/components/OperationsPage.tsx
          git commit -m "fix(v311): protect unsaved workspace edits [skip v311]"
          git push origin HEAD:audit/v311-full-site-quality-pass
# retry after patch-runner syntax fix
