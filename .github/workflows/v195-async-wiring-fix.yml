name: Temporary v195 document wiring patch

on:
  push:
    branches:
      - audit/final-functional-documents-customers-v195

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/final-functional-documents-customers-v195
      - name: Preserve the conversion promise and remove this one-shot workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/App.tsx')
          text = path.read_text()
          old = "onConvert={(d)=>void this.convert(d)}"
          new = "onConvert={this.convert}"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one DocumentsPage conversion wrapper, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/v195-async-wiring-fix.yml
          git config user.name "lourex-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/App.tsx
          git commit -m "Preserve document conversion promise for single-flight guard"
          git push origin HEAD:audit/final-functional-documents-customers-v195
