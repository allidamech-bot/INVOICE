name: Mixed purchase cost provenance acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/finance-mixed-purchase-cost-provenance.test.mjs'
      - 'src/lib/inventory-moving-average.ts'
      - 'src/lib/inventory-valuation-evidence.ts'
      - 'src/lib/inventory-transfer-valuation.ts'
      - 'src/lib/inventory-purchase-reversal-valuation.ts'
      - 'src/lib/inventory-manual-adjustment-valuation.ts'
      - 'src/lib/inventory-cost-reconciliation.ts'
      - 'src/lib/inventory-cost-cutover-audit.ts'
      - 'src/lib/inventory-journal-integrity-preview.ts'
      - 'src/lib/inventory-minor-unit-rounding-preview.ts'
      - 'src/lib/inventory-nrv-preview.ts'
      - 'tests/finance-inventory-nrv-preview-22bc.test.mjs'
      - 'tests/finance-minor-unit-inventory-residual.test.mjs'
      - 'tests/finance-inventory-cutover-evidence-audit.test.mjs'
      - 'tests/finance-manual-stock-adjustment-22bc.test.mjs'
      - 'tests/finance-purchase-reversal-valuation-22bc.test.mjs'
      - 'tests/finance-warehouse-transfer-value-22bc.test.mjs'
      - 'tests/finance-posted-ledger-projection-22bc.test.mjs'
      - 'tests/finance-moving-average-22bc.test.mjs'
      - '.github/workflows/finance-mixed-purchase-cost.yml'
permissions:
  contents: read
concurrency:
  group: finance-mixed-purchase-cost-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mixed-cost-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Exact mixed-cost purchase/issue ledger evidence
        run: node --test tests/finance-mixed-purchase-cost-provenance.test.mjs tests/finance-moving-average-22bc.test.mjs tests/finance-posted-ledger-projection-22bc.test.mjs tests/finance-warehouse-transfer-value-22bc.test.mjs tests/finance-purchase-reversal-valuation-22bc.test.mjs tests/finance-manual-stock-adjustment-22bc.test.mjs tests/finance-inventory-cutover-evidence-audit.test.mjs tests/finance-minor-unit-inventory-residual.test.mjs tests/finance-inventory-nrv-preview-22bc.test.mjs
