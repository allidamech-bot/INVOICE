name: Mixed purchase cost provenance acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/finance-mixed-purchase-cost-provenance.test.mjs'
      - '.github/workflows/finance-mixed-purchase-cost.yml'
permissions:
  contents: read
concurrency:
  group: finance-mixed-purchase-cost-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mixed-cost-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Exact mixed-cost purchase/issue ledger evidence
        run: node --test tests/finance-mixed-purchase-cost-provenance.test.mjs
