name: Apply Batch 8 Operations

on:
  push:
    branches:
      - agent/operations-batch-8
    paths:
      - .github/workflows/apply-batch8.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/operations-batch-8
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: node scripts/apply-operations-batch8.mjs
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Commit integrated batch
        run: |
          rm -f scripts/apply-operations-batch8.mjs .github/workflows/apply-batch8.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Batch 8 operations, purchasing and inventory"
          git push origin HEAD:agent/operations-batch-8
