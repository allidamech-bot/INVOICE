name: Final hardening UI integration
on:
  push:
    branches: [feat/lourex-roadmap-hardening-final]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/lourex-roadmap-hardening-final
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Wire final roadmap workspaces
        run: |
          python3 scripts/hardening-wire-core.py
          python3 scripts/hardening-wire-reports.py
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit verified UI integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ProductsInventoryWorkspace.tsx src/components/ReportsPage.tsx src/app/App.tsx index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat(hardening): wire treasury FX warehouses and profitability"
          git push origin HEAD:feat/lourex-roadmap-hardening-final
