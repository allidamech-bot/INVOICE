name: LOUREX WebKit Stability Diagnostic

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  webkit-stability-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Install browser stability runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Start diagnostic server
        run: |
          nohup npx http-server . -p 4173 -c-1 > /tmp/lourex-webkit-diagnostic-server.log 2>&1 &
          echo $! > /tmp/lourex-webkit-diagnostic-server.pid
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/tests/visual/v338-editor-stability.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lourex-webkit-diagnostic-server.log
            exit 1
          fi
      - name: v338 editor stability
        id: v338_editor
        continue-on-error: true
        run: node tests/visual/run-v338-editor-stability.cjs
      - name: v339 iPad landscape draft
        id: v339_landscape_draft
        continue-on-error: true
        run: node tests/visual/run-v339-ipad-landscape-draft.cjs
      - name: v339 iPad landscape commercial
        id: v339_landscape_commercial
        continue-on-error: true
        run: node tests/visual/run-v339-ipad-landscape-commercial.cjs
      - name: v339 iPad portrait draft
        id: v339_portrait_draft
        continue-on-error: true
        run: node tests/visual/run-v339-ipad-portrait-draft.cjs
      - name: v337 shell navigation
        id: v337_shell_navigation
        continue-on-error: true
        run: node tests/visual/run-v337-shell-navigation.cjs
      - name: v339 shell overlay release
        id: v339_shell_overlay
        continue-on-error: true
        run: node tests/visual/run-v339-shell-overlay-release.cjs
      - name: v339 signout guard
        id: v339_signout_guard
        continue-on-error: true
        run: node tests/visual/run-v339-signout-guard.cjs
      - name: Stop diagnostic server
        if: always()
        run: |
          if [ -f /tmp/lourex-webkit-diagnostic-server.pid ]; then
            kill "$(cat /tmp/lourex-webkit-diagnostic-server.pid)" >/dev/null 2>&1 || true
          fi
      - name: Enforce all WebKit stability diagnostics
        if: always()
        env:
          V338_EDITOR: ${{ steps.v338_editor.outcome }}
          V339_LANDSCAPE_DRAFT: ${{ steps.v339_landscape_draft.outcome }}
          V339_LANDSCAPE_COMMERCIAL: ${{ steps.v339_landscape_commercial.outcome }}
          V339_PORTRAIT_DRAFT: ${{ steps.v339_portrait_draft.outcome }}
          V337_SHELL_NAVIGATION: ${{ steps.v337_shell_navigation.outcome }}
          V339_SHELL_OVERLAY: ${{ steps.v339_shell_overlay.outcome }}
          V339_SIGNOUT_GUARD: ${{ steps.v339_signout_guard.outcome }}
        run: |
          printf 'v338 editor: %s\n' "$V338_EDITOR"
          printf 'v339 landscape draft: %s\n' "$V339_LANDSCAPE_DRAFT"
          printf 'v339 landscape commercial: %s\n' "$V339_LANDSCAPE_COMMERCIAL"
          printf 'v339 portrait draft: %s\n' "$V339_PORTRAIT_DRAFT"
          printf 'v337 shell navigation: %s\n' "$V337_SHELL_NAVIGATION"
          printf 'v339 shell overlay: %s\n' "$V339_SHELL_OVERLAY"
          printf 'v339 signout guard: %s\n' "$V339_SIGNOUT_GUARD"
          failures=0
          for result in "$V338_EDITOR" "$V339_LANDSCAPE_DRAFT" "$V339_LANDSCAPE_COMMERCIAL" "$V339_PORTRAIT_DRAFT" "$V337_SHELL_NAVIGATION" "$V339_SHELL_OVERLAY" "$V339_SIGNOUT_GUARD"; do
            if [ "$result" != 'success' ]; then failures=1; fi
          done
          exit "$failures"
