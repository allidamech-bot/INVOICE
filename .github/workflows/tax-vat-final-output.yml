name: Tax report final output
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/styles/tax-vat-batch10.css'
      - 'src/components/TaxVatCenter.tsx'
      - 'src/lib/tax-vat.ts'
      - 'tests/visual/tax-vat-final-output.html'
      - 'tests/visual/run-tax-vat-final-output.cjs'
      - '.github/workflows/tax-vat-final-output.yml'
permissions:
  contents: read
concurrency:
  group: tax-vat-final-output-${{ github.ref }}
  cancel-in-progress: true
jobs:
  report-pdf:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Tax report and output contracts
        run: node --test tests/tax-vat-batch10.test.mjs tests/financial-output-parity-v559.test.mjs tests/credit-note-treatment.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1 http-server@14.1.1
      - name: Actual tax CSV, browser and native PDF acceptance
        shell: bash
        run: |
          node node_modules/http-server/bin/http-server . -p 4173 -c-1 > /tmp/lourex-report-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node --input-type=module -e 'let ready=false;for(let i=0;i<50;i++){try{const r=await fetch("http://127.0.0.1:4173/tests/visual/tax-vat-final-output.html");if(r.ok){ready=true;break;}}catch{}await new Promise(r=>setTimeout(r,100));}if(!ready)throw Error("Tax report fixture did not start");'
          node tests/visual/run-tax-vat-final-output.cjs
          node tests/visual/run-tax-vat-batch10.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tax-vat-final-output
          path: |
            visual-qa-output/tax-vat-final-output/
            visual-qa-output/tax-vat-batch10/
          retention-days: 7
