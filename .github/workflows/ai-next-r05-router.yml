name: LOUREX AI Next R05 Safe Router Foundation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ai-next/router/**'
      - 'tests/ai-next/r05-router.test.mjs'
      - '.github/workflows/ai-next-r05-router.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-next-r05-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-router-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Strict TypeScript
        run: npm run typecheck
      - name: Compile isolated AI-next modules
        run: ./node_modules/.bin/tsc -p tsconfig.json
      - name: Offline synthetic R01-R05 regression
        run: node --test tests/ai-next/r01-core.test.mjs tests/ai-next/r02-documents.test.mjs tests/ai-next/r03-conversation-state.test.mjs tests/ai-next/r04-guarded-finance.test.mjs tests/ai-next/r05-router.test.mjs
