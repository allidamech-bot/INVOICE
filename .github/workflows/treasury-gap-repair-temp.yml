name: LOUREX Treasury Gap Repair Temp

on:
  pull_request:
    branches:
      - main
    paths:
      - '.treasury-gap-repair-trigger'
      - '.github/workflows/treasury-gap-repair-temp.yml'
      - 'scripts/repair-treasury-gap.py'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/lourex-roadmap-hardening-final'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/lourex-roadmap-hardening-final
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Apply treasury and FX blueprint repair
        run: python3 scripts/repair-treasury-gap.py
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Targeted treasury and FX contracts
        run: node --test tests/treasury-accounts-v474.test.mjs tests/roadmap-hardening-v473.test.mjs
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github/workflows/roadmap-hardening-final.yml
          if git diff --cached --quiet; then
            echo "Repair already applied."
            exit 0
          fi
          git commit -m "Complete treasury accounts and inverse FX [treasury-gap-repair]"
          git push origin HEAD:feat/lourex-roadmap-hardening-final
