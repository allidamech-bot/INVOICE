name: LOUREX AI Next R07Q Semantic Offline Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ai-next/router/gateway.ts'
      - 'src/ai-next/router/semantic-planner.ts'
      - 'src/ai-next/router/offline-semantic-route.ts'
      - 'tests/ai-next/r07q-semantic-offline.test.mjs'
      - '.github/workflows/ai-next-r07q-semantic-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-next-r07q-semantic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compile strict TypeScript
        run: npm run typecheck && ./node_modules/.bin/tsc -p tsconfig.json
      - name: R07Q isolated semantic output, free eligibility and privacy tests
        run: node --test tests/ai-next/r07q-semantic-offline.test.mjs
      - name: R05 R07P and R07M regression
        run: >-
          node --test
          tests/ai-next/r05-router.test.mjs
          tests/ai-next/r05-trusted-registry.test.mjs
          tests/ai-next/r07p-semantic-planner.test.mjs
          tests/ai-next/r07m-fast-coordinator.test.mjs
      - name: No production/finance activation
        run: node scripts/verify-deployment-isolation.mjs
