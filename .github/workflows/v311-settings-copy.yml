name: v311 settings copy
on:
  push:
    branches: [audit/v311-full-site-quality-pass]
    paths: [.github/workflows/v311-settings-copy.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/v311-full-site-quality-pass
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply source patch
        run: python3 scripts/v311_settings_copy_patch.py
      - name: Commit source changes
        run: |
          git config user.name "allidamech-bot"
          git config user.email "228416871+allidamech-bot@users.noreply.github.com"
          git add src/components/SettingsModal.tsx
          git commit -m "fix(v311): align settings terminology with PIN policy [skip v311]"
          git push origin HEAD:audit/v311-full-site-quality-pass
