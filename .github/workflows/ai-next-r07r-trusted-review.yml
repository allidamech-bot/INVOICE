name: LOUREX AI Next Trusted Unsaved Review Session

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ai-next/coordinator/r07r-trusted-review-session.ts'
      - 'tests/ai-next/r07r-trusted-review-session.test.mjs'
      - '.github/workflows/ai-next-r07r-trusted-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-next-r07r-session-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trusted-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck and compile isolated source
        run: npm run typecheck && ./node_modules/.bin/tsc -p tsconfig.json
      - name: Complete synthetic quotation review lifecycle and negatives
        run: node --test tests/ai-next/r07r-trusted-review-session.test.mjs
      - name: Regression for R07R R07M R07P and audited context
        run: >-
          node --test
          tests/ai-next/r07r-draft-preparation.test.mjs
          tests/ai-next/r07m-semantic-durable.test.mjs
          tests/ai-next/r07p-semantic-planner.test.mjs
      - name: Finance and production isolation
        run: node scripts/verify-deployment-isolation.mjs
