name: Actual App long financial document print entry
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/visual/long-document-app-print-entry.html'
      - 'tests/visual/run-long-document-app-print-entry.cjs'
      - '.github/workflows/long-document-app-print-entry.yml'
permissions:
  contents: read
concurrency:
  group: long-app-print-entry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  long-app-financial-print:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check tests/visual/run-long-document-app-print-entry.cjs
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1 http-server@14.1.1
      - name: Long final invoice and purchase order through App.requestPrint (Chromium evidence)
        shell: bash
        env:
          LOUREX_APP_PRINT_ENGINES: chromium
        run: |
          node node_modules/http-server/bin/http-server . -p 4173 -c-1 > /tmp/lourex-long-app-print.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node --input-type=module -e 'let ready=false;for(let i=0;i<50;i++){try{const r=await fetch("http://127.0.0.1:4173/tests/visual/long-document-app-print-entry.html");if(r.ok){ready=true;break;}}catch{}await new Promise(r=>setTimeout(r,100));}if(!ready)throw Error("App print fixture did not start");'
          node tests/visual/run-long-document-app-print-entry.cjs
          LOUREX_APP_PRINT_ENGINES=webkit LOUREX_APP_PRINT_ONE_CASE=1 node tests/visual/run-long-document-app-print-entry.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-app-print-pdfs
          path: visual-qa-output/long-app-print-entry/
          retention-days: 7
