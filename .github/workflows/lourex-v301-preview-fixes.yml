name: LOUREX v301 preview patch
on:
  push:
    branches: [feature/home-clean-rebuild-v284]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/home-clean-rebuild-v284
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/v301_patch.py
      - name: Commit preview fixes
        run: |
          rm -f .github/v301_patch.py .github/workflows/lourex-v301-preview-fixes.yml
          git config user.name "LOUREX v301 automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete mobile preview closeout v301 [skip ci]"
          git push origin HEAD:feature/home-clean-rebuild-v284
