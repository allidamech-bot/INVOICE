  .auth-account-page .auth-utility-controls{position:absolute!important;inset:16px 16px auto 16px!important;display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:8px!important}
  .auth-account-page .auth-language-switch,.auth-account-page .mf-theme-toggle{min-width:44px!important;min-height:44px!important;border:1px solid var(--ft-line)!important;border-radius:12px!important;background:var(--ft-surface-2)!important;color:var(--ft-text)!important;box-shadow:none!important}
  .auth-account-page .auth-language-switch{padding:0 13px!important;font-weight:800!important}
  .auth-account-page .auth-card-mobile-brand{margin:2px auto 20px!important}.auth-account-page .auth-card-heading{margin-bottom:18px!important}.auth-account-page .auth-card-heading h1{font-size:26px!important;line-height:1.15!important;letter-spacing:-.02em!important}.auth-account-page .auth-card-heading .subtle{font-size:13px!important;line-height:1.6!important;color:var(--ft-text-soft)!important}
  .auth-account-page .google-auth-button,.auth-account-page .premium-auth-primary{min-height:50px!important;border-radius:13px!important}.auth-account-page .account-entry-tabs{padding:3px!important;border:1px solid var(--ft-line)!important;border-radius:13px!important;background:var(--ft-surface-2)!important}.auth-account-page .account-entry-tabs button{border:0!important;border-radius:10px!important;background:transparent!important;color:var(--ft-text-soft)!important}.auth-account-page .account-entry-tabs button.active{background:var(--ft-accent-faint)!important;color:var(--ft-accent)!important}.auth-account-page .field-label{font-weight:750!important;color:var(--ft-text-soft)!important}.auth-account-page .input{border-color:var(--ft-line)!important;background:var(--ft-surface-2)!important;color:var(--ft-text)!important}.auth-account-page .premium-auth-primary{background:var(--ft-accent)!important;color:#03272b!important;font-weight:850!important;box-shadow:none!important}

  /* Settings: direct account exit and cleaner hierarchy on narrow phones. */
  .app-ui .settings-direct-account-bar{position:sticky!important;top:0!important;z-index:4!important;margin:-2px 0 10px!important;background:var(--ft-surface)!important}
  .app-ui .settings-direct-signout-button{min-width:104px!important}
  .app-ui .settings-workspace-v2 .settings-tabs{gap:4px!important;padding:4px!important;border:1px solid var(--ft-line)!important;border-radius:14px!important;background:var(--ft-surface-2)!important}.app-ui .settings-workspace-v2 .settings-tabs>button{border-radius:10px!important}.app-ui .settings-workspace-v2 .settings-tabs>button.active{background:var(--ft-accent-faint)!important;color:var(--ft-accent)!important}.app-ui .settings-workspace-v2 .settings-section{border:1px solid var(--ft-line)!important;border-radius:16px!important;background:var(--ft-surface)!important;box-shadow:none!important}

  /* Document editor: stronger visual hierarchy, less border noise, safer bottom space. */
