  .app-ui .editor-section .section-heading{margin:-16px -16px 16px!important;padding:12px 14px!important;border-bottom:1px solid var(--ft-line)!important;background:var(--ft-surface-2)!important}.app-ui .editor-section .section-heading>span,.app-ui .editor-section .section-heading>div>span{display:grid!important;place-items:center!important;min-width:34px!important;height:34px!important;border-radius:11px!important;background:var(--ft-accent-faint)!important;color:var(--ft-accent)!important;font-size:11px!important;font-weight:900!important}.app-ui .editor-section .section-heading h2{font-size:20px!important;font-weight:900!important;color:var(--ft-text-strong)!important}
  .app-ui .editor-section .field-label,.app-ui .editor-section .field>label{font-size:12px!important;font-weight:780!important;color:var(--ft-text-soft)!important}.app-ui .editor-section :where(.input,select.input,textarea.input){min-height:50px!important;border:1px solid color-mix(in srgb,var(--ft-line) 82%,var(--ft-text-soft) 18%)!important;border-radius:13px!important;background:var(--ft-surface-2)!important;color:var(--ft-text)!important;box-shadow:none!important}.app-ui .editor-section textarea.input{min-height:96px!important}
  .app-ui .editor-section .toggle-row{min-height:58px!important;padding:10px 12px!important;border:1px solid var(--ft-line)!important;border-radius:13px!important;background:var(--ft-surface-2)!important}
