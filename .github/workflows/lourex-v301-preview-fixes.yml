  .app-ui .screen-home .command-kpis{gap:1px!important;border:1px solid var(--ft-line)!important;border-radius:18px!important;overflow:hidden!important;background:var(--ft-line)!important}.app-ui .screen-home .dashboard-kpi{border:0!important;border-radius:0!important;box-shadow:none!important}
  .app-ui .screen-home .command-attention,.app-ui .screen-home .command-inventory-health,.app-ui .screen-home .command-recent{border-color:var(--ft-line)!important;box-shadow:none!important}
  .app-ui .screen-home .lourex-advisor-card{border:1px solid color-mix(in srgb,var(--ft-accent) 30%,var(--ft-line))!important;background:linear-gradient(180deg,color-mix(in srgb,var(--ft-surface) 92%,var(--ft-accent) 8%),var(--ft-surface))!important}

  /* Auth: one calm mobile card. Remove the oversized marketing column and keep the controls coherent. */
  .auth-account-page{min-height:100dvh!important;background:var(--ft-page,#061820)!important;padding:0!important}
  .auth-account-page .auth-account-frame{display:block!important;min-height:100dvh!important;width:100%!important;max-width:none!important;margin:0!important;padding:calc(22px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))!important}
