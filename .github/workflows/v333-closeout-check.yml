name: v333 critical documents closeout

on:
  push:
    branches:
      - fix/v333-critical-documents-visual-functional-closeout

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Current document reliability contracts
        run: node --test tests/v331-draft-scroll-account-transition.test.mjs tests/v332-critical-documents-deep-closeout.test.mjs tests/v333-critical-documents-visual-functional-closeout.test.mjs
      - name: Production build
        run: npm run build
