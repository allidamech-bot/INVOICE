name: Quotation template design
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/templates/**'
      - 'public/ios-print-bridge.js'
      - 'tests/pdf-artwork-contain.test.mjs'
      - 'src/lib/appearance.ts'
      - 'src/styles/document-premium-redesign-v141.css'
      - 'src/styles/template-surface-contrast-v366.css'
      - 'src/styles/hostinger-inspired-v353.css'
      - 'src/components/DocumentDesignControls.tsx'
      - 'tests/visual/quotation-pixel-contrast.cjs'
      - 'tests/visual/quotation-pdf-pixels.cjs'
      - 'tests/visual/run-quotation-closing.cjs'
      - 'tests/template-local-surface-readability.test.mjs'
      - 'scripts/v485-bundle-visible-ui.mjs'
      - 'scripts/v544-pdf-a4-output-emergency.mjs'
      - 'tests/visual/*quotation-template*'
      - 'tests/visual/template-visual-qa.*'
      - '.github/workflows/quotation-template-design.yml'
permissions:
  contents: read
jobs:
  template-rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        templates:
          - executive,minimal,trade
          - signature,obsidian,cobalt
          - editorial,split,prism
          - slate,horizon,mono
          - aurora,ledger,noir
          - midnight,blackivory,carbon
    env:
      LOUREX_TEMPLATE_IDS: ${{ matrix.templates }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm run build
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: sudo apt-get install -y poppler-utils
      - name: Verify commercial A4 and appearance contracts
        run: node --test tests/*template*.test.mjs tests/document-appearance*.test.mjs tests/document-premium-redesign-v141.test.mjs tests/*pdf*.test.mjs tests/*pagination*.test.mjs tests/*qr*.test.mjs
      - name: Verify 18 templates in Arabic, English and bilingual output
        env:
          LOUREX_TEMPLATE_QA_OUTPUT: visual-qa-output/quotation-template-design
        run: node tests/visual/run-quotation-template-design.cjs
      - name: Verify optional final-page composition and exported A4 closing
        env:
          LOUREX_CLOSING_PDF: 'true'
          LOUREX_TEMPLATE_QA_OUTPUT: visual-qa-output/quotation-template-design/closing
        run: node tests/visual/run-quotation-closing.cjs
      - name: Verify shape-aware stamp support and embedded Arabic typography
        run: node tests/visual/run-signing-artwork.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quotation-template-design-${{ matrix.templates }}
          path: visual-qa-output/quotation-template-design
          retention-days: 7
