name: v365 sync current main safely

on:
  push:
    branches:
      - fix/v365-mobile-editor-scroll-draft-templates
    paths:
      - .github/workflows/v365-sync-main.yml

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v365-mobile-editor-scroll-draft-templates
          fetch-depth: 0

      - name: Merge current main and resolve only the expected QA overlap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lourex-v365-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            expected="tests/visual/run-v364-core-workflows.cjs"
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi

            git checkout --ours -- "$expected"
            git show origin/main:"$expected" > /tmp/main-v364-core.cjs
            python - <<'PY'
          from pathlib import Path

          path=Path('tests/visual/run-v364-core-workflows.cjs')
          ours=path.read_text()
          main=Path('/tmp/main-v364-core.cjs').read_text()
          marker="    await run('Arabic Documents heading aligns to the right edge on a phone'"
          if marker not in main:
              raise SystemExit('Expected RTL Documents QA block is missing from main')
          if marker not in ours:
              start=main.index(marker)
              end_marker='\n    });'
              end=main.index(end_marker,start)+len(end_marker)
              block=main[start:end]
              anchor='\n  }finally{await browser.close();}'
              if anchor not in ours:
                  raise SystemExit('Could not locate v364 workflow insertion anchor')
              ours=ours.replace(anchor,'\n'+block+anchor,1)
              path.write_text(ours)
          PY
            git add "$expected"
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved merge conflicts remain.'
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git diff --check
          npm ci
          npm run typecheck
          npm run build
          node --test tests/v365-mobile-editor-scroll-draft-templates.test.mjs tests/mobile-documents-header-rtl-v365.test.mjs

          git add -A
          git commit -m "Merge main into v365 and preserve mobile RTL QA"
          git push origin HEAD:fix/v365-mobile-editor-scroll-draft-templates
