name: LOUREX v312 finalize document suite

on:
  push:
    branches:
      - feature/v312-business-document-suite

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v312-business-document-suite
          fetch-depth: 0
      - name: Apply final v312 fixes
        run: python3 .github/v312_finalize.py
      - name: Commit final v312 fixes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(v312): preserve business document kinds and semantics"
          git push origin HEAD:feature/v312-business-document-suite
