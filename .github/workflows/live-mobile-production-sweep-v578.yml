name: LOUREX Live Mobile Production Sweep

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tests/visual/run-live-mobile-production-sweep-v578.cjs'
      - '.github/workflows/live-mobile-production-sweep-v578.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-mobile-production:
    name: Live iPhone/iPad WebKit production QA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - name: Install WebKit runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Run live mobile production sweep
        run: node tests/visual/run-live-mobile-production-sweep-v578.cjs
