name: Batch 12 recurring domain integration

on:
  push:
    branches:
      - feat/lourex-recurring-workflows-batch12
    paths:
      - '.github/workflows/batch12-domain-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/lourex-recurring-workflows-batch12
      - name: Integrate recurring storage
        run: python3 .github/scripts/batch12-domain-integrate.py
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Remove temporary integration helpers
        run: rm .github/workflows/batch12-domain-integrate.yml .github/scripts/batch12-domain-integrate.py
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types.ts src/lib/defaults.ts src/storage/vault.ts src/storage/vault-merge.ts .github/workflows/batch12-domain-integrate.yml .github/scripts/batch12-domain-integrate.py
          git commit -m "feat(recurring): add encrypted recurring workflow storage"
          git push origin HEAD:feat/lourex-recurring-workflows-batch12
