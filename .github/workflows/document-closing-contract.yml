name: Document closing contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/audit-diff.ts'
      - 'src/storage/vault-merge.ts'
      - 'src/storage/vault.ts'
      - 'src/lib/workspaces.ts'
      - 'src/lib/backup.ts'
      - 'src/app/App.tsx'
      - 'src/components/OperationsPage.tsx'
      - 'tests/purchase-post-confirmation-20261022.test.mjs'
      - 'tests/customer-payment-delete-confirmation-20261023.test.mjs'
      - 'tests/draft-deletion-audit-20261021.test.mjs'
      - 'tests/audit-field-order-continuity-20261023.test.mjs'
      - 'tests/stock-backup-integrity-20261015.test.mjs'
      - 'tests/audit-new-document-event-id-collisions.test.mjs'
      - 'tests/draft-deletion-continuity-20261021.test.mjs'
      - 'src/lib/payment-voucher.ts'
      - 'src/components/PaymentVoucherModal.tsx'
      - 'src/components/InvoicePaymentsPanel.tsx'
      - 'src/components/SupplierPayablesPage.tsx'
      - 'src/styles/payables-batch9.css'
      - 'tests/payment-vouchers-20261021.test.mjs'
      - 'tests/payment-voucher-ui.test.mjs'
      - 'src/lib/document-kinds.ts'
      - 'src/components/AppShell.tsx'
      - 'src/components/DocumentsPage.tsx'
      - 'tests/document-final-qa-v130.test.mjs'
      - 'tests/live-document-regressions-v584.test.mjs'
      - 'tests/live-document-studio-pdf-ux-v583.test.mjs'
      - 'tests/v329-visual-recovery-contract.test.mjs'
      - 'tests/v330-critical-documents-closeout.test.mjs'
      - 'tests/v333-critical-documents-visual-functional-closeout.test.mjs'
      - '.github/workflows/document-closing-contract.yml'
permissions:
  contents: read
concurrency:
  group: document-closing-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Closing contracts and canonical A4 owner
        run: node --test tests/document-final-qa-v130.test.mjs tests/live-document-regressions-v584.test.mjs tests/live-document-studio-pdf-ux-v583.test.mjs tests/v329-visual-recovery-contract.test.mjs tests/v330-critical-documents-closeout.test.mjs tests/v333-critical-documents-visual-functional-closeout.test.mjs tests/document-premium-redesign-v141.test.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Production build without deployment
        run: npm run build
      - name: Full Node regression including audit and persisted history
        run: node --test tests/*.test.mjs
      - name: Purchase posting confirmation and saved baseline
        run: node --test tests/purchase-post-confirmation-20261022.test.mjs tests/purchase-delete-confirmation-20261022.test.mjs tests/audit-remote-posted-purchase-immutability.test.mjs
      - name: Linked customer and supplier payment vouchers
        run: node --test tests/payment-vouchers-20261021.test.mjs tests/payment-voucher-ui.test.mjs tests/receivables-v133.test.mjs tests/purchase-payment-saved-cycle.test.mjs
      - name: Customer receipt deletion confirmation and audit accuracy
        run: node --test tests/customer-payment-delete-confirmation-20261023.test.mjs
