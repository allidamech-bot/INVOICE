name: Finance published Firestore Rules evidence (offline)

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/_firestore-published-rule-evidence.mjs'
      - 'scripts/inspect-live-firestore-rules.mjs'
      - 'tests/finance-firestore-published-rules-evidence.test.mjs'
      - 'tests/firestore-cloud-shell-inspection.test.mjs'
      - 'tests/fixtures/mock-firebase-rules-read.mjs'
      - '.github/workflows/finance-firestore-rules-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check read-only operator entrypoint
        run: node --check scripts/inspect-live-firestore-rules.mjs
      - name: Test synthetic published-release evidence, without cloud credentials
        run: node --test tests/finance-firestore-published-rules-evidence.test.mjs tests/firestore-cloud-shell-inspection.test.mjs
