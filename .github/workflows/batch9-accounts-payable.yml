name: LOUREX Accounts Payable QA
on:
  pull_request:
    paths:
      - 'src/types.ts'
      - 'src/lib/defaults.ts'
      - 'src/lib/operations.ts'
      - 'src/lib/payables.ts'
      - 'src/lib/payables-style.ts'
      - 'src/storage/vault.ts'
      - 'src/storage/vault-merge.ts'
      - 'src/components/FinanceWorkspace.tsx'
      - 'src/components/SupplierPayablesPage.tsx'
      - 'src/components/OperationsPage.tsx'
      - 'src/app/App.tsx'
      - 'src/styles/payables-batch9.css'
      - 'tests/accounts-payable-batch9.test.mjs'
      - '.github/workflows/batch9-accounts-payable.yml'
permissions:
  contents: read
jobs:
  accounts-payable:
    name: Batch 9 accounts payable gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Batch 9 accounts payable contracts
        run: node --test tests/accounts-payable-batch9.test.mjs
