name: LOUREX Document Design Final QA

on:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'scripts/v485-bundle-visible-ui.mjs'
      - 'scripts/v544-pdf-a4-output-emergency.mjs'
      - 'src/lib/appearance.ts'
      - 'src/templates/TemplateRenderer.tsx'
      - 'src/components/DocumentDesignControls.tsx'
      - 'src/components/EditorPageCore.tsx'
      - 'src/storage/vault.ts'
      - 'src/styles/template-surface-contrast-v366.css'
      - 'src/styles/v332-critical-documents-deep-closeout.css'
      - 'src/styles/roadmap-hardening-final.css'
      - 'src/styles/a4-mobile-print-v73.css'
      - 'src/portal/SharePortal.tsx'
      - 'public/share.html'
      - 'public/ios-print-bridge.js'
      - 'tests/batch5-editor-visual-flattening.test.mjs'
      - 'tests/document-design-final-deep-audit.test.mjs'
      - 'tests/document-design-controls-closeout.test.mjs'
      - 'tests/document-appearance-controls-v525.test.mjs'
      - 'tests/template-surface-contrast-v366.test.mjs'
      - 'tests/template-surface-tokens-v366.test.mjs'
      - 'tests/mobile-document-design-controls-v540.test.mjs'
      - 'tests/pdf-pagination-parity-v542.test.mjs'
      - 'tests/visual/template-visual-qa.js'
      - 'tests/visual/run-document-design-final-deep.cjs'
      - 'tests/visual/v542-pagination-parity.html'
      - 'tests/visual/v542-pagination-parity.js'
      - 'tests/visual/run-v542-pagination-parity.cjs'
      - '.github/workflows/document-design-final-deep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  document-design-final:
    name: Final document design deep gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: LOUREX static security gate
        run: node scripts/security-check.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Document design regression contracts
        run: |
          node --test \
            tests/document-design-final-deep-audit.test.mjs \
            tests/document-design-controls-closeout.test.mjs \
            tests/document-appearance-controls-v525.test.mjs \
            tests/template-surface-contrast-v366.test.mjs \
            tests/template-surface-tokens-v366.test.mjs \
            tests/mobile-document-design-controls-v540.test.mjs \
            tests/pdf-pagination-parity-v542.test.mjs
      - name: Install browser QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Custom appearance and pagination browser QA
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/lourex-document-design-final.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/tests/visual/template-visual-qa.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/lourex-document-design-final.log; exit 1; fi
          node tests/visual/run-document-design-final-deep.cjs
          node tests/visual/run-v542-pagination-parity.cjs
      - name: Upload final document design evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lourex-document-design-final-deep
          path: visual-qa-output/document-design-final-deep
          if-no-files-found: error
