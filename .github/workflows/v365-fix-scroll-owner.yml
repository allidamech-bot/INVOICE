name: v365 apply bounded editor scroll owner

on:
  push:
    branches:
      - fix/v365-mobile-editor-scroll-draft-templates
    paths:
      - .github/workflows/v365-fix-scroll-owner.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v365-mobile-editor-scroll-draft-templates
          fetch-depth: 0
      - name: Patch active editor scroll owner
        run: python scripts/v365-fix-scroll-owner.py
      - name: Verify scope and commit
        run: |
          git diff --check
          git diff -- src/styles/v331-draft-scroll-recovery.css tests/visual/run-v365-mobile-editor-scroll.cjs tests/v337-template-layout-site-pass.test.mjs
          git config user.name "lourex-v365-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/v331-draft-scroll-recovery.css tests/visual/run-v365-mobile-editor-scroll.cjs tests/v337-template-layout-site-pass.test.mjs
          git commit -m "v365 bound mobile document editor scroll owner"
          git push origin HEAD:fix/v365-mobile-editor-scroll-draft-templates
