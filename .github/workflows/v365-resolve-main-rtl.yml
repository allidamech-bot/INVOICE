name: v365 resolve main RTL test overlap

on:
  push:
    branches:
      - fix/v365-mobile-editor-scroll-draft-templates
    paths:
      - .github/workflows/v365-resolve-main-rtl.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v365-mobile-editor-scroll-draft-templates
          fetch-depth: 0
      - name: Preserve main RTL scenario alongside v365 Draft scenario
        run: |
          git fetch origin main
          python - <<'PY'
          from pathlib import Path

          path=Path('tests/visual/run-v364-core-workflows.cjs')
          current=path.read_text()
          if "Arabic Documents heading aligns to the right edge on a phone" in current:
              raise SystemExit(0)

          import subprocess
          main=subprocess.check_output(['git','show','origin/main:tests/visual/run-v364-core-workflows.cjs'], text=True)
          start=main.index("    await run('Arabic Documents heading aligns to the right edge on a phone'")
          end=main.index("  }finally{await browser.close();}", start)
          block=main[start:end]
          anchor="  }finally{await browser.close();}"
          if anchor not in current:
              raise SystemExit('Missing browser-finally anchor; refusing broad rewrite')
          current=current.replace(anchor,block+anchor,1)
          path.write_text(current)
          PY
          git diff --check
          git diff -- tests/visual/run-v364-core-workflows.cjs
          git config user.name "lourex-v365-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/run-v364-core-workflows.cjs
          git commit -m "v365 preserve main mobile RTL documents coverage"
          git push origin HEAD:fix/v365-mobile-editor-scroll-draft-templates
