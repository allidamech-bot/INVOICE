name: LOUREX Treasury Accounts Hardening Once

on:
  push:
    branches:
      - feat/lourex-roadmap-hardening-final

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/lourex-roadmap-hardening-final
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply frozen Treasury blueprint hardening
        run: python scripts/treasury-accounts-hardening.py
      - name: Commit hardened Treasury model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/types.ts src/lib/defaults.ts src/lib/workspaces.ts src/storage/vault.ts src/storage/vault-merge.ts src/lib/treasury-ledger.ts src/components/TreasuryLedgerPage.tsx tests/roadmap-hardening-v473.test.mjs
          git diff --cached --check
          git commit -m 'fix: complete treasury financial account ledger [skip ci]'
          git push origin HEAD:feat/lourex-roadmap-hardening-final
