name: Long invoice remaining template acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/visual/purchase-order-final-print.html'
      - 'tests/visual/run-purchase-order-final-print.cjs'
      - '.github/workflows/long-invoice-template-coverage.yml'
permissions:
  contents: read
concurrency:
  group: long-invoice-template-coverage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  invoice-templates:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1
            templates: minimal,trade,signature,cobalt
          - group: 2
            templates: editorial,split,prism,slate
          - group: 3
            templates: horizon,mono,aurora,ledger
          - group: 4
            templates: noir,midnight,blackivory,carbon
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Existing financial document contracts
        run: node --test tests/v300-purchase-order-attachments-pin.test.mjs tests/v312-business-document-suite.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1 http-server@14.1.1
      - name: Forty-line invoice across remaining registered templates
        shell: bash
        env:
          QA_TEMPLATES: ${{ matrix.templates }}
        run: |
          node node_modules/http-server/bin/http-server . -p 4173 -c-1 > /tmp/lourex-long-invoice-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node --input-type=module -e 'let ready=false;for(let i=0;i<50;i++){try{const r=await fetch("http://127.0.0.1:4173/tests/visual/purchase-order-final-print.html");if(r.ok){ready=true;break;}}catch{}await new Promise(r=>setTimeout(r,100));}if(!ready)throw Error("Invoice fixture did not start");'
          node tests/visual/run-purchase-order-final-print.cjs --long --invoice --templates="$QA_TEMPLATES"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-invoice-templates-${{ matrix.group }}
          path: visual-qa-output/invoice-native-pdf/
          retention-days: 7
