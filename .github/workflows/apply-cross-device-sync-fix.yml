name: Apply cross-device sync repair
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/fix/cross-device-account-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/cross-device-account-sync
      - name: Apply repair
        run: python scripts/patch-cross-device-sync.py
      - name: Validate
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-cross-device-sync-fix.yml scripts/patch-cross-device-sync.py
          git add src/app/App.tsx src/cloud/firebase.ts tests/audit-batch3.test.mjs tests/cross-device-account-sync.test.mjs
          git commit -m "Repair cross-device account synchronization"
          git push origin HEAD:fix/cross-device-account-sync
