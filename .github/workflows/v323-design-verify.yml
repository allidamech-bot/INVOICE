name: v323 Design-Only Verification

on:
  push:
    branches:
      - audit/v323-design-only-full-ui-pass

permissions:
  contents: read

jobs:
  verify-v323-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - name: Security gate
        run: node scripts/security-check.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install browser QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 http-server@14.1.1
          npx playwright install chromium
          npx playwright install --with-deps webkit
      - name: Design visual QA
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/visual/run-tailadmin-v320.cjs')
          s=p.read_text()
          s=s.replace("page.locator('.ta-create-menu').isVisible()", "page.locator('.ta-create-menu-desktop').isVisible()")
          p.write_text(s)
          p=Path('tests/visual/run-mobile-controls-density-v177.cjs')
          s=p.read_text()
          s=s.replace("'.shell-mobile-brand>button','.shell-sync-status','.page-heading .btn',", "'.shell-mobile-brand>button','.page-heading .btn',")
          p.write_text(s)
          PY
          npx http-server . -p 4173 -c-1 > /tmp/lourex-v323-qa.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/tests/visual/obsidian-shell.html >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/lourex-v323-qa.log; exit 1; fi
          node tests/visual/run-tailadmin-v320.cjs
          node tests/visual/run-premium-auth-gateway-v187.cjs
          node tests/visual/run-mobile-modal-overlap-v176.cjs
          node tests/visual/run-mobile-controls-density-v177.cjs
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const out='visual-qa-output/v323-current-mobile-geometry';
          fs.mkdirSync(out,{recursive:true});
          const viewports=[{width:320,height:568},{width:390,height:844},{width:430,height:932}];
          const langs=['en','ar'];
          const surfaces=[
            {name:'shell',file:'obsidian-shell.html',selector:'.ta-shell'},
            {name:'dashboard',file:'obsidian-dashboard.html',selector:'.ta-finance-dashboard'},
            {name:'documents',file:'obsidian-documents.html',selector:'.ta-documents-page'},
            {name:'settings',file:'obsidian-settings.html?scope=settings',selector:'.ta-settings-shell'}
          ];
          const intersection=(a,b)=>Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left))*Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const failures=[];
            let checks=0;
            try{
              for(const vp of viewports)for(const lang of langs)for(const surface of surfaces){
                const page=await browser.newPage({viewport:vp,hasTouch:true,isMobile:true});
                page.setDefaultTimeout(12000);
                const sep=surface.file.includes('?')?'&':'?';
                await page.goto(`http://127.0.0.1:4173/tests/visual/${surface.file}${sep}lang=${lang}`,{waitUntil:'load'});
                await page.locator(surface.selector).waitFor({state:'visible'});
                await page.evaluate(()=>document.fonts.ready);
                const base=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,innerWidth:window.innerWidth,dir:document.documentElement.dir}));
                if(base.scrollWidth>base.innerWidth+2)failures.push(`${surface.name} ${vp.width} ${lang}: horizontal overflow ${base.scrollWidth}/${base.innerWidth}`);
                if(lang==='ar'&&base.dir!=='rtl')failures.push(`${surface.name} ${vp.width}: Arabic not RTL`);
                if(lang==='en'&&base.dir==='rtl')failures.push(`${surface.name} ${vp.width}: English remained RTL`);
                checks+=3;
                if(surface.name==='shell'){
                  const m=await page.evaluate(()=>{
                    const r=s=>document.querySelector(s)?.getBoundingClientRect();
                    const top=r('.ta-topbar'),nav=r('.ta-mobile-nav'),ai=r('.lourex-ai-launcher'),search=r('.ta-search-trigger');
                    const buttons=[...document.querySelectorAll('.ta-mobile-nav>button')].filter(e=>getComputedStyle(e).display!=='none').map(e=>e.getBoundingClientRect().height);
                    return {top,nav,ai,search,buttons,iw:innerWidth,ih:innerHeight};
                  });
                  if(!m.top||m.top.height<44)failures.push(`shell ${vp.width} ${lang}: topbar below 44px`);
                  if(!m.nav||m.nav.left<-1||m.nav.right>m.iw+1||m.nav.bottom>m.ih+1)failures.push(`shell ${vp.width} ${lang}: mobile dock outside viewport`);
                  if(m.buttons.some(h=>h<44-.25))failures.push(`shell ${vp.width} ${lang}: mobile nav touch target below 44px`);
                  if(m.ai&&m.nav&&intersection(m.ai,m.nav)>0)failures.push(`shell ${vp.width} ${lang}: AI overlaps mobile dock`);
                  if(m.ai&&m.search&&intersection(m.ai,m.search)>0)failures.push(`shell ${vp.width} ${lang}: AI overlaps search`);
                  checks+=5;
                }
                if(surface.name==='dashboard'){
                  const m=await page.evaluate(()=>({cards:[...document.querySelectorAll('.ta-kpi-card')].map(e=>e.getBoundingClientRect()),actions:[...document.querySelectorAll('.ta-quick-actions>button')].map(e=>e.getBoundingClientRect()),iw:innerWidth}));
                  if(m.cards.some(r=>r.left<-1||r.right>m.iw+1))failures.push(`dashboard ${vp.width} ${lang}: KPI card outside viewport`);
                  if(m.actions.some(r=>r.height<44-.25))failures.push(`dashboard ${vp.width} ${lang}: quick action below 44px`);
                  checks+=2;
                }
                if(surface.name==='documents'){
                  const m=await page.evaluate(()=>({primary:[...document.querySelectorAll('.ta-documents-header-actions>.btn')].filter(e=>getComputedStyle(e).display!=='none').map(e=>e.getBoundingClientRect()),tabs:[...document.querySelectorAll('.ta-doc-type-tabs>button')].filter(e=>getComputedStyle(e).display!=='none').map(e=>e.getBoundingClientRect()),iw:innerWidth}));
                  if(m.primary.some(r=>r.left<-1||r.right>m.iw+1||r.height<44-.25))failures.push(`documents ${vp.width} ${lang}: primary action clipped or below 44px`);
                  if(m.tabs.some(r=>r.height<44-.25))failures.push(`documents ${vp.width} ${lang}: document tab below 44px`);
                  checks+=2;
                }
                if(surface.name==='settings'){
                  const m=await page.evaluate(()=>{const modal=document.querySelector('.modal.modal-xl')?.getBoundingClientRect();const nav=[...document.querySelectorAll('.ta-settings-nav button')].filter(e=>getComputedStyle(e).display!=='none').map(e=>e.getBoundingClientRect());return {modal,nav,iw:innerWidth,ih:innerHeight};});
                  if(!m.modal||m.modal.height<m.ih*.84||m.modal.left<-1||m.modal.right>m.iw+1)failures.push(`settings ${vp.width} ${lang}: workspace does not use mobile viewport`);
                  if(m.nav.some(r=>r.height<44-.25))failures.push(`settings ${vp.width} ${lang}: settings nav target below 44px`);
                  checks+=2;
                }
                await page.screenshot({path:`${out}/${surface.name}-${vp.width}-${lang}.png`,fullPage:false,animations:'disabled'});
                await page.close();
              }
            }finally{await browser.close();}
            fs.writeFileSync(`${out}/report.json`,JSON.stringify({checks,failures},null,2));
            assert.equal(failures.length,0,failures.join('\n'));
            console.log(`v323 current mobile geometry: ${checks} checks passed.`);
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
          node <<'NODE'
          const {webkit}=require('playwright');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const out='visual-qa-output/v323-webkit-mobile';
          fs.mkdirSync(out,{recursive:true});
          const cases=[
            {name:'shell',file:'obsidian-shell.html',selector:'.ta-shell'},
            {name:'documents',file:'obsidian-documents.html',selector:'.ta-documents-page'},
            {name:'settings',file:'obsidian-settings.html?scope=settings',selector:'.ta-settings-shell'}
          ];
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const failures=[];
            let checks=0;
            try{
              for(const vp of [{width:390,height:844},{width:430,height:932}])for(const lang of ['en','ar'])for(const item of cases){
                const page=await browser.newPage({viewport:vp,hasTouch:true,isMobile:true});
                page.setDefaultTimeout(15000);
                const sep=item.file.includes('?')?'&':'?';
                await page.goto(`http://127.0.0.1:4173/tests/visual/${item.file}${sep}lang=${lang}`,{waitUntil:'load'});
                await page.locator(item.selector).waitFor({state:'visible'});
                await page.waitForTimeout(100);
                const state=await page.evaluate(({name})=>{
                  const rect=e=>e?.getBoundingClientRect();
                  const root=document.documentElement;
                  return {name,sw:root.scrollWidth,iw:innerWidth,ih:innerHeight,dir:root.dir,top:rect(document.querySelector('.ta-topbar')),nav:rect(document.querySelector('.ta-mobile-nav')),modal:rect(document.querySelector('.modal.modal-xl'))};
                },{name:item.name});
                if(state.sw>state.iw+2)failures.push(`${item.name} ${vp.width} ${lang}: WebKit overflow ${state.sw}/${state.iw}`);
                if(lang==='ar'&&state.dir!=='rtl')failures.push(`${item.name} ${vp.width}: WebKit Arabic not RTL`);
                if(lang==='en'&&state.dir==='rtl')failures.push(`${item.name} ${vp.width}: WebKit English remained RTL`);
                if(item.name==='shell'){
                  if(!state.top||state.top.height<44)failures.push(`shell ${vp.width} ${lang}: WebKit topbar invalid`);
                  if(!state.nav||state.nav.left<-1||state.nav.right>state.iw+1||state.nav.bottom>state.ih+1)failures.push(`shell ${vp.width} ${lang}: WebKit nav outside viewport`);
                }
                if(item.name==='documents'){
                  const docTabs=await page.locator('.ta-doc-type-tabs>button').evaluateAll(es=>es.filter(e=>getComputedStyle(e).display!=='none').map(e=>e.getBoundingClientRect().height));
                  if(docTabs.some(h=>h<44-.25))failures.push(`documents ${vp.width} ${lang}: WebKit tab below 44px`);
                }
                if(item.name==='settings'&&(!state.modal||state.modal.height<state.ih*.84))failures.push(`settings ${vp.width} ${lang}: WebKit settings workspace too short`);
                checks+=6;
                await page.screenshot({path:`${out}/${item.name}-${vp.width}-${lang}.png`,fullPage:false,animations:'disabled'});
                await page.close();
              }
            }finally{await browser.close();}
            fs.writeFileSync(`${out}/report.json`,JSON.stringify({checks,failures},null,2));
            assert.equal(failures.length,0,failures.join('\n'));
            console.log(`v323 WebKit mobile geometry: ${checks} checks passed.`);
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Upload v323 design evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v323-design-evidence
          path: visual-qa-output
          if-no-files-found: ignore
