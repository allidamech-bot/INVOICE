name: Apply fast sync and no-PIN prompt fix

on:
  push:
    branches: [fix/fast-sync-no-pin-prompts]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/fast-sync-no-pin-prompts
      - name: Apply targeted source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p=Path(path)
              text=p.read_text()
              count=text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {count}: {old[:100]}')
              p.write_text(text.replace(old,new))

          app='src/app/App.tsx'
          replace(app,
            "import { clearSession, establishSession, isCurrentSessionExpired, touchSession } from '../storage/session.js';",
            "import { clearSession, establishSession, touchSession } from '../storage/session.js';")
          replace(app,
            "    // localStorage writes and timeout churn on every editor keystroke made typing\n    // visibly heavier on iPhone. A 15s activity heartbeat preserves auto-lock\n    // accuracy while keeping the hot input path synchronous-work free.",
            "    // Keep the trusted device session warm without adding work to every keystroke.\n    // Session expiry no longer drives a PIN prompt during normal application use.")
          replace(app,
            "  private handleOnline=()=>{this.scheduleCloudSync(500);};",
            "  private handleOnline=()=>{this.scheduleCloudSync(80);};")
          replace(app,
            "  private handleVisibilityChange=()=>{if(document.visibilityState!=='visible'||!this.state.unlocked)return;const mins=this.state.vault?.appSettings.autoLockMinutes??15;if(isCurrentSessionExpired(mins)){void this.lockNow(true);return;}touchSession();this.resetAutoLock();this.scheduleCloudSync(700);};",
            "  private handleVisibilityChange=()=>{if(document.visibilityState!=='visible'||!this.state.unlocked)return;touchSession();this.resetAutoLock();this.scheduleCloudSync(120);};")
          replace(app,
            "  private resetAutoLock=()=>{if(this.lockTimer)window.clearTimeout(this.lockTimer);const mins=this.state.vault?.appSettings.autoLockMinutes??15;if(mins>0)this.lockTimer=window.setTimeout(()=>void this.lockNow(true),mins*60_000);};",
            "  private resetAutoLock=()=>{if(this.lockTimer){window.clearTimeout(this.lockTimer);this.lockTimer=undefined;}};")
          replace(app,
            "  private scheduleCloudSync=(delay=1_200)=>{",
            "  private scheduleCloudSync=(delay=220)=>{")
          replace(app,
            "if(this.cloudSyncQueued){this.cloudSyncQueued=false;this.scheduleCloudSync(700);}",
            "if(this.cloudSyncQueued){this.cloudSyncQueued=false;this.scheduleCloudSync(180);}")
          replace(app,
            "if(result==='pulled'){configured=true;await clearSession();}",
            "if(result==='pulled'){configured=true;}")
          replace(app,
            "if(result==='pulled'){await clearSession();this.setState({cloudSyncState:'synced',cloudSyncMessage:t('Cloud data restored. Enter your LOUREX PIN to unlock it.','تمت استعادة البيانات السحابية. أدخل رمز PIN الخاص بـ LOUREX لفتحها.')});window.location.reload();return;}",
            "if(result==='pulled'){this.setState({cloudSyncState:'synced',cloudSyncMessage:t('Cloud data restored. This trusted device stays signed in.','تمت استعادة البيانات السحابية وسيبقى هذا الجهاز الموثوق مسجلاً للدخول.')});window.location.reload();return;}")
          replace(app,
            "if(result==='pulled'){await clearSession();window.location.reload();return;}",
            "if(result==='pulled'){window.location.reload();return;}")
          replace(app,
            "finally{this.cloudSyncRunning=false;if(this.cloudSyncQueued){this.cloudSyncQueued=false;this.scheduleCloudSync(500);}}",
            "finally{this.cloudSyncRunning=false;if(this.cloudSyncQueued){this.cloudSyncQueued=false;this.scheduleCloudSync(150);}}")
          replace(app,
            "this.setState({firstRun:false,unlocked:true,key:setup.key,vault:setup.vault,screen:'documents',cloudLinked,cloudSyncState,cloudSyncMessage},()=>{this.resetAutoLock();this.scheduleCloudSync(350);});",
            "this.setState({firstRun:false,unlocked:true,key:setup.key,vault:setup.vault,screen:'documents',cloudLinked,cloudSyncState,cloudSyncMessage},()=>{this.resetAutoLock();this.scheduleCloudSync(150);});")
          replace(app,
            "else this.scheduleCloudSync(1200);",
            "else this.scheduleCloudSync(220);")

          p=Path(app)
          text=p.read_text()
          text=text.replace("then use Sync Now.","and it will apply automatically when the editor is safe.")
          text=text.replace("ثم استخدم «مزامنة الآن».","وسيتم تطبيقها تلقائيًا عندما يصبح المحرر في حالة آمنة.")
          p.write_text(text)

          replace('src/components/EditorPageCore.tsx',
            "this.autosaveTimer=window.setTimeout(()=>void this.save(true),1200);",
            "this.autosaveTimer=window.setTimeout(()=>void this.save(true),450);")

          freshness=Path('src/cloud/freshness.ts')
          f=freshness.read_text()
          pairs=[
            ('function schedule(delay=120):void{','function schedule(delay=60):void{'),
            ('subscribeCloudVaultChanges(uid,()=>schedule(70))','subscribeCloudVaultChanges(uid,()=>schedule(25))'),
            ('schedule(1800);','schedule(700);'),
            ('const onFocus=()=>schedule(70);','const onFocus=()=>schedule(30);'),
            ('const onOnline=()=>schedule(80);','const onOnline=()=>schedule(30);'),
            ('const onPageshow=()=>schedule(80);','const onPageshow=()=>schedule(40);'),
            ("if(document.visibilityState==='visible')schedule(80);","if(document.visibilityState==='visible')schedule(40);"),
            ('window.setInterval(()=>schedule(0),15_000)','window.setInterval(()=>schedule(0),5_000)'),
            ('schedule(500);','schedule(120);')
          ]
          for old,new in pairs:
              if old not in f: raise SystemExit(f'freshness missing: {old}')
              f=f.replace(old,new)
          freshness.write_text(f)

          replace('tests/production.test.mjs',
            "assert.match(editor, /setTimeout\\(\\(\\)=>void this\\.save\\(true\\),1200\\)/);",
            "assert.match(editor, /setTimeout\\(\\(\\)=>void this\\.save\\(true\\),450\\)/);")
          replace('tests/ux-recovery-v152.test.mjs',
            "assert.match(app,/private scheduleCloudSync=\\(delay=1_200\\)/);",
            "assert.match(app,/private scheduleCloudSync=\\(delay=220\\)/);")
          replace('tests/cloud-only-account.test.mjs',
            "assert.match(freshness,/15_000/);",
            "assert.match(freshness,/5_000/);")

          Path('.github/workflows/apply-fast-sync-no-pin.yml').unlink()
          PY
      - name: Commit targeted fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Speed up cloud sync and stop recurring PIN prompts"
          git push origin HEAD:fix/fast-sync-no-pin-prompts
