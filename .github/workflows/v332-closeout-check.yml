name: v332 closeout verification

on:
  push:
    branches:
      - audit/v332-critical-documents-deep-closeout

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Full unit and contract suite
        shell: bash
        run: |
          set +e
          node --test tests/*.test.mjs > /tmp/v332-tests.log 2>&1
          status=$?
          echo "--- FAILURE SUMMARY ---"
          grep -E '^(not ok|# Subtest:|# tests|# suites|# pass|# fail|# cancelled|# skipped|# todo|# duration|  error:|  code:|  location:)' /tmp/v332-tests.log | tail -n 260 || true
          exit $status
      - name: Production build
        run: npm run build
