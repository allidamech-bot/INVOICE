name: LOUREX AI Next R07F Consent Memory CAS

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ai-next/storage/firestore-knowledge-cas.ts'
      - 'tests/ai-next/r07f-consented-memory.test.mjs'
      - '.github/workflows/ai-next-r07f-memory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-next-r07f-memory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consent-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Strict TypeScript and compile
        run: npm run typecheck && ./node_modules/.bin/tsc -p tsconfig.json
      - name: Consent, tombstone and concurrent memory tests
        run: node --test tests/ai-next/r03-conversation-state.test.mjs tests/ai-next/r07f-consented-memory.test.mjs
