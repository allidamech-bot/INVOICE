name: LOUREX v337 Final QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v337-final-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: v337 static regression contracts
        run: |
          node --test \
            tests/v331-draft-scroll-account-transition.test.mjs \
            tests/v333-critical-documents-visual-functional-closeout.test.mjs \
            tests/v337-template-layout-site-pass.test.mjs \
            tests/document-final-qa-v130.test.mjs \
            tests/mobile-preview-v156.test.mjs

      - name: Install Chromium and WebKit QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Start QA server
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/lourex-v337-qa-server.log 2>&1 &
          echo $! > /tmp/lourex-v337-qa-server.pid
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/tests/visual/template-visual-qa.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lourex-v337-qa-server.log
            exit 1
          fi

      - name: Template geometry — all 18 templates + WebKit sparse pass
        run: node tests/visual/run-template-visual-qa.cjs visual-qa-output/templates

      - name: Mobile Preview — Chromium + WebKit
        run: node tests/visual/run-mobile-preview-fit-v241.cjs

      - name: Create Center — all 10 actions
        run: node tests/visual/run-v337-create-center.cjs

      - name: Documents three-dot actions
        run: node tests/visual/run-v337-document-actions.cjs

      - name: Dashboard Documents Editor Customers reachability
        run: node tests/visual/run-v326-dashboard-documents.cjs

      - name: Business workspaces reachability
        run: node tests/visual/run-v326-business-workspaces.cjs

      - name: Access surfaces + forced Global Search scrolling
        run: node tests/visual/run-v326-access-surfaces.cjs

      - name: Studio Settings Account Modal Auth reachability
        run: node tests/visual/run-v326-studio-security-overlays.cjs

      - name: Existing TailAdmin system QA
        run: node tests/visual/run-tailadmin-v320.cjs

      - name: Existing navigation and auth functional QA
        run: node tests/visual/run-functional-navigation-auth-v200.cjs

      - name: Existing document workflow QA
        run: node tests/visual/run-functional-document-workflow.cjs

      - name: Stop QA server
        if: always()
        run: |
          if [ -f /tmp/lourex-v337-qa-server.pid ]; then
            kill "$(cat /tmp/lourex-v337-qa-server.pid)" >/dev/null 2>&1 || true
          fi

      - name: Upload v337 QA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lourex-v337-final-qa
          path: visual-qa-output
          if-no-files-found: ignore
