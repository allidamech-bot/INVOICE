name: LOUREX Four-PR In-Memory QA

on:
  push:
    branches:
      - audit/combined-four-pr-local-qa-20261009

permissions:
  contents: read

jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Merge reviewed commits only inside isolated runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.email qa@lourex.invalid
          git config user.name 'LOUREX isolated QA'
          while read -r name sha; do
            git fetch origin "+refs/heads/$name:refs/remotes/origin/$name"
            echo "Auditing current $name at $(git rev-parse "origin/$name")"
            merge_opts=()
            if [[ "$name" == "fix/qa-legacy-vault-preservation-20261009" ]]; then
              merge_opts=(-X theirs)
            elif [[ "$name" == "fix/qa-document-details-pagination-20261009" ]]; then
              merge_opts=(-X ours)
            fi
            if git merge "${merge_opts[@]}" --no-ff --no-edit "origin/$name"; then
              echo "Merged locally: $name"
            else
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [[ "$conflicts" == ".github/workflows/lourex-free-premerge.yml" ]]; then
                git checkout --ours .github/workflows/lourex-free-premerge.yml
                git add .github/workflows/lourex-free-premerge.yml
                git commit -m "Resolve QA workflow-only merge conflict"
              else
                echo "REAL MERGE CONFLICT:"
                git diff --name-only --diff-filter=U
                exit 1
              fi
            fi
          done <<'BRANCHES'
          fix/audit-workspace-payables-asof-20261009 31086a34e2e43a243336c2404ce95e2dacc08633
          fix/audit-ai-verified-auth-20261009 8ea408669510a7add24a5c684726155fe892b56c
          fix/qa-legacy-vault-preservation-20261009 d0b80c887b167eebf2e7d0a69559216f52d1dc46
          fix/qa-document-details-pagination-20261009 812eb8e368569cd00724c05d4862be047816a06e
          BRANCHES
          # Exact guarded overlap semantics: newer PR652 A4 rule remains the
          # stronger >520 cutoff, while the PR656 active-save fix is retained.
          grep -q 'synchronizeActiveWorkspaceOnSave' src/storage/vault.ts
          grep -q 'sourceVersion<20?' src/storage/vault.ts
          grep -q 'value.length>520' src/lib/document-quality.ts
          grep -q 'value.length>520' src/templates/TemplateRenderer.tsx
          # The final candidate includes the reviewed free-only audit workflow.
          # Remove ONLY this temporary integration runner's own YAML file.
          rm -f .github/workflows/qa-four-pr-local-ci.yml
          test -f .github/workflows/lourex-free-premerge.yml
          echo 'Combined in local runner; nothing pushed.'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Focused storage, finance, AI and PDF regressions
        run: |
          node --test --test-concurrency=2 \
            tests/storage.test.mjs \
            tests/saved-items.test.mjs \
            tests/qa-legacy-company-migration.test.mjs \
            tests/qa-long-document-terms.test.mjs \
            tests/commercial-output-hardening-v167.test.mjs \
            tests/v44-audit.test.mjs \
            tests/audit-treasury-reconciliation-history.test.mjs \
            tests/audit-ai-firebase-auth.test.mjs \
            tests/locked-account-unlock.test.mjs
      - name: Free real Chromium responsive browser smoke
        run: node scripts/qa-free-chrome-smoke.mjs
      - name: Run entire candidate test suite
        shell: bash
        run: |
          node --test --test-concurrency=2 tests/*.test.mjs > "$RUNNER_TEMP/candidate-tests.log" 2>&1 || true
          grep -E '^ℹ (tests|pass|fail) ' "$RUNNER_TEMP/candidate-tests.log" || true
      - name: Test unchanged main under same Node and dependencies
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/main-baseline" 15ff2921e75ef538855edecfebab7b83eb0baae4
          (
            cd "$RUNNER_TEMP/main-baseline"
            npm ci --no-audit --no-fund
            npm run build
            node --test --test-concurrency=2 tests/*.test.mjs > "$RUNNER_TEMP/main-tests.log" 2>&1 || true
          )
          grep -E '^ℹ (tests|pass|fail) ' "$RUNNER_TEMP/main-tests.log" || true
      - name: Reject new failing tests compared to main
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir=process.env.RUNNER_TEMP;
          const read=name=>fs.readFileSync(dir+'/'+name+'-tests.log','utf8');
          const nums=(s,k)=>Number(s.match(new RegExp('ℹ '+k+' (\\d+)'))?.[1]??-1);
          const failed=s=>{
            const map=new Map();
            for(const line of s.split('✖ failing tests:')[0].split(/\r?\n/)){
              if(!line.startsWith('✖ '))continue;
              const name=line.replace(/\s+\([\d.]+ms\)$/,'').trim();
              map.set(name,(map.get(name)||0)+1);
            }
            return map;
          };
          const main=read('main'),candidate=read('candidate');
          const base=failed(main),actual=failed(candidate),added=[];
          for(const [name,count] of actual){
            for(let i=0;i<count-(base.get(name)||0);i++)added.push(name);
          }
          console.log('main '+nums(main,'tests')+' total / '+nums(main,'pass')+' pass / '+nums(main,'fail')+' fail');
          console.log('candidate '+nums(candidate,'tests')+' total / '+nums(candidate,'pass')+' pass / '+nums(candidate,'fail')+' fail');
          console.log('NEW FAILED TESTS: '+added.length);
          for(const name of added.slice(0,60))console.log(name);
          if(nums(main,'tests')<1||nums(candidate,'tests')<1||added.length)process.exitCode=1;
          NODE
