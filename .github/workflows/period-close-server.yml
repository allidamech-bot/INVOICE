name: Closed period trusted server
on:
  pull_request:
    branches: [main]
    paths:
      - 'api/ai-core.js'
      - 'api/_accounting/**'
      - 'api/_ai/firebase-auth.js'
      - 'src/lib/period-close.ts'
      - 'src/lib/defaults.ts'
      - 'src/types.ts'
      - 'src/lib/backup.ts'
      - 'firestore.rules'
      - 'vercel.json'
      - 'package*.json'
      - 'tests/period-server*'
      - '.github/workflows/period-close-server.yml'
permissions:
  contents: read
concurrency:
  group: period-server-${{ github.ref }}
  cancel-in-progress: true
jobs:
  trusted-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc -p tsconfig.json
      - run: node --test tests/period-server.test.mjs tests/period-close.test.mjs
      - name: Real emulator only - trusted commits and old client rules
        run: npx --yes firebase-tools@14.12.1 emulators:exec --only firestore --project demo-lourex-period --config firebase.ai-ci.json "node --test tests/period-server-emulator.integration.mjs tests/firebase-firestore-rules-emulator.integration.mjs"
