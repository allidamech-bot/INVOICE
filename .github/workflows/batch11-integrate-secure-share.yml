name: Batch 11 integrate Secure Share
on:
  push:
    branches:
      - feat/lourex-secure-share-batch11
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/lourex-secure-share-batch11
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Integrate Secure Share into canonical screens
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path,old,new,label):
              p=Path(path);text=p.read_text()
              if old not in text: raise SystemExit(f'Missing pattern: {label}')
              p.write_text(text.replace(old,new,1))

          replace('src/components/DocumentsPage.tsx',
              "import { CommercialFlowPanel } from './CommercialFlowPanel.js';",
              "import { CommercialFlowPanel } from './CommercialFlowPanel.js';\nimport { secureShareEligible } from '../lib/secure-share-snapshot.js';",
              'DocumentsPage import')
          replace('src/components/DocumentsPage.tsx',
              "  onOpenStatements?:()=>void;\n}",
              "  onOpenStatements?:()=>void;\n  onSecureShare?:(doc:LourexDocument)=>void;\n}",
              'DocumentsPage props')
          replace('src/components/DocumentsPage.tsx',
              "      {canDelete&&this.state.detailId!==doc.id?<button type=\"button\" role=\"menuitem\" className=\"is-danger\"",
              "      {this.props.onSecureShare&&secureShareEligible(doc)?<button type=\"button\" role=\"menuitem\" onClick={()=>this.runAction(()=>this.props.onSecureShare?.(doc))}><Icon name=\"lock\"/><span>{t('Secure Share','مشاركة آمنة')}</span></button>:null}\n      {canDelete&&this.state.detailId!==doc.id?<button type=\"button\" role=\"menuitem\" className=\"is-danger\"",
              'DocumentsPage action')
          replace('src/components/DocumentsPage.tsx',
              "          <div className=\"ta-doc-detail-more ta-doc-actions\"><IconButton icon=\"more\"",
              "          {this.props.onSecureShare&&secureShareEligible(doc)?<Button icon=\"lock\" onClick={()=>this.props.onSecureShare?.(doc)}>{t('Secure Share','مشاركة آمنة')}</Button>:null}\n          <div className=\"ta-doc-detail-more ta-doc-actions\"><IconButton icon=\"more\"",
              'DocumentsPage detail')

          replace('src/components/CustomersPage.tsx',
              "interface Props {customers:Customer[];company:CompanySettings;onSave:(customer:Customer)=>Promise<void>;onDelete:(customer:Customer)=>Promise<void>;onNewDocument:(kind:DocumentKind,customer:Customer)=>Promise<void>;onViewStatement?:(customer:Customer)=>void;}",
              "interface Props {customers:Customer[];company:CompanySettings;onSave:(customer:Customer)=>Promise<void>;onDelete:(customer:Customer)=>Promise<void>;onNewDocument:(kind:DocumentKind,customer:Customer)=>Promise<void>;onViewStatement?:(customer:Customer)=>void;onSharedWithCustomer?:(customer:Customer)=>void;}",
              'CustomersPage props')
          replace('src/components/CustomersPage.tsx',
              "      <Customer360LivePanel customer={customer}/>\n\n      <div className=\"ta-customer-profile-grid\">",
              "      <Customer360LivePanel customer={customer}/>\n      {this.props.onSharedWithCustomer?<section className=\"lx-customer-shared-card\"><div><small>{t('Secure Share','مشاركة آمنة')}</small><strong>{t('Shared with customer','المشارك مع العميل')}</strong><p>{t('Review customer-facing secure links, viewed status and customer responses.','راجع الروابط الآمنة المرسلة للعميل وحالة المشاهدة وردود العميل.')}</p></div><Button icon=\"share\" onClick={()=>this.props.onSharedWithCustomer?.(customer)}>{t('Open Shares','فتح المشاركات')}</Button></section>:null}\n\n      <div className=\"ta-customer-profile-grid\">",
              'Customer 360 shared panel')

          replace('src/app/App.tsx',
              "import { GlobalSearch } from '../components/GlobalSearch.js';",
              "import { GlobalSearch } from '../components/GlobalSearch.js';\nimport { SecureShareManager } from '../components/SecureShareManager.js';",
              'App import')
          replace('src/app/App.tsx',
              "  catalogLauncher:CatalogLauncher; catalogSourceId:string;\n}",
              "  catalogLauncher:CatalogLauncher; catalogSourceId:string;\n  secureShareDoc:LourexDocument|null; secureShareCustomer:Customer|null;\n}",
              'App state interface')
          replace('src/app/App.tsx',
              "catalogLauncher:'',catalogSourceId:''};",
              "catalogLauncher:'',catalogSourceId:'',secureShareDoc:null,secureShareCustomer:null};",
              'App initial state')
          replace('src/app/App.tsx',
              "onCreateCreditNote={(doc)=>void this.createCreditNote(doc)} onOpenStatements={()=>navigate('receivables')}/>",
              "onCreateCreditNote={(doc)=>void this.createCreditNote(doc)} onOpenStatements={()=>navigate('receivables')} onSecureShare={(doc)=>this.setState({secureShareDoc:doc,secureShareCustomer:null})}/>",
              'App Documents callback')
          replace('src/app/App.tsx',
              "onViewStatement={(customer)=>this.setState({screen:'receivables'},()=>window.setTimeout(()=>window.dispatchEvent(new CustomEvent('lourex-finance-statement',{detail:{customerId:customer.id}})),0))}/>",
              "onViewStatement={(customer)=>this.setState({screen:'receivables'},()=>window.setTimeout(()=>window.dispatchEvent(new CustomEvent('lourex-finance-statement',{detail:{customerId:customer.id}})),0))} onSharedWithCustomer={(customer)=>this.setState({secureShareCustomer:customer,secureShareDoc:null})}/>",
              'App Customer callback')
          replace('src/app/App.tsx',
              "      <SettingsModal open={this.state.settingsOpen}",
              "      <SecureShareManager open={Boolean(this.state.secureShareDoc||this.state.secureShareCustomer)} document={this.state.secureShareDoc} customer={this.state.secureShareCustomer} cloudConnected={Boolean(this.state.cloudUser&&this.state.cloudLinked)} onOpenCloud={()=>this.setState({cloudModal:true})} onClose={()=>this.setState({secureShareDoc:null,secureShareCustomer:null})}/>\n      <SettingsModal open={this.state.settingsOpen}",
              'App manager render')
          replace('src/app/App.tsx',
              "this.setState({unlocked:false,key:null,vault:null,editorDoc:null,screen:'home',settingsOpen:false,newMenu:false});",
              "this.setState({unlocked:false,key:null,vault:null,editorDoc:null,screen:'home',settingsOpen:false,newMenu:false,secureShareDoc:null,secureShareCustomer:null});",
              'App lock cleanup')
          PY
          rm .github/workflows/batch11-integrate-secure-share.yml
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit verified integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/DocumentsPage.tsx src/components/CustomersPage.tsx src/app/App.tsx .github/workflows/batch11-integrate-secure-share.yml
          git commit -m "feat(share): integrate Secure Share into documents and customers"
          git push origin HEAD:feat/lourex-secure-share-batch11
