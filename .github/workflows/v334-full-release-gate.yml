name: v334 current release gate

on:
  push:
    branches:
      - audit/v334-global-shell-runtime-reliability

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Static security gate
        run: node scripts/security-check.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Current reliability contracts
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -type f \( -name 'v331*.test.mjs' -o -name 'v332*.test.mjs' -o -name 'v333*.test.mjs' -o -name 'v334*.test.mjs' \) -print | sort)
          printf 'Running %s current reliability contracts\n' "${#files[@]}"
          test "${#files[@]}" -gt 0
          node --test "${files[@]}"
      - name: Production build
        run: npm run build
