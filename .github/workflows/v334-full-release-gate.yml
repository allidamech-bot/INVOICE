name: v334 full release gate

on:
  push:
    branches:
      - audit/v334-global-shell-runtime-reliability

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Static security gate
        run: node scripts/security-check.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Full unit suite
        shell: bash
        run: |
          set +e
          failed=0
          while IFS= read -r file; do
            echo "::group::$file"
            node --test "$file"
            code=$?
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then
              echo "::error file=$file::Unit contract failed: $file"
              failed=1
            fi
          done < <(find tests -maxdepth 1 -name '*.test.mjs' -print | sort)
          exit "$failed"
