name: Workspace brand cards
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/LourexAdvisorCard.tsx'
      - 'src/styles/v485-visible-ui-corrections.css'
      - 'tests/visual/run-workspace-brand-cards.cjs'
      - '.github/workflows/workspace-brand-cards.yml'
permissions:
  contents: read
concurrency:
  group: workspace-brand-cards-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/visual/run-workspace-brand-cards.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-brand-cards
          path: visual-qa-output/workspace-brand-cards/
