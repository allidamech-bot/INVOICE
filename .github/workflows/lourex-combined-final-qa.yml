name: LOUREX Combined Final QA
on:
  push:
    branches:
      - audit/combined-final-qa-20261010
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Locked install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Production build without deploy
        run: npm run build
      - name: Focused combined safety and visual contracts
        run: node --test tests/logo-rebuild-v49.test.mjs tests/site-shell-audit-v86.test.mjs tests/foundation-hardening-v120.test.mjs tests/v302-real-pin-doc-entry.test.mjs tests/final-production-hardening-v165.test.mjs tests/company-settings-final-audit.test.mjs tests/v484-responsive-visual-hierarchy.test.mjs tests/v485-visible-ui-corrections.test.mjs
      - name: Entire historical suite no exclusions
        run: node --test --test-concurrency=2 tests/*.test.mjs
