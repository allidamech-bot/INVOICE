name: v365 live mobile editor QA

on:
  push:
    branches:
      - fix/v365-mobile-editor-scroll-draft-templates
    paths:
      - .github/workflows/v365-live-scroll-qa.yml

permissions:
  contents: read

jobs:
  live-qa:
    # Retry after binding the runtime-promoted .ta-main owner to its shell grid row.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v365-mobile-editor-scroll-draft-templates
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: v365 contracts
        run: node --test tests/v365-mobile-editor-scroll-draft-templates.test.mjs
      - name: Live browser editor QA
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/v365-live-qa.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/tests/visual/v365-mobile-editor-scroll.html >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/v365-live-qa.log; exit 1; fi
          node tests/visual/run-v365-mobile-editor-scroll.cjs
          node tests/visual/run-v365-iphone-document-editors.cjs
          node tests/visual/run-v364-core-workflows.cjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v365-live-mobile-editor-qa
          path: visual-qa-output
          if-no-files-found: warn
