name: LOUREX IA full unit diagnostic

on:
  push:
    branches:
      - feature/ia-ai-advisor-v276
    paths:
      - .github/workflows/ia-diagnostic-once.yml

permissions:
  contents: read

jobs:
  unit-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/ia-ai-advisor-v276
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - name: Build and run every unit test in one pass
        run: npm test
      # pass 2: after final mobile More IA contract alignment
