# Temporary isolated verifier for PR #389. Remove after the v320 final gate is green.
name: LOUREX v320 Final Verify

on:
  push:
    branches:
      - feature/v320-tailadmin-finance-full-ui-rebuild

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: LOUREX static security gate
        run: node scripts/security-check.mjs
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: v320 static verification
        run: |
          if compgen -G 'tests/v320-*.mjs' > /dev/null; then
            node --test tests/v320-*.mjs
          fi
