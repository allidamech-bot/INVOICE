name: LOUREX AI Next R04 Guarded Financial Drafts

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/ai-next/guarded-finance/**'
      - 'tests/ai-next/r04-guarded-finance.test.mjs'
      - '.github/workflows/ai-next-r04-guarded-finance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-next-r04-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-financial-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Strict TypeScript typecheck
        run: npm run typecheck
      - name: Compile isolated types and tools
        run: ./node_modules/.bin/tsc -p tsconfig.json
      - name: Synthetic R01 to R04 regression suite
        run: node --test tests/ai-next/r01-core.test.mjs tests/ai-next/r02-documents.test.mjs tests/ai-next/r03-conversation-state.test.mjs tests/ai-next/r04-guarded-finance.test.mjs
