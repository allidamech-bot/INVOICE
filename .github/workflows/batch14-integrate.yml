name: Batch 14 integrate governance

on:
  push:
    branches:
      - feat/lourex-governance-batch14
    paths:
      - 'scripts/batch14-integrate.py'
      - '.github/workflows/batch14-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/lourex-governance-batch14
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Integrate Batch 14
        run: python3 scripts/batch14-integrate.py
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit Batch 14
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types.ts src/lib/defaults.ts src/storage/vault.ts src/storage/vault-merge.ts src/components/SettingsModal.tsx src/app/App.tsx index.html
          git commit -m "feat(governance): integrate roles approvals and security gates"
          git rm scripts/batch14-integrate.py .github/workflows/batch14-integrate.yml
          git commit -m "chore(governance): remove one-shot Batch 14 integrator"
          git push origin HEAD:feat/lourex-governance-batch14
