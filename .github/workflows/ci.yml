name: LOUREX Invoice CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - name: Build test artifacts
        run: npm run build
      - { name: audit-batch1, if: always(), run: "node --test tests/audit-batch1.test.mjs" }
