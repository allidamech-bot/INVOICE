name: LOUREX Invoice CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: lourex-invoice-v141-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
