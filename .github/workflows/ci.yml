name: LOUREX Invoice CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: LOUREX static security gate
        run: node scripts/security-check.mjs
      - run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Unit tests — group 1 of 8
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' -print | sort)
          n=${#files[@]}; start=$((n*0/8)); end=$((n*1/8)); count=$((end-start))
          node --test "${files[@]:start:count}"
      - name: Unit tests — group 2 of 8
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' -print | sort)
          n=${#files[@]}; start=$((n*1/8)); end=$((n*2/8)); count=$((end-start))
          node --test "${files[@]:start:count}"
      - name: Unit tests — group 3 of 8
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' -print | sort)
          n=${#files[@]}; start=$((n*2/8)); end=$((n*3/8)); count=$((end-start))
          node --test "${files[@]:start:count}"
      - name: Unit tests — group 4 of 8
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' -print | sort)
          n=${#files[@]}; start=$((n*3/8)); end=$((n*4/8)); count=$((end-start))
          node --test "${files[@]:start:count}"
      - name: Unit tests — group 5 of 8
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' -print | sort)
          n=${#files[@]}; start=$((n*4/8)); end=$((n*5/8)); count=$((end-start))
          node --test "${files[@]:start:count}"
      - name: Unit tests — group 6 of 8
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' -print | sort)
          n=${#files[@]}; start=$((n*5/8)); end=$((n*6/8)); count=$((end-start))
          node --test "${files[@]:start:count}"
      - name: Unit tests — group 7 of 8
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' -print | sort)
          n=${#files[@]}; start=$((n*6/8)); end=$((n*7/8)); count=$((end-start))
          node --test "${files[@]:start:count}"
      - name: Unit tests — group 8a
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' -print | sort)
          n=${#files[@]}; base=$((n*7/8)); span=$((n-base)); start=$base; end=$((base+span*1/4)); count=$((end-start))
          node --test "${files[@]:start:count}"
      - name: Unit tests — group 8b
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' -print | sort)
          n=${#files[@]}; base=$((n*7/8)); span=$((n-base)); start=$((base+span*1/4)); end=$((base+span*2/4)); count=$((end-start))
          node --test "${files[@]:start:count}"
      - name: Unit tests — group 8c1
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' -print | sort)
          n=${#files[@]}; base=$((n*7/8)); span=$((n-base)); cbase=$((base+span*2/4)); cend=$((base+span*3/4)); cspan=$((cend-cbase)); start=$cbase; end=$((cbase+cspan*1/4)); count=$((end-start))
          printf '%s\n' "${files[@]:start:count}"
          node --test "${files[@]:start:count}"
      - name: Unit tests — group 8c2
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' -print | sort)
          n=${#files[@]}; base=$((n*7/8)); span=$((n-base)); cbase=$((base+span*2/4)); cend=$((base+span*3/4)); cspan=$((cend-cbase)); start=$((cbase+cspan*1/4)); end=$((cbase+cspan*2/4)); count=$((end-start))
          printf '%s\n' "${files[@]:start:count}"
          node --test "${files[@]:start:count}"
      - name: Unit tests — group 8c3
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' -print | sort)
          n=${#files[@]}; base=$((n*7/8)); span=$((n-base)); cbase=$((base+span*2/4)); cend=$((base+span*3/4)); cspan=$((cend-cbase)); start=$((cbase+cspan*2/4)); end=$((cbase+cspan*3/4)); count=$((end-start))
          printf '%s\n' "${files[@]:start:count}"
          node --test "${files[@]:start:count}"
      - name: Unit tests — group 8c4
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' -print | sort)
          n=${#files[@]}; base=$((n*7/8)); span=$((n-base)); cbase=$((base+span*2/4)); cend=$((base+span*3/4)); cspan=$((cend-cbase)); start=$((cbase+cspan*3/4)); end=$cend; count=$((end-start))
          printf '%s\n' "${files[@]:start:count}"
          node --test "${files[@]:start:count}"
      - name: Unit tests — group 8d
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' -print | sort)
          n=${#files[@]}; base=$((n*7/8)); span=$((n-base)); start=$((base+span*3/4)); end=$n; count=$((end-start))
          node --test "${files[@]:start:count}"
      - name: Install browser visual QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Run browser visual QA
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/lourex-visual-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/tests/visual/template-visual-qa.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lourex-visual-qa-server.log
            exit 1
          fi
          node tests/visual/run-pdf-searchable-v222.cjs
          node tests/visual/run-template-visual-qa.cjs visual-qa-output
          node tests/visual/run-mobile-final-quote-stack.cjs
          node tests/visual/run-mobile-modal-overlap-v176.cjs
          node tests/visual/run-mobile-controls-density-v177.cjs
          node tests/visual/run-mobile-spacing-fit-v198.cjs
          node tests/visual/run-mobile-safari-chrome-v199.cjs
          node tests/visual/run-functional-navigation-auth-v200.cjs
          node tests/visual/run-save-reliability-v217.cjs
          node tests/visual/run-premium-auth-gateway-v187.cjs
          node tests/visual/run-obsidian-foundation.cjs
          node tests/visual/run-obsidian-shell.cjs
          node tests/visual/run-obsidian-dashboard.cjs
          node tests/visual/run-obsidian-documents.cjs
          node tests/visual/run-obsidian-editor.cjs
          node tests/visual/run-mobile-preview-fit-v241.cjs
          node tests/visual/run-functional-document-workflow.cjs
          node tests/visual/run-functional-editor-controls-v201.cjs
          node tests/visual/run-functional-payments.cjs
          node tests/visual/run-functional-customers-v196.cjs
          node tests/visual/run-functional-products-operations-v197.cjs
          node tests/visual/run-obsidian-directory.cjs
          node tests/visual/run-packing-preview-locale-v244.cjs
          node tests/visual/run-product-category-locale-v245.cjs
          node tests/visual/run-saved-items-category-locale-v246.cjs
          node tests/visual/run-product-unit-locale-v247.cjs
          node tests/visual/run-obsidian-financial.cjs
          node tests/visual/run-operations-mobile-tabs-v242.cjs
          node tests/visual/run-obsidian-settings.cjs
          node tests/visual/run-obsidian-overlays.cjs
          set -o pipefail
          node tests/visual/run-nested-surfaces-v229.cjs 2>&1 | tee visual-qa-output/nested-surfaces-v229.log
          node tests/visual/run-luminous-noir-v224.cjs
          node tests/visual/run-luminous-noir-continuity-v225.cjs
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lourex-visual-qa
          path: visual-qa-output
          if-no-files-found: ignore
