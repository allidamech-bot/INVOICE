name: LOUREX Invoice CI

on:
  workflow_dispatch:
    inputs:
      legacy_diagnostics:
        description: Run historical nonblocking diagnostics when investigating a relevant regression
        type: boolean
        default: false
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: LOUREX static security gate
        run: node scripts/security-check.mjs
      - run: npm run typecheck
      - name: Production build
        run: npm run build

      - name: Current PR contract tests
        id: current_contracts
        continue-on-error: true
        run: |
          git fetch origin main --depth=1
          mapfile -t changed_tests < <(git diff --name-only origin/main...HEAD -- 'tests/*.test.mjs' | grep -E '^tests/[^/]+\.test\.mjs$' | sort)
          printf 'current PR contract tests (%s):\n' "${#changed_tests[@]}" | tee current-contract-tests.log
          printf '%s\n' "${changed_tests[@]}" | tee -a current-contract-tests.log
          if [ "${#changed_tests[@]}" -eq 0 ]; then
            echo 'No changed top-level contract tests found.' | tee -a current-contract-tests.log
            exit 1
          fi
          set +e
          node --test "${changed_tests[@]}" 2>&1 | tee -a current-contract-tests.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Upload current PR contract diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lourex-current-contract-tests
          path: current-contract-tests.log
          if-no-files-found: error

      - name: Install browser stability runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Start WebKit stability server
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/lourex-v339-stability-server.log 2>&1 &
          echo $! > /tmp/lourex-v339-stability-server.pid
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/tests/visual/v338-editor-stability.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lourex-v339-stability-server.log
            exit 1
          fi

      - name: WebKit core editor stability
        id: stability_core
        continue-on-error: true
        run: node tests/visual/run-v338-editor-stability.cjs

      - name: WebKit iPad draft stability
        id: stability_ipad_draft
        continue-on-error: true
        run: |
          node tests/visual/run-v339-ipad-landscape-draft.cjs
          node tests/visual/run-v339-ipad-portrait-draft.cjs

      - name: WebKit commercial quotation geometry
        id: stability_commercial
        continue-on-error: true
        run: node tests/visual/run-v339-ipad-landscape-commercial.cjs

      - name: WebKit navigation, responsive and voice stability
        id: stability_remaining
        continue-on-error: true
        run: |
          node tests/visual/run-v337-shell-navigation.cjs
          node tests/visual/run-v339-shell-overlay-release.cjs
          node tests/visual/run-v339-signout-guard.cjs
          node tests/visual/run-responsive-batch1.cjs
          node tests/visual/run-search-keyboard-batch1.cjs
          node tests/visual/run-editor-keyboard-batch1.cjs
          node tests/visual/run-modal-viewport-acceptance-batch1.cjs
          node tests/visual/run-ai-voice-reliability-batch5.cjs

      - name: Stop WebKit stability server
        if: always()
        run: |
          if [ -f /tmp/lourex-v339-stability-server.pid ]; then
            kill "$(cat /tmp/lourex-v339-stability-server.pid)" >/dev/null 2>&1 || true
          fi

      - name: Enforce current PR contract + stability gates
        if: always()
        env:
          CURRENT_CONTRACTS: ${{ steps.current_contracts.outcome }}
          STABILITY_CORE: ${{ steps.stability_core.outcome }}
          STABILITY_IPAD_DRAFT: ${{ steps.stability_ipad_draft.outcome }}
          STABILITY_COMMERCIAL: ${{ steps.stability_commercial.outcome }}
          STABILITY_REMAINING: ${{ steps.stability_remaining.outcome }}
        run: |
          echo "Current PR contract tests: $CURRENT_CONTRACTS"
          echo "WebKit core editor stability: $STABILITY_CORE"
          echo "WebKit iPad draft stability: $STABILITY_IPAD_DRAFT"
          echo "WebKit commercial quotation geometry: $STABILITY_COMMERCIAL"
          echo "WebKit navigation/responsive/voice stability: $STABILITY_REMAINING"
          if [ "$CURRENT_CONTRACTS" != 'success' ] || [ "$STABILITY_CORE" != 'success' ] || [ "$STABILITY_IPAD_DRAFT" != 'success' ] || [ "$STABILITY_COMMERCIAL" != 'success' ] || [ "$STABILITY_REMAINING" != 'success' ]; then
            exit 1
          fi

  browser-qa:
    name: Current Browser/TailAdmin QA (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard:
          - templates
          - mobile-current
          - auth-documents
          - business-current
          - locales-current
          - tailadmin-current
          - v337-current
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Install browser QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Run ${{ matrix.shard }} QA shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          npx http-server . -p 4173 -c-1 > "/tmp/lourex-${SHARD}-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/tests/visual/template-visual-qa.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "/tmp/lourex-${SHARD}-server.log"
            exit 1
          fi

          case "$SHARD" in
            templates)
              node tests/visual/run-template-visual-qa.cjs
              node tests/visual/run-v303-layout-structure.cjs
              node tests/visual/run-v310-contrast-layout.cjs
              node tests/visual/run-v311-quality-pass.cjs
              node tests/visual/run-v314-canonical-layout.cjs
              node tests/visual/run-v330-template-contrast.cjs
              node tests/visual/run-v365-mobile-editor-scroll.cjs
              ;;
            mobile-current)
              node tests/visual/run-v321-mobile-critical-flows.cjs
              node tests/visual/run-mobile-save-durability-batch6.cjs
              node tests/visual/run-v339-ipad-landscape-commercial.cjs
              node tests/visual/run-v339-ipad-portrait-commercial.cjs
              node tests/visual/run-mobile-current.cjs
              ;;
            auth-documents)
              node tests/visual/run-account-auth-v215.cjs
              node tests/visual/run-v326-auth-documents.cjs
              node tests/visual/run-v337-auth-documents.cjs
              node tests/visual/run-v482-mobile-ux-repair.cjs
              ;;
            business-current)
              node tests/visual/run-v326-business-workspaces.cjs
              node tests/visual/run-v337-business-workspaces.cjs
              node tests/visual/run-v480-business-workspaces.cjs
              node tests/visual/run-contextual-ai-batch4.cjs
              ;;
            locales-current)
              node tests/visual/run-v326-locales.cjs
              node tests/visual/run-v337-locales.cjs
              ;;
            tailadmin-current)
              node tests/visual/run-v320-tailadmin-qa.cjs
              node tests/visual/run-v322-mobile-header.cjs
              node tests/visual/run-v323-design-system.cjs
              node tests/visual/run-v320-tailadmin-contract.cjs
              ;;
            v337-current)
              node tests/visual/run-v337-current.cjs
              ;;
            *)
              echo "Unknown current QA shard: $SHARD"
              exit 2
              ;;
          esac
      - name: Upload current browser QA diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lourex-current-visual-qa-${{ matrix.shard }}
          path: visual-qa-output
          if-no-files-found: ignore

  current-gate:
    name: Current PR Quality Gate
    needs:
      - verify
      - browser-qa
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce verify + all current browser QA shards
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          BROWSER_QA_RESULT: ${{ needs.browser-qa.result }}
        run: |
          echo "Verify result: $VERIFY_RESULT"
          echo "Current Browser/TailAdmin QA result: $BROWSER_QA_RESULT"
          if [ "$VERIFY_RESULT" != 'success' ] || [ "$BROWSER_QA_RESULT" != 'success' ]; then
            exit 1
          fi

  legacy-browser-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.legacy_diagnostics }}
    name: Legacy browser baseline (${{ matrix.shard }}, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard:
          - legacy-mobile
          - legacy-business
          - legacy-tailadmin
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - name: Production build for legacy browser diagnostics
        run: npm run build
      - name: Install legacy browser QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Run ${{ matrix.shard }} historical diagnostics
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          npx http-server . -p 4173 -c-1 > "/tmp/lourex-${SHARD}-legacy-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/tests/visual/template-visual-qa.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "/tmp/lourex-${SHARD}-legacy-server.log"
            exit 1
          fi

          status=0
          run_legacy(){
            echo "::group::$*"
            timeout --signal=TERM --kill-after=10s 90s "$@" || {
              code=$?
              echo "Historical QA diagnostic failed/timed out ($code): $*"
              status=1
            }
            echo "::endgroup::"
          }

          case "$SHARD" in
            legacy-mobile)
              run_legacy node tests/visual/run-mobile-controls-density-v177.cjs
              run_legacy node tests/visual/run-final-touch-targets-v275.cjs
              run_legacy node tests/visual/run-mobile-spacing-fit-v198.cjs
              run_legacy node tests/visual/run-mobile-safari-chrome-v199.cjs
              run_legacy node tests/visual/run-save-reliability-v217.cjs
              ;;
            legacy-business)
              run_legacy node tests/visual/run-functional-customers-v196.cjs
              run_legacy node tests/visual/run-functional-products-operations-v197.cjs
              run_legacy node tests/visual/run-packing-preview-locale-v244.cjs
              run_legacy node tests/visual/run-product-category-locale-v245.cjs
              run_legacy node tests/visual/run-product-unit-locale-v247.cjs
              run_legacy node tests/visual/run-operations-mobile-tabs-v242.cjs
              ;;
            legacy-tailadmin)
              run_legacy node tests/visual/run-v326-dashboard-documents.cjs
              run_legacy node tests/visual/run-v326-access-surfaces.cjs
              run_legacy node tests/visual/run-v326-studio-security-overlays.cjs
              ;;
            *)
              echo "Unknown legacy QA shard: $SHARD"
              exit 2
              ;;
          esac
          exit "$status"
      - name: Upload legacy browser diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lourex-legacy-browser-${{ matrix.shard }}
          path: visual-qa-output
          if-no-files-found: ignore

  legacy-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.legacy_diagnostics }}
    name: Legacy unit baseline (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - name: Production build for legacy contracts
        run: npm run build
      - name: Full historical unit suite
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' -print | sort)
          printf 'legacy top-level test files (%s):\n' "${#files[@]}" | tee legacy-unit.log
          printf '%s\n' "${files[@]}" | tee -a legacy-unit.log
          if [ "${#files[@]}" -gt 0 ]; then
            set +e
            node --test "${files[@]}" 2>&1 | tee -a legacy-unit.log
            status=${PIPESTATUS[0]}
            set -e
            exit "$status"
          fi
      - name: Upload legacy unit diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lourex-legacy-unit-baseline
          path: legacy-unit.log
          if-no-files-found: ignore
