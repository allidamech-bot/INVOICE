name: LOUREX Invoice CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: LOUREX static security gate
        run: node scripts/security-check.mjs
      - run: npm run typecheck
      - name: Build test artifacts
        run: npm run build
      - name: Full suite concurrency 2
        continue-on-error: true
        run: node --test --test-concurrency=2 tests/*.test.mjs
      - name: Full suite concurrency 4
        continue-on-error: true
        run: node --test --test-concurrency=4 tests/*.test.mjs
      - name: Full suite concurrency 8
        continue-on-error: true
        run: node --test --test-concurrency=8 tests/*.test.mjs
      - name: Serial full regression suite
        run: node --test --test-concurrency=1 tests/*.test.mjs
