name: LOUREX Invoice CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: LOUREX static security gate
        run: node scripts/security-check.mjs
      - run: npm run typecheck
      - name: Production build
        run: npm run build

      - name: Current PR contract tests
        id: current_contracts
        continue-on-error: true
        run: |
          git fetch origin main --depth=1
          mapfile -t changed_tests < <(git diff --name-only origin/main...HEAD -- 'tests/*.test.mjs' | grep -E '^tests/[^/]+\.test\.mjs$' | sort)
          printf 'current PR contract tests (%s):\n' "${#changed_tests[@]}" | tee current-contract-tests.log
          printf '%s\n' "${changed_tests[@]}" | tee -a current-contract-tests.log
          if [ "${#changed_tests[@]}" -eq 0 ]; then
            echo 'No changed top-level contract tests found.' | tee -a current-contract-tests.log
            exit 1
          fi
          set +e
          node --test "${changed_tests[@]}" 2>&1 | tee -a current-contract-tests.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Upload current PR contract diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lourex-current-contract-tests
          path: current-contract-tests.log
          if-no-files-found: error

      - name: Install browser visual QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Run v338/v339 editor stability WebKit gates
        id: stability_qa
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/lourex-v339-stability-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/tests/visual/v338-editor-stability.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lourex-v339-stability-server.log
            exit 1
          fi
          node tests/visual/run-v338-editor-stability.cjs
          node tests/visual/run-v339-ipad-landscape-draft.cjs

      - name: Run browser functional + TailAdmin v320/v337 QA
        id: visual_qa
        continue-on-error: true
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/lourex-visual-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/tests/visual/template-visual-qa.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lourex-visual-qa-server.log
            exit 1
          fi
          node tests/visual/run-pdf-searchable-v222.cjs
          node tests/visual/run-template-visual-qa.cjs visual-qa-output
          node tests/visual/run-mobile-final-quote-stack.cjs
          node tests/visual/run-mobile-modal-overlap-v176.cjs
          node tests/visual/run-mobile-controls-density-v177.cjs
          node tests/visual/run-final-touch-targets-v275.cjs
          node tests/visual/run-mobile-spacing-fit-v198.cjs
          node tests/visual/run-mobile-safari-chrome-v199.cjs
          node tests/visual/run-functional-navigation-auth-v200.cjs
          node tests/visual/run-save-reliability-v217.cjs
          node tests/visual/run-premium-auth-gateway-v187.cjs
          node tests/visual/run-mobile-preview-fit-v241.cjs
          node tests/visual/run-functional-document-workflow.cjs
          node tests/visual/run-functional-editor-controls-v201.cjs
          node tests/visual/run-functional-payments.cjs
          node tests/visual/run-functional-customers-v196.cjs
          node tests/visual/run-functional-products-operations-v197.cjs
          node tests/visual/run-import-final-audit-v267.cjs
          node tests/visual/run-packing-preview-locale-v244.cjs
          node tests/visual/run-product-category-locale-v245.cjs
          node tests/visual/run-saved-items-category-locale-v246.cjs
          node tests/visual/run-product-unit-locale-v247.cjs
          node tests/visual/run-operations-mobile-tabs-v242.cjs
          node tests/visual/run-tailadmin-v320.cjs
          node tests/visual/run-v326-dashboard-documents.cjs
          node tests/visual/run-v326-business-workspaces.cjs
          node tests/visual/run-v326-access-surfaces.cjs
          node tests/visual/run-v326-studio-security-overlays.cjs
          node tests/visual/run-v337-draft-output.cjs
          node tests/visual/run-v337-create-center.cjs
          node tests/visual/run-v337-document-actions.cjs
          node tests/visual/run-v337-shell-navigation.cjs

      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lourex-visual-qa
          path: visual-qa-output
          if-no-files-found: ignore
      - name: Enforce current PR quality gates
        if: always()
        env:
          CURRENT_CONTRACTS: ${{ steps.current_contracts.outcome }}
          STABILITY_QA: ${{ steps.stability_qa.outcome }}
          VISUAL_QA: ${{ steps.visual_qa.outcome }}
        run: |
          echo "Current PR contract tests: $CURRENT_CONTRACTS"
          echo "v338/v339 editor stability WebKit: $STABILITY_QA"
          echo "Browser/WebKit baseline: $VISUAL_QA"
          if [ "$CURRENT_CONTRACTS" != 'success' ] || [ "$STABILITY_QA" != 'success' ] || [ "$VISUAL_QA" != 'success' ]; then
            exit 1
          fi

  legacy-baseline:
    name: Legacy unit baseline (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - name: Production build for legacy contracts
        run: npm run build
      - name: Full historical unit suite
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' -print | sort)
          printf 'legacy top-level test files (%s):\n' "${#files[@]}" | tee legacy-unit.log
          printf '%s\n' "${files[@]}" | tee -a legacy-unit.log
          set +e
          node --test "${files[@]}" 2>&1 | tee -a legacy-unit.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Upload legacy baseline diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lourex-legacy-unit-baseline
          path: legacy-unit.log
          if-no-files-found: ignore
