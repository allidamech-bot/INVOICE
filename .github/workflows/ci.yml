name: LOUREX Invoice CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: LOUREX static security gate
        run: node scripts/security-check.mjs
      - run: npm run typecheck
      - name: Build test artifacts
        run: npm run build
      - name: Pair A-F + G-L
        continue-on-error: true
        run: node --test tests/[a-f]*.test.mjs tests/[g-l]*.test.mjs
      - name: Pair A-F + M-R
        continue-on-error: true
        run: node --test tests/[a-f]*.test.mjs tests/[m-r]*.test.mjs
      - name: Pair A-F + S-Z
        continue-on-error: true
        run: node --test tests/[a-f]*.test.mjs tests/[s-z]*.test.mjs
      - name: Pair G-L + M-R
        continue-on-error: true
        run: node --test tests/[g-l]*.test.mjs tests/[m-r]*.test.mjs
      - name: Pair G-L + S-Z
        continue-on-error: true
        run: node --test tests/[g-l]*.test.mjs tests/[s-z]*.test.mjs
      - name: Pair M-R + S-Z
        continue-on-error: true
        run: node --test tests/[m-r]*.test.mjs tests/[s-z]*.test.mjs
      - name: Serial full regression suite
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/*.test.mjs
      - name: Full regression suite
        run: node --test tests/*.test.mjs
