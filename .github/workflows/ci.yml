name: LOUREX Invoice CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-closeout:
    if: github.head_ref == 'feature/final-plan-closeout-v278'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/final-plan-closeout-v278
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare narrowed patch target
        run: python scripts/prepare-final-closeout-patch.py
      - name: Apply guarded closeout patch
        run: python scripts/final-closeout-patch.py
      - name: Commit functional closeout
        run: |
          git config user.name "ALI M.DAAMISH"
          git config user.email "allidamech@gmail.com"
          git add src
          git diff --cached --quiet && exit 1
          git commit -m "Complete contextual UX and domain ownership closeout"
          git push origin HEAD:feature/final-plan-closeout-v278
