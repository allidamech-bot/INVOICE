name: LOUREX Invoice CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - name: Run production build
        run: npm run build
      - name: Regression tests A-T
        if: always()
        run: node --test tests/[a-t]*.test.mjs
      - name: Regression ux-recovery-v152
        if: always()
        run: node --test tests/ux-recovery-v152.test.mjs
      - name: Regression v44-audit
        if: always()
        run: node --test tests/v44-audit.test.mjs
      - name: Regression vault-merge
        if: always()
        run: node --test tests/vault-merge.test.mjs
      - name: Regression visual-hierarchy-v153
        if: always()
        run: node --test tests/visual-hierarchy-v153.test.mjs
      - name: Regression workflow-closeout
        if: always()
        run: node --test tests/workflow-closeout.test.mjs
      - name: Regression workspace-mobile-v94
        if: always()
        run: node --test tests/workspace-mobile-v94.test.mjs
      - name: Regression workspace-v54
        if: always()
        run: node --test tests/workspace-v54.test.mjs
      - name: Regression workspace-v60
        if: always()
        run: node --test tests/workspace-v60.test.mjs
      - name: Install browser visual QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Run browser visual QA
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/lourex-visual-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/tests/visual/template-visual-qa.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lourex-visual-qa-server.log
            exit 1
          fi
          node tests/visual/run-template-visual-qa.cjs visual-qa-output
          node tests/visual/run-mobile-final-quote-stack.cjs
          node tests/visual/run-mobile-modal-overlap-v176.cjs
          node tests/visual/run-mobile-controls-density-v177.cjs
      - name: Upload visual QA evidence on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: lourex-visual-qa
          path: visual-qa-output
          if-no-files-found: ignore
