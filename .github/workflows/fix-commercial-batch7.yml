name: Fix commercial batch 7 issuance integrity
on:
  push:
    branches:
      - agent/commercial-controls-batch-7
    paths:
      - scripts/fix-commercial-batch7.mjs
      - .github/workflows/fix-commercial-batch7.yml
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/commercial-controls-batch-7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Apply issuance integrity fixes
        run: node scripts/fix-commercial-batch7.mjs
      - name: Remove one-shot fixer
        run: rm scripts/fix-commercial-batch7.mjs .github/workflows/fix-commercial-batch7.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Guard credit limit across all issuance paths"
          git push origin HEAD:agent/commercial-controls-batch-7
