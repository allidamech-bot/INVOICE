name: LOUREX AI Next R07L Materialized State and Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ai-next/storage/firestore-indexed-append.ts'
      - 'tests/ai-next/r07j-indexed-append.test.mjs'
      - 'tests/ai-next/r07j-real-firestore.test.mjs'
      - 'tests/ai-next/r07l-firestore-restart.test.mjs'
      - '.github/workflows/ai-next-r07l-materialized.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-next-r07l-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialized-state:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GCLOUD_PROJECT: demo-ai-next-r07h
      GOOGLE_CLOUD_PROJECT: demo-ai-next-r07h
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Strict TypeScript and compile
        run: npm run typecheck && ./node_modules/.bin/tsc -p tsconfig.json
      - name: Indexed state and coordinator regression
        run: >-
          node --test
          tests/ai-next/r07j-indexed-append.test.mjs
          tests/ai-next/r07k-coordinator-indexed-bridge.test.mjs
      - name: Seed operational state in official Firestore Emulator and export
        env:
          R07L_PHASE: seed
        run: >-
          npx --yes --package firebase-tools@14.16.0 firebase
          emulators:exec
          --only firestore
          --project demo-ai-next-r07h
          --config tests/ai-next/r07h-firebase-emulator.json
          --export-on-exit=/tmp/r07l-emulator-export
          --non-interactive
          "node --test tests/ai-next/r07l-firestore-restart.test.mjs"
      - name: Validate emulator export
        run: test -f /tmp/r07l-emulator-export/firebase-export-metadata.json
      - name: Restart emulator and recover materialized state
        env:
          R07L_PHASE: restore
        run: >-
          npx --yes --package firebase-tools@14.16.0 firebase
          emulators:exec
          --only firestore
          --project demo-ai-next-r07h
          --config tests/ai-next/r07h-firebase-emulator.json
          --import=/tmp/r07l-emulator-export
          --non-interactive
          "node --test tests/ai-next/r07l-firestore-restart.test.mjs"
