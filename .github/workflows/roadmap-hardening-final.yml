name: LOUREX Roadmap Hardening QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/treasury-ledger.ts'
      - 'src/lib/fx-rates.ts'
      - 'src/lib/warehouses.ts'
      - 'src/lib/profitability-dimensions.ts'
      - 'src/components/TreasuryLedgerPage.tsx'
      - 'src/components/FxRatesPage.tsx'
      - 'src/components/WarehouseLocationsPage.tsx'
      - 'src/components/ProfitabilityReports.tsx'
      - 'src/components/FinanceWorkspace.tsx'
      - 'src/components/ProductsInventoryWorkspace.tsx'
      - 'src/components/ReportsPage.tsx'
      - 'src/app/App.tsx'
      - 'src/types.ts'
      - 'src/lib/defaults.ts'
      - 'src/lib/workspaces.ts'
      - 'src/storage/vault.ts'
      - 'src/storage/vault-merge.ts'
      - 'src/lib/operations.ts'
      - 'src/styles/roadmap-hardening-final.css'
      - 'index.html'
      - 'tests/roadmap-hardening-v473.test.mjs'
      - 'tests/treasury-accounts-v474.test.mjs'
      - 'tests/treasury-accounts-hardening-v474.test.mjs'
      - 'tests/visual/roadmap-hardening-final.html'
      - 'tests/visual/run-roadmap-hardening-final.cjs'
      - '.github/workflows/roadmap-hardening-final.yml'
  workflow_dispatch:

jobs:
  hardening:
    name: Final roadmap hardening gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: LOUREX static security gate
        run: node scripts/security-check.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Final roadmap and treasury contracts
        run: node --test tests/treasury-accounts-v474.test.mjs tests/treasury-accounts-hardening-v474.test.mjs tests/roadmap-hardening-v473.test.mjs
      - name: Install final browser QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Mobile, RTL and touch-target QA
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/lourex-hardening.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/tests/visual/roadmap-hardening-final.html >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/lourex-hardening.log; exit 1; fi
          node tests/visual/run-roadmap-hardening-final.cjs
      - name: Upload hardening QA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lourex-roadmap-hardening-final
          path: visual-qa-output/roadmap-hardening-final
          if-no-files-found: ignore
