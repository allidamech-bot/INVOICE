name: LOUREX AI Next Real Firestore Edit Receipt Verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/ai-next/r07r-real-firestore-receipts.test.mjs'
      - '.github/workflows/ai-next-r07r-real-receipts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-next-r07r-real-receipts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-firestore-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCLOUD_PROJECT: demo-ai-next-r07h
      GOOGLE_CLOUD_PROJECT: demo-ai-next-r07h
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: TypeScript and isolated server build
        run: npm run typecheck && ./node_modules/.bin/tsc -p tsconfig.json
      - name: Genuine official Firestore Emulator / two Admin clients / demo project only
        env:
          FIREBASE_CLI_EXPERIMENTS: ''
        run: >-
          npx --yes --package firebase-tools@14.16.0 firebase
          emulators:exec
          --only firestore
          --project demo-ai-next-r07h
          --config tests/ai-next/r07h-firebase-emulator.json
          --non-interactive
          "node --test tests/ai-next/r07r-real-firestore-receipts.test.mjs"
      - name: Offline regression and production isolation
        run: >-
          node --test tests/ai-next/r07r-atomic-edit-receipts.test.mjs
          && node scripts/verify-deployment-isolation.mjs
