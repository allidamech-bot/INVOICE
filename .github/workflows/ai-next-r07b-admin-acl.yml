name: LOUREX AI Next R07B3 Server ACL Read Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ai-next/security/admin-membership-store.ts'
      - 'tests/ai-next/r07b-admin-acl.test.mjs'
      - '.github/workflows/ai-next-r07b-admin-acl.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-next-r07b-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-membership:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript and compile
        run: npm run typecheck && ./node_modules/.bin/tsc -p tsconfig.json
      - name: R07B3 root ACL and R07B1/2 synthetic regression
        run: node --test tests/ai-next/r07b-authority.test.mjs tests/ai-next/r07b-local-coordinator.test.mjs tests/ai-next/r07b-admin-acl.test.mjs
