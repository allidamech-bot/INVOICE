name: LOUREX AI Conversation Final QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ai-conversation-owner-stage4.mjs'
      - 'scripts/ai-conversation-owner-stage4-accessibility.mjs'
      - 'scripts/ai-conversation-owner-stage4-tools.mjs'
      - 'scripts/ai-conversation-owner-stage4-tools-closeout.mjs'
      - 'tests/ai-conversation-final-qa-batch5.test.mjs'
      - 'tests/visual/run-contextual-ai-batch4.cjs'
      - 'tests/visual/run-ai-voice-reliability-batch5.cjs'
      - 'tests/visual/contextual-ai-batch4.html'
      - 'tests/visual/ai-voice-reliability-batch5.html'
      - '.github/workflows/ai-conversation-final-qa-batch5.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-conversation-final-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  final-ai-conversation:
    name: iPhone/iPad/Desktop AI conversation gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: LOUREX static security
        run: node scripts/security-check.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Final conversation contracts
        run: node --test tests/ai-conversation-final-qa-batch5.test.mjs tests/ai-conversation-owner-batch4.test.mjs tests/ai-conversation-natural-os-batch4.test.mjs tests/ai-conversation-batch4-consolidation.test.mjs
      - name: Install Chromium and WebKit QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Run final responsive, RTL, tools and voice journeys
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/lourex-ai-final-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/tests/visual/contextual-ai-batch4.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lourex-ai-final-qa-server.log
            exit 1
          fi
          node tests/visual/run-contextual-ai-batch4.cjs
          LOUREX_QA_BROWSER=webkit node tests/visual/run-contextual-ai-batch4.cjs
          node tests/visual/run-ai-voice-reliability-batch5.cjs
      - name: Upload final AI conversation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lourex-ai-conversation-final-qa
          path: visual-qa-output
          if-no-files-found: error
