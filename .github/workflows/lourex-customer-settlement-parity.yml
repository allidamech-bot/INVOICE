name: LOUREX Financial Settlement Parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/ai-business.ts'
      - 'src/lib/payments.ts'
      - 'src/lib/receivables.ts'
      - 'src/lib/payables.ts'
      - 'src/lib/treasury-ledger.ts'
      - 'src/storage/vault-merge.ts'
      - 'tests/audit-supplier-payment-void-merge.test.mjs'
      - 'tests/treasury-accounts-hardening-v474.test.mjs'
      - 'tests/audit-treasury-reconciliation-source-scope.test.mjs'
      - 'tests/audit-treasury-account-new-identity.test.mjs'
      - 'tests/audit-posted-treasury-account-classification.test.mjs'
      - 'tests/audit-new-voided-treasury-source-parity.test.mjs'
      - 'tests/audit-treasury-offline-branch-posting.test.mjs'
      - 'tests/audit-voided-treasury-account-identity.test.mjs'
      - 'tests/ai-business-consistency-v450.test.mjs'
      - 'tests/financial-validation.test.mjs'
      - 'tests/sales-collection-saved-cycle.test.mjs'
      - 'tests/purchase-payment-saved-cycle.test.mjs'
      - 'tests/treasury-reconciliation-saved-cycle.test.mjs'
      - 'tests/settlement-transaction-date-policy.test.mjs'
      - '.github/workflows/lourex-customer-settlement-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lourex-customer-settlement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  settlement-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build without deployment
        run: npm run build
      - name: Approved settlement transaction-date policy
        run: node --test tests/settlement-transaction-date-policy.test.mjs
      - name: Saved quotation to fully collected invoice
        run: node --test tests/sales-collection-saved-cycle.test.mjs
      - name: Saved purchase, supplier settlement and reversal
        run: node --test tests/purchase-payment-saved-cycle.test.mjs tests/audit-purchase-stock-valuation-integrity.test.mjs
      - name: Saved treasury and reconciliation cycle
        run: node --test tests/treasury-reconciliation-saved-cycle.test.mjs
      - name: Customer supplier and treasury financial parity
        run: |
          node --test --test-concurrency=2 \
            tests/ai-business-consistency-v450.test.mjs \
            tests/receivables-v133.test.mjs \
            tests/audit-customer-receipt-scope-integrity.test.mjs \
            tests/audit-credit-note-branch-scope-integrity.test.mjs \
            tests/audit-supplier-payment-scope-integrity.test.mjs \
            tests/audit-new-document-identity-collisions.test.mjs \
            tests/accounting-chronology-v258.test.mjs \
            tests/financial-validation.test.mjs \
            tests/ai-operational-customer-collection.test.mjs \
            tests/audit-supplier-payment-void-merge.test.mjs \
            tests/audit-supplier-payables-asof.test.mjs \
            tests/accounts-payable-batch9.test.mjs \
            tests/treasury-accounts-hardening-v474.test.mjs \
            tests/audit-treasury-reconciliation-source-scope.test.mjs \
            tests/audit-treasury-account-new-identity.test.mjs \
            tests/audit-posted-treasury-account-classification.test.mjs \
            tests/audit-new-voided-treasury-source-parity.test.mjs \
            tests/audit-treasury-offline-branch-posting.test.mjs \
            tests/audit-voided-treasury-account-identity.test.mjs

      - name: Full Node regression suite for accounting policy changes
        run: node --test --test-concurrency=2 tests/*.test.mjs
