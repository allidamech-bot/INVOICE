name: Batch 12 recurring UI integration

on:
  push:
    branches:
      - feat/lourex-recurring-workflows-batch12
    paths:
      - '.github/workflows/batch12-ui-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/lourex-recurring-workflows-batch12
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply due-draft processing only
        run: python3 .github/scripts/batch12-ui-integrate.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Recurring workflow QA
        run: node --test tests/recurring-workflows-v464.test.mjs
      - name: Commit verified due-draft processing
        run: |
          rm .github/scripts/batch12-ui-integrate.py .github/workflows/batch12-ui-integrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx tests/recurring-workflows-v464.test.mjs .github/scripts/batch12-ui-integrate.py .github/workflows/batch12-ui-integrate.yml
          git commit -m "feat(recurring): generate due workflows as review drafts"
          git push origin HEAD:feat/lourex-recurring-workflows-batch12
