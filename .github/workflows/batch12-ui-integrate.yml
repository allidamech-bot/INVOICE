name: Batch 12 recurring UI integration

on:
  push:
    branches:
      - feat/lourex-recurring-workflows-batch12
    paths:
      - '.github/workflows/batch12-ui-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/lourex-recurring-workflows-batch12
      - name: Integrate recurring UI
        run: python3 .github/scripts/batch12-ui-integrate.py
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Remove temporary helpers
        run: rm .github/workflows/batch12-ui-integrate.yml .github/scripts/batch12-ui-integrate.py
      - name: Commit verified UI integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx src/components/DocumentsPage.tsx src/components/OperationsPage.tsx index.html .github/workflows/batch12-ui-integrate.yml .github/scripts/batch12-ui-integrate.py
          git commit -m "feat(recurring): wire recurring manager into documents and purchasing"
          git push origin HEAD:feat/lourex-recurring-workflows-batch12
