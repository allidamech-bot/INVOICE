name: Apply commercial batch 7 integration
on:
  push:
    branches:
      - agent/commercial-controls-batch-7
    paths:
      - scripts/apply-commercial-batch7.mjs
      - .github/workflows/apply-commercial-batch7.yml
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/commercial-controls-batch-7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Apply integration patch
        run: node scripts/apply-commercial-batch7.mjs
      - name: Remove one-shot helper
        run: rm scripts/apply-commercial-batch7.mjs .github/workflows/apply-commercial-batch7.yml
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate batch 7 commercial controls"
          git push origin HEAD:agent/commercial-controls-batch-7
