name: Apply commercial batch 7 integration
on:
  push:
    branches:
      - agent/commercial-controls-batch-7
    paths:
      - scripts/apply-commercial-batch7-v2.mjs
      - .github/workflows/apply-commercial-batch7.yml
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/commercial-controls-batch-7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Make active cache matcher specific
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-commercial-batch7-v2.mjs')
          s=p.read_text()
          old='source=once(source,"const CACHE = \'lourex-invoice-v135\';","const CACHE = \'lourex-invoice-v136\';",\'active v136 cache\');'
          new='source=once(source,"\\nconst CACHE = \'lourex-invoice-v135\';\\nconst LOCAL_CORE = ","\\nconst CACHE = \'lourex-invoice-v136\';\\nconst LOCAL_CORE = ",\'active v136 cache\');'
          if old not in s:
              raise SystemExit('active cache helper matcher not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Apply integration patch
        run: node scripts/apply-commercial-batch7-v2.mjs
      - name: Remove one-shot helpers
        run: rm scripts/apply-commercial-batch7.mjs scripts/apply-commercial-batch7-v2.mjs .github/workflows/apply-commercial-batch7.yml
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate batch 7 commercial controls"
          git push origin HEAD:agent/commercial-controls-batch-7
