name: v327 Production Recovery

on:
  push:
    branches:
      - hotfix/v327-production-create-menu-scroll

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v327-production-create-menu-scroll
          fetch-depth: 0

      - name: Apply deterministic recovery patch
        run: |
          python scripts/v327-production-recovery.py
          python scripts/v327-production-recovery-stage2.py

      - name: Install
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Static recovery contracts
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('src/app/App.tsx','utf8');
          const shell=fs.readFileSync('src/components/AppShell.tsx','utf8');
          const core=fs.readFileSync('src/components/EditorPageCore.tsx','utf8');
          const wrapper=fs.readFileSync('src/components/EditorPage.tsx','utf8');
          const utility=fs.readFileSync('src/styles/tailadmin-utilities-v320.css','utf8');
          const ai=fs.readFileSync('src/components/AiCopilot.tsx','utf8');
          if(!app.includes("target.closest('.ta-create-menu, .new-doc-menu')")) throw new Error('Create outside-click boundary missing');
          if(!shell.includes('ta-create-menu new-doc-menu')) throw new Error('Create menu compatibility class missing');
          if(!core.includes('data-editor-support-slot')) throw new Error('Editor support slot missing');
          if(!wrapper.includes('ReactDOM.createPortal(supportPanels,supportSlot)')) throw new Error('Editor support panels are outside canonical scroll');
          if(!utility.includes('touch-action:pan-y!important')) throw new Error('Editor touch scroll contract missing');
          if(!utility.includes('v327 — hard mobile editor viewport chain')) throw new Error('Hard editor viewport chain missing');
          if(!ai.includes('<Icon name="bot"/>')) throw new Error('AI robot identity missing');
          console.log('v327 static recovery contracts PASS');
          NODE

      - name: Install browser runtimes
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Browser recovery verification
        shell: bash
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/lourex-v327-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/tests/visual/obsidian-shell.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lourex-v327-server.log
            exit 1
          fi
          node tests/visual/run-functional-navigation-auth-v200.cjs
          node tests/visual/run-v327-production-recovery.cjs
          node tests/visual/run-mobile-final-quote-stack.cjs
          node tests/visual/run-mobile-modal-overlap-v176.cjs

      - name: Commit verified source recovery
        shell: bash
        run: |
          if git diff --quiet -- src tests/visual/obsidian-shell.html; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests/visual/obsidian-shell.html
          git commit -m 'fix(v327): recover creation editor scrolling and AI experience'
          git push origin HEAD:hotfix/v327-production-create-menu-scroll
