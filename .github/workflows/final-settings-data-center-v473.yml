name: Final Data Center repair integration

on:
  push:
    branches:
      - fix/lourex-final-roadmap-qa

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/lourex-final-roadmap-qa
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Apply Data Center source repair
        run: python3 scripts/final-settings-data-center-v473.py
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit verified Data Center repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SettingsModal.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(settings): complete Data Center backup sync and final organization"
          git push origin HEAD:fix/lourex-final-roadmap-qa
