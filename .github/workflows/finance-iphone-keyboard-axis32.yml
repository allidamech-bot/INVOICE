name: Finance iPhone keyboard autosave QA (Alif 32)

on:
  pull_request:
    paths:
      - 'tests/visual/run-finance-iphone-keyboard-axis32.cjs'
      - '.github/workflows/finance-iphone-keyboard-axis32.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finance-iphone-keyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Use pinned preinstalled WebKit
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          test -f "$(node -p "require('playwright').webkit.executablePath()")"
      - name: Verify iPhone keyboard financial draft autosave
        run: |
          node node_modules/http-server/bin/http-server . -p 4173 -c-1 > /tmp/lourex-iphone-keyboard.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node --input-type=module -e 'for(let i=0;i<50;i++){try{const r=await fetch("http://127.0.0.1:4173/tests/visual/obsidian-editor.html");if(r.ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,100));}process.exit(1)'
          node tests/visual/run-finance-iphone-keyboard-axis32.cjs
      - name: Save synthetic iPhone acceptance screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-iphone-keyboard-axis32
          path: visual-qa-output/finance-iphone-keyboard-axis32/
          retention-days: 7
          if-no-files-found: warn
