name: Batch 10 integrate Reports
on:
  push:
    branches:
      - feat/lourex-tax-vat-batch10
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/lourex-tax-vat-batch10
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Integrate Tax VAT Center
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/components/ReportsPage.tsx')
          text=path.read_text()
          replacements=[
            ("import { customerPerformanceReport, financialReportByCurrency, monthlyPerformanceReport, normalizeReportPeriod, type CustomerPerformanceRow } from '../lib/reports.js';\nimport { Button, Icon, Input, Select } from './UI.js';",
             "import { customerPerformanceReport, financialReportByCurrency, monthlyPerformanceReport, normalizeReportPeriod, type CustomerPerformanceRow } from '../lib/reports.js';\nimport { ensureTaxVatStyles } from '../lib/tax-vat-style.js';\nimport { TaxVatCenter } from './TaxVatCenter.js';\nimport { Button, Icon, Input, Select } from './UI.js';"),
            ("interface State{from:string;to:string;currency:string;query:string;preset:PeriodPreset|null;}",
             "interface State{view:'performance'|'tax';from:string;to:string;currency:string;query:string;preset:PeriodPreset|null;}"),
            ("state:State={from:`${todayIso().slice(0,4)}-01-01`,to:todayIso(),currency:'ALL',query:'',preset:'year'};",
             "state:State={view:'performance',from:`${todayIso().slice(0,4)}-01-01`,to:todayIso(),currency:'ALL',query:'',preset:'year'};"),
            ("componentDidMount():void{window.addEventListener('afterprint',this.afterPrint);}",
             "componentDidMount():void{ensureTaxVatStyles();window.addEventListener('afterprint',this.afterPrint);}"),
            ("  render():any{\n    const period=normalizeReportPeriod(this.state.from,this.state.to);",
             "  render():any{\n    if(this.state.view==='tax')return <div className=\"ta-reports-shell\"><nav className=\"ta-report-workspace-tabs\" role=\"tablist\" aria-label={t('Report sections','أقسام التقارير')}><button type=\"button\" role=\"tab\" aria-selected={false} onClick={()=>this.setState({view:'performance'})}>{t('Performance','الأداء')}</button><button type=\"button\" role=\"tab\" aria-selected={true} className=\"is-active\">{t('Tax / VAT','الضريبة / VAT')}</button></nav><TaxVatCenter company={this.props.company} documents={this.props.documents}/></div>;\n    const period=normalizeReportPeriod(this.state.from,this.state.to);"),
            ("    return <div className=\"ta-reports-page financial-report-print\">\n      <header className=\"ta-page-header ta-reports-header\">",
             "    return <div className=\"ta-reports-shell\"><nav className=\"ta-report-workspace-tabs\" role=\"tablist\" aria-label={t('Report sections','أقسام التقارير')}><button type=\"button\" role=\"tab\" aria-selected={true} className=\"is-active\">{t('Performance','الأداء')}</button><button type=\"button\" role=\"tab\" aria-selected={false} onClick={()=>this.setState({view:'tax'})}>{t('Tax / VAT','الضريبة / VAT')}</button></nav><div className=\"ta-reports-page financial-report-print\">\n      <header className=\"ta-page-header ta-reports-header\">"),
            ("      <footer className=\"report-print-footer\">{t('LOUREX internal management report. Currencies are never combined or converted automatically.','تقرير إداري داخلي من LOUREX. لا يتم جمع العملات أو تحويلها تلقائيًا.')}</footer>\n    </div>;\n  }\n}",
             "      <footer className=\"report-print-footer\">{t('LOUREX internal management report. Currencies are never combined or converted automatically.','تقرير إداري داخلي من LOUREX. لا يتم جمع العملات أو تحويلها تلقائيًا.')}</footer>\n    </div></div>;\n  }\n}")
          ]
          for old,new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected ReportsPage integration pattern not found: {old[:90]}')
              text=text.replace(old,new,1)
          path.write_text(text)
          PY
          rm .github/workflows/batch10-integrate-reports.yml
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit verified integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/ReportsPage.tsx .github/workflows/batch10-integrate-reports.yml
          git commit -m "feat(tax): integrate Tax VAT Center into Reports"
          git push origin HEAD:feat/lourex-tax-vat-batch10
