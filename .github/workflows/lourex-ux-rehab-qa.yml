name: LOUREX UX Rehabilitation QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/automatic-document-electronic-copy.test.mjs'
      - 'tests/visual/*automatic-document-electronic-copy*'
      - 'src/cloud/secure-share-owner.ts'
      - 'src/components/ElectronicDocumentManager.tsx'
      - 'src/styles/document-electronic-copy.css'
      - 'src/templates/DocumentQr.tsx'
      - 'src/templates/TemplateRenderer.tsx'
      - 'src/portal/**'
      - 'tests/document-electronic-qr.test.mjs'
      - 'tests/visual/*document-electronic-qr*'
      - 'src/styles/v485-visible-ui-corrections.css'
      - 'src/styles/tailadmin-auth-v320.css'
      - 'tests/visual/run-auth-mobile-logo-center-20261017.cjs'
      - 'src/components/ProductImportModal.tsx'
      - 'src/components/ProductPriceLists.tsx'
      - 'src/components/DraftDocumentEditor.tsx'
      - 'tests/visual/run-product-editor-webkit-v606.cjs'
      - 'tests/visual/run-editor-upgrade-webkit-20261016.cjs'
      - 'tests/visual/run-item-tools-menu-webkit-20261016.cjs'
      - 'src/components/SavedItemsModal.tsx'
      - 'src/styles/saved-items-picker-v232.css'
      - 'src/styles/pricing-batch8.css'
      - 'src/styles/inventory-planning-batch7.css'
      - 'src/components/WarehouseLocationsPage.tsx'
      - 'src/components/EditorPageCore.tsx'
      - 'src/components/ProductAiSourceReview.tsx'
      - 'src/components/AiConversationWorkspace.tsx'
      - 'src/lib/ai-tool-client.ts'
      - 'src/lib/ai-tool-presentation.ts'
      - 'scripts/ai-conversation-owner-stage4-tools-closeout.mjs'
      - 'tests/ai-customer-history-shipped-renderer-20261018.test.mjs'
      - 'src/lib/ai-intelligence-runtime.ts'
      - 'src/lib/ai-working-draft-plan.ts'
      - 'api/_ai/draft-plan.js'
      - 'tests/ai-working-draft-derived-preview-20261017.test.mjs'
      - 'api/ai-core.js'
      - 'api/ai-advisor-v2.js'
      - 'api/ai-conversation-v3.js'
      - 'api/_ai/lourex-dialogue.js'
      - 'tests/ai-natural-unified-dialogue.test.mjs'
      - 'src/components/DocumentsPage.tsx'
      - 'src/styles/tailadmin-documents-v320.css'
      - 'src/components/AppShell.tsx'
      - 'src/lib/product-ai-review.ts'
      - 'src/components/ProductLibraryWorkspace.tsx'
      - 'src/styles/tailadmin-products-v320.css'
      - 'src/styles/ai-conversation-workspace.css'
      - 'tests/visual/run-ai-batches1-7-current-workspace.cjs'
      - 'tests/visual/run-ai-conversation-final-batch5.cjs'
      - 'src/styles/editor-canonical-v314.css'
      - 'src/styles/roadmap-hardening-final.css'
      - 'public/startup-watchdog-v321.js'
      - 'tests/visual/ux-rehab-startup-late-hydration-20261016.html'
      - 'tests/ux-rehab-*.test.mjs'
      - 'tests/visual/run-ux-rehab-picker-webkit-20261016.cjs'
      - 'tests/visual/run-ux-rehab-warehouse-webkit-20261016.cjs'
      - 'tests/visual/ux-rehab-warehouse-20261016.html'
      - 'tests/visual/ux-rehab-ai-product-review-20261016.html'
      - 'tests/visual/run-ux-rehab-ai-product-webkit-20261016.cjs'
      - 'tests/visual/run-ux-rehab-document-webkit-20261016.cjs'
      - 'tests/visual/ux-rehab-documents-create-20261016.html'
      - 'tests/visual/ux-rehab-import-cancel-20261016.html'
      - 'tests/visual/run-ux-rehab-import-cancel-webkit-20261016.cjs'
      - 'tests/visual/ux-rehab-real-pdf-output-20261016.html'
      - 'tests/visual/run-ux-rehab-real-pdf-20261016.cjs'
      - '.github/workflows/lourex-ux-rehab-qa.yml'

permissions:
  contents: read

concurrency:
  group: lourex-ux-rehab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck · build · UX and full regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Compile final runtime bundle (no deployment)
        run: npm run build
      - name: UX picker and contrast regressions
        run: |
          node --test --test-concurrency=2 \
            tests/ux-rehab-saved-product-picker-20261016.test.mjs \
            tests/ux-rehab-inventory-contrast-20261016.test.mjs \
            tests/ux-rehab-warehouse-locations-20261016.test.mjs \
            tests/ux-rehab-editor-item-tools-20261016.test.mjs \
            tests/ux-rehab-ai-product-review-20261016.test.mjs \
            tests/ux-rehab-ai-source-duplicates-20261016.test.mjs \
            tests/ux-rehab-document-sections-20261016.test.mjs \
            tests/ux-rehab-document-create-20261016.test.mjs \
            tests/ux-rehab-release-acceptance-integration-20261016.test.mjs \
            tests/ai-post-release-markdown.test.mjs \
            tests/ux-rehab-import-chooser-20261016.test.mjs \
            tests/ai-batch6-mobile-import-integrity.test.mjs \
            tests/ai-batches1-7-release-candidate-contract.test.mjs \
            tests/saved-items-picker-mobile-v232.test.mjs \
            tests/saved-items-v95.test.mjs \
            tests/saved-items-library-v102.test.mjs
      - name: All accounting, inventory and UI Node regressions
        run: node --test --test-concurrency=2 tests/*.test.mjs

  picker-webkit:
    name: WebKit synthetic iPhone picker smoke
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build isolated test bundle (no deployment)
        run: npm run build
      - name: Install WebKit for offline browser QA
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright
          npx playwright install --with-deps chromium webkit
      - name: Exercise synthetic AI chat and picker/editor flows on phone and tablet
        run: |
          npx http-server . -p 4173 -a 127.0.0.1 -c-1 >/tmp/lourex-ux-picker-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/tests/visual/obsidian-directory.html >/dev/null; then break; fi
            sleep 1
          done
          # Check the sign-in logo centering on real iPhone/iPad viewports first.
          node tests/visual/run-auth-mobile-logo-center-20261017.cjs
          # Check chat before the longer product/editor battery.
          node tests/visual/run-ai-batches1-7-current-workspace.cjs
          node tests/visual/run-ai-conversation-final-batch5.cjs
          node tests/visual/run-ux-rehab-picker-webkit-20261016.cjs
          node tests/visual/run-ux-rehab-warehouse-webkit-20261016.cjs
          node tests/visual/run-ux-rehab-ai-product-webkit-20261016.cjs
          node tests/visual/run-ux-rehab-document-webkit-20261016.cjs
          node tests/visual/run-v538-quote-editor-final-flow.cjs
          node tests/visual/run-ux-rehab-import-cancel-webkit-20261016.cjs
          node tests/visual/run-product-editor-webkit-v606.cjs
          node tests/visual/run-editor-upgrade-webkit-20261016.cjs
          node tests/visual/run-item-tools-menu-webkit-20261016.cjs
      - name: Save isolated browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-rehab-picker-webkit
          path: |
            visual-qa-output/auth-mobile-logo-center/
            visual-qa-output/ux-rehab-picker-webkit/
            visual-qa-output/ux-rehab-warehouse-webkit/
            visual-qa-output/ux-rehab-ai-product-webkit/
            visual-qa-output/ux-rehab-document-webkit/
            visual-qa-output/v538-quote-editor-final-flow/
            visual-qa-output/ux-rehab-import-cancel-webkit/
            visual-qa-output/product-editor-webkit-v606/
            visual-qa-output/editor-upgrade-webkit/
            visual-qa-output/item-tools-menu-webkit/
            visual-qa-output/ai-batches1-7-current-workspace/
            visual-qa-output/ai-conversation-final-batch5/
          if-no-files-found: ignore
          retention-days: 7

  pdf-output-chromium:
    name: Actual PDF · A4 and extracted accounting totals
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies and build real document templates
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install Chromium and PDF inspection tools (CI only)
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils
      - name: Generate real synthetic invoice PDF files and inspect text, totals and A4 dimensions
        run: |
          npx http-server . -p 4173 -a 127.0.0.1 -c-1 >/tmp/lourex-real-pdf.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/tests/visual/ux-rehab-real-pdf-output-20261016.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/visual/run-ux-rehab-real-pdf-20261016.cjs
          node tests/visual/run-document-electronic-qr.cjs
          node tests/visual/run-automatic-document-electronic-copy.cjs
      - name: Attach generated synthetic PDFs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-rehab-real-pdf-output
          path: |
            visual-qa-output/ux-rehab-real-pdf/
            visual-qa-output/document-electronic-qr/
            visual-qa-output/automatic-document-electronic-copy/
          if-no-files-found: ignore
          retention-days: 7


  firestore-ai-emulator:
    name: Real Firestore UID isolation and AI multi-device recovery (local emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
      # Firebase emulator is constrained to localhost and a demo project ID.
      # Uses only the local emulator and a demo project; no external credentials.
    steps:
      - name: Checkout audited head, no write token
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Java 21 for local Firestore
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install emulator and rules test SDK without editing lockfiles
        run: npm install --no-save --package-lock=false --no-audit --no-fund firebase@12.1.0 @firebase/rules-unit-testing@5.0.2 firebase-tools@14.12.1
      - name: Compile real cloud history and vault modules (no deployment)
        run: npm run build
      - name: Execute Firestore rules and two-device history against 127.0.0.1 only
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "JSON.parse(require('fs').readFileSync('firebase.ai-ci.json')).emulators.firestore.host")" = '127.0.0.1'
          test "$(node -p "JSON.parse(require('fs').readFileSync('firebase.ai-ci.json')).emulators.firestore.port")" = '8080'
          ./node_modules/.bin/firebase emulators:exec \
            --only firestore --config firebase.ai-ci.json \
            --project demo-lourex-ai-integration-719 \
            "node --test --test-concurrency=1 tests/emulator/ai-history.test.mjs tests/firebase-firestore-rules-emulator.integration.mjs"
      - name: Exercise real browser Firebase Auth, two-device recovery and posted stock (local emulators only)
        shell: bash
        run: |
          set -euo pipefail
          config=firebase-ai-auth-local-ci.json
          trap 'rm -f "$config"' EXIT
          printf '%s\n' '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"host":"127.0.0.1","port":8080},"auth":{"host":"127.0.0.1","port":9099},"ui":{"enabled":false}}}' > "$config"
          ./node_modules/.bin/firebase emulators:exec \
            --only auth,firestore --config "$config" \
            --project demo-lourex-pinless-auth \
            "node scripts/qa-cloud-auth-emulator-browser.mjs"
      - name: Evidence boundary for release review
        if: always()
        shell: bash
        run: |
          echo 'Firestore emulator test is local-only (127.0.0.1:8080), demo project. No Firebase production access or deployment.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This test verifies UID rules and two-device history; it does NOT prove authenticated Preview isolation or account-scoped vendor keys.' >> "$GITHUB_STEP_SUMMARY"
