name: LOUREX AI Next R07G Sharded Conversation Events

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ai-next/storage/firestore-sharded-events.ts'
      - 'tests/ai-next/r07g-sharded-events.test.mjs'
      - '.github/workflows/ai-next-r07g-sharded-events.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-next-r07g-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sharded-events:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Strict TypeScript
        run: npm run typecheck
      - name: Compile AI Next for Node acceptance
        run: ./node_modules/.bin/tsc -p tsconfig.json
      - name: R07G >300 events with R03 and R07A regression
        run: node --test tests/ai-next/r03-conversation-state.test.mjs tests/ai-next/r07-firestore-cas.test.mjs tests/ai-next/r07g-sharded-events.test.mjs
