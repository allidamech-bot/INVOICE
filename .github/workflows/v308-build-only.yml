name: v308 build readiness
on:
  push:
    branches: [feature/v308-watermark-draft-letterhead]
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip v308 build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v308-watermark-draft-letterhead
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build only
        run: npm run build
      - name: Remove one-shot workflow
        if: success()
        run: |
          rm -f .github/workflows/v308-build-only.yml
          git config user.name "allidamech-bot"
          git config user.email "228416871+allidamech-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore(v308): remove build-only runner [skip v308 build]"
          git push origin HEAD:feature/v308-watermark-draft-letterhead
