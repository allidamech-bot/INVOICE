name: LOUREX AI Next Live Read-Only Firebase/Router Bridge
on:
  pull_request:
    branches: [main]
    paths:
      - 'api/ai-next-live.js'
      - 'src/ai-next/ui/AiNextLiveReadOnlyChat.tsx'
      - 'src/components/AiCopilot.tsx'
      - 'tests/ai-next/live-readonly-bridge.test.mjs'
      - '.github/workflows/ai-next-live-readonly-bridge.yml'
permissions:
  contents: read
jobs:
  safe-live-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: No-network auth, origin, read-only API tests
        run: node --test tests/ai-next/live-readonly-bridge.test.mjs
      - name: Preserve existing R05/R06/R07Q safety coverage
        run: >-
          ./node_modules/.bin/tsc -p tsconfig.json &&
          node --test tests/ai-next/r05-router.test.mjs
          tests/ai-next/r05-trusted-registry.test.mjs
          tests/ai-next/r06-ui-model.test.mjs
          tests/ai-next/r07q-routed-semantic.test.mjs
      - name: Verify no finance or production deployment modification
        run: node scripts/verify-deployment-isolation.mjs
