name: v365 isolated branch patch

on:
  push:
    branches:
      - fix/v365-mobile-editor-scroll-draft-templates
    paths:
      - .github/workflows/v365-branch-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/fix/v365-mobile-editor-scroll-draft-templates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v365-mobile-editor-scroll-draft-templates
          fetch-depth: 0
      - name: Apply scoped v365 patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text()
              if text.count(old)!=1:
                  raise SystemExit(f'expected one exact patch target in {path}, got {text.count(old)}')
              p.write_text(text.replace(old,new,1))

          replace_once('src/types.ts',
              "preset: 'blank' | 'formal-letter' | 'memo' | 'notice';",
              "preset: 'blank' | 'formal-letter' | 'company-letter' | 'letter-of-intent' | 'memo' | 'notice';")

          replace_once('src/lib/document-extras.ts',
              "const LETTER_PRESETS=new Set<LetterDocumentData['preset']>(['blank','formal-letter','memo','notice']);",
              "const LETTER_PRESETS=new Set<LetterDocumentData['preset']>(['blank','formal-letter','company-letter','letter-of-intent','memo','notice']);")
          replace_once('src/lib/document-extras.ts',
              "  if(preset==='formal-letter')return {...base,preset,subject:rtl?'الموضوع':'Subject',blocks:[block('paragraph',rtl?'السادة المحترمون،':'Dear Sir / Madam,'),block('paragraph',''),block('paragraph',rtl?'وتفضلوا بقبول فائق الاحترام.':'Sincerely,')]};\n  if(preset==='memo')",
              "  if(preset==='formal-letter')return {...base,preset,subject:rtl?'الموضوع':'Subject',blocks:[block('paragraph',rtl?'السادة المحترمون،':'Dear Sir / Madam,'),block('paragraph',''),block('paragraph',rtl?'وتفضلوا بقبول فائق الاحترام.':'Sincerely,')]};\n  if(preset==='company-letter')return {...base,preset,blocks:[block('paragraph',rtl?'السادة المحترمون،':'Dear Sir / Madam,'),block('paragraph',''),block('paragraph',rtl?'وتفضلوا بقبول فائق الاحترام.':'Sincerely,')]};\n  if(preset==='letter-of-intent')return {...base,preset,subject:rtl?'خطاب نوايا':'Letter of Intent',blocks:[block('paragraph',rtl?'السادة المحترمون،':'Dear Sir / Madam,'),block('paragraph',''),block('paragraph',rtl?'وتفضلوا بقبول فائق الاحترام.':'Sincerely,')]};\n  if(preset==='memo')")

          replace_once('src/components/DraftDocumentEditor.tsx',
              "import type { CompanySettings, LetterBlock, LetterDocumentData, LourexDocument } from '../types.js';",
              "import type { CompanySettings, LetterBlock, LetterDocumentData, LourexDocument, TemplateId } from '../types.js';")
          replace_once('src/components/DraftDocumentEditor.tsx',
              "import { DraftDocumentRenderer } from './DraftDocumentRenderer.js';",
              "import { DraftDocumentRenderer } from './DraftDocumentRenderer.js';\nimport { TemplateThumbnails } from '../templates/TemplateThumbnails.js';")

          p=Path('src/components/DraftDocumentEditor.tsx')
          text=p.read_text()
          pattern=r"type DraftPdfDesign='executive'\|'minimal'\|'commercial'\|'official';\nconst DRAFT_PDF_DESIGNS:[\s\S]*?\n\];\n"
          replacement="""const DRAFT_PURPOSES:Array<{id:LetterDocumentData['preset'];nameEn:string;nameAr:string;descriptionEn:string;descriptionAr:string}>=[
            {id:'blank',nameEn:'Blank Page',nameAr:'صفحة حرة',descriptionEn:'Start with a clean company page.',descriptionAr:'ابدأ بصفحة شركة نظيفة.'},
            {id:'company-letter',nameEn:'Company Letter',nameAr:'خطاب شركة',descriptionEn:'General external company correspondence.',descriptionAr:'مراسلات الشركة الخارجية العامة.'},
            {id:'letter-of-intent',nameEn:'Letter of Intent',nameAr:'خطاب نوايا',descriptionEn:'Intent, sourcing and commercial-interest letters.',descriptionAr:'خطابات النوايا والتوريد والاهتمام التجاري.'},
            {id:'formal-letter',nameEn:'Formal Letter',nameAr:'خطاب رسمي',descriptionEn:'Recipient, subject and formal closing.',descriptionAr:'مستلم وموضوع وخاتمة رسمية.'},
            {id:'memo',nameEn:'Memo',nameAr:'مذكرة',descriptionEn:'Structured internal company memo.',descriptionAr:'مذكرة داخلية منظمة.'},
            {id:'notice',nameEn:'Notice',nameAr:'إشعار',descriptionEn:'Clear official company announcement.',descriptionAr:'إشعار شركة رسمي وواضح.'}
          ];
          const draftPurposeLabel=(preset:LetterDocumentData['preset'])=>DRAFT_PURPOSES.find(item=>item.id===preset)??DRAFT_PURPOSES[0]!;
          """
          text,n=re.subn(pattern,replacement,text,count=1)
          if n!=1: raise SystemExit('draft design declaration target missing')
          p.write_text(text)

          replace_once('src/components/DraftDocumentEditor.tsx',
              "  private applyPdfDesign=(id:DraftPdfDesign)=>{const design=DRAFT_PDF_DESIGNS.find(item=>item.id===id);if(design)this.patchLetter(design.settings);};\n  private activePdfDesign=(letter:LetterDocumentData):DraftPdfDesign|null=>DRAFT_PDF_DESIGNS.find(design=>Object.entries(design.settings).every(([key,value])=>letter[key as keyof LetterDocumentData]===value))?.id??null;",
              "  private setTemplate=(id:TemplateId)=>this.mutate(doc=>({...doc,appearance:{...doc.appearance,templateId:id}}));")

          p=Path('src/components/DraftDocumentEditor.tsx')
          text=p.read_text()
          pattern=r'        <section className="draft-control-section draft-pdf-design-section">[\s\S]*?</section>\n        <section className="draft-control-section">'
          replacement='''        <section className="draft-control-section draft-pdf-design-section"><div className="draft-section-heading"><span>PDF</span><div><h2>{t('Document design templates','قوالب تصميم المستند')}</h2><p>{t('Use the same 18 premium visual identities available to quotations and invoices, adapted to company-letter content.','استخدم نفس 18 هوية تصميم فاخرة المتاحة لعروض السعر والفواتير، لكن بمحتوى خطاب الشركة.')}</p></div></div><TemplateThumbnails document={d} onSelect={this.setTemplate}/></section>
        <section className="draft-control-section">'''
          text,n=re.subn(pattern,replacement,text,count=1)
          if n!=1: raise SystemExit('draft template section target missing')
          p.write_text(text)

          p=Path('src/components/DraftDocumentEditor.tsx')
          text=p.read_text()
          pattern=r'<div className="draft-preset-grid">\{\(\[\x27blank\x27,[\s\S]*?</div><div className="form-grid two">'
          replacement='''<div className="draft-preset-grid draft-purpose-grid">{DRAFT_PURPOSES.map(purpose=><button type="button" key={purpose.id} className={letter.preset===purpose.id?'active':''} onClick={()=>this.applyPreset(purpose.id)}><strong>{t(purpose.nameEn,purpose.nameAr)}</strong><span>{t(purpose.descriptionEn,purpose.descriptionAr)}</span></button>)}</div><div className="form-grid two">'''
          text,n=re.subn(pattern,replacement,text,count=1)
          if n!=1: raise SystemExit('draft purpose grid target missing')
          p.write_text(text)

          replace_once('src/components/DraftDocumentEditor.tsx',
              "<span>{t('Draft','مسودة')}</span></div><div className={`draft-save-state",
              "<span>{t(draftPurposeLabel(letter.preset).nameEn,draftPurposeLabel(letter.preset).nameAr)}</span></div><div className={`draft-save-state")
          replace_once('src/components/DraftDocumentEditor.tsx',
              "<header><strong>{t('Draft Preview','معاينة المسودة')}</strong><IconButton",
              "<header><strong>{t(draftPurposeLabel(letter.preset).nameEn,draftPurposeLabel(letter.preset).nameAr)}</strong><IconButton")

          p=Path('src/components/DraftDocumentRenderer.tsx')
          text=p.read_text()
          marker="function Block({block}:{block:LetterBlock}):any{"
          if text.count(marker)!=1: raise SystemExit('draft renderer Block marker missing')
          helper="""function DraftPurpose({doc,letter}:{doc:LourexDocument;letter:LetterDocumentData}):any{
            const labels:Record<LetterDocumentData['preset'],[string,string]>={blank:['Company Document','مستند شركة'],'company-letter':['Company Letter','خطاب شركة'],'letter-of-intent':['Letter of Intent','خطاب نوايا'],'formal-letter':['Formal Letter','خطاب رسمي'],memo:['Memo','مذكرة'],notice:['Notice','إشعار']};
            const [en,ar]=labels[letter.preset]??labels.blank;
            const title=doc.language==='ar'?ar:doc.language==='bilingual'?`${en} / ${ar}`:en;
            const subject=letter.subject.trim();
            const defaultSubject=letter.preset==='letter-of-intent'?(doc.language==='ar'?'خطاب نوايا':'Letter of Intent'):'';
            const detail=subject&&subject!==defaultSubject?subject:doc.number;
            return <section className="draft-document-purpose"><strong dir="auto">{title}</strong><span dir="auto">{detail}</span></section>;
          }

          """
          text=text.replace(marker,helper+marker,1)
          old="className={`invoice-page draft-letter-page page-${letter.pageStyle} header-${letter.headerStyle} footer-${letter.footerStyle} width-${letter.bodyWidth} ${compact?'compact-preview':''}`}"
          new="className={`invoice-page draft-letter-page template-${doc.appearance.templateId} lang-${doc.language} page-${letter.pageStyle} header-${letter.headerStyle} footer-${letter.footerStyle} width-${letter.bodyWidth} ${compact?'compact-preview':''}`}"
          if text.count(old)!=1: raise SystemExit('draft renderer class target missing')
          text=text.replace(old,new,1)
          old='<main className="letter-page-body">{pageIndex===0?<LetterMeta doc={doc} letter={letter}/>:<div className="letter-continuation"><span>{doc.number}</span></div>}'
          new='<main className="letter-page-body">{pageIndex===0?<><DraftPurpose doc={doc} letter={letter}/><LetterMeta doc={doc} letter={letter}/></>:<div className="letter-continuation"><span>{doc.number}</span></div>}'
          if text.count(old)!=1: raise SystemExit('draft renderer first-page target missing')
          p.write_text(text.replace(old,new,1))
          PY

          git diff --check
          git diff -- src/types.ts src/lib/document-extras.ts src/components/DraftDocumentEditor.tsx src/components/DraftDocumentRenderer.tsx

      - name: Commit isolated v365 patch
        shell: bash
        run: |
          git config user.name "lourex-v365-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types.ts src/lib/document-extras.ts src/components/DraftDocumentEditor.tsx src/components/DraftDocumentRenderer.tsx
          git diff --cached --check
          git commit -m "v365 unify Draft templates and document purposes"
          git push origin HEAD:fix/v365-mobile-editor-scroll-draft-templates
