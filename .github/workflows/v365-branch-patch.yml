name: v365 isolated branch patch

on:
  push:
    branches:
      - fix/v365-mobile-editor-scroll-draft-templates
    paths:
      - .github/workflows/v365-branch-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v365-mobile-editor-scroll-draft-templates
          fetch-depth: 0
      - name: Patch Draft editor only
        run: python scripts/v365-patch-draft-editor.py
      - name: Verify scope and commit
        run: |
          git diff --check
          git diff -- src/components/DraftDocumentEditor.tsx
          test -n "$(git status --porcelain src/components/DraftDocumentEditor.tsx)"
          git config user.name "lourex-v365-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/DraftDocumentEditor.tsx
          git commit -m "v365 use shared templates in Draft Studio"
          git push origin HEAD:fix/v365-mobile-editor-scroll-draft-templates
