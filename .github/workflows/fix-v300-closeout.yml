name: LOUREX v300 closeout

on:
  push:
    branches:
      - feature/home-clean-rebuild-v284
    paths:
      - scripts/fix-v300-closeout.mjs
      - .github/workflows/fix-v300-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply v300 closeout
        run: node scripts/fix-v300-closeout.mjs
      - name: Repair generated regression assertion
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const path='tests/v300-purchase-order-attachments-pin.test.mjs';
          let text=await readFile(path,'utf8');
          const bad="assert.match(template,/doc.kind==='purchase-order'?'Buyer / From':'Seller / From'/);";
          const good="assert.ok(template.includes(\"doc.kind==='purchase-order'?'Buyer / From':'Seller / From'\"));";
          if(!text.includes(bad))throw new Error('Expected generated PO template assertion was not found.');
          text=text.replace(bad,good);
          await writeFile(path,text,'utf8');
          NODE
      - name: Typecheck
        run: npm run typecheck
      - name: Focused v300 regression
        run: node --test tests/v300-purchase-order-attachments-pin.test.mjs
      - name: Diff safety check
        run: git diff --check
      - name: Commit closeout
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "LOUREX v300 automation"
          git config user.email "actions@users.noreply.github.com"
          git add src tests
          git commit -m "fix: close purchase-order attachment and login PIN gaps v300"
          git push origin HEAD:feature/home-clean-rebuild-v284
