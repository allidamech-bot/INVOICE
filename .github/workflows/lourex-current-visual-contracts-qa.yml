name: LOUREX Current Visual Contracts QA
on:
  push:
    branches:
      - fix/qa-visual-current-owners-20261010
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: node --test tests/v484-responsive-visual-hierarchy.test.mjs tests/v485-visible-ui-corrections.test.mjs
      - run: node --test --test-concurrency=2 tests/*.test.mjs
