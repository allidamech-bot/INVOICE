name: LOUREX Accounting Integration QA
on:
  push:
    branches:
      - fix/audit-accounting-integrated-20261009
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Locked install
        run: npm ci --no-audit --no-fund
      - name: TypeScript validation
        run: npm run typecheck
      - name: Production build (no deployment)
        run: npm run build
      - name: Supplier history, void, treasury and scoped planning tests
        run: |
          node --test --test-concurrency=2 tests/audit-inventory-planning-scope.test.mjs tests/audit-supplier-payables-asof.test.mjs tests/audit-supplier-payment-void-merge.test.mjs tests/audit-treasury-void-history.test.mjs tests/audit-treasury-reconciliation-history.test.mjs tests/accounts-payable-batch9.test.mjs
      - name: Entire historical test suite, no exclusions
        run: node --test --test-concurrency=2 tests/*.test.mjs

      - name: Compare every failing test against unchanged main
        if: always()
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 tests/*.test.mjs >/tmp/lourex-candidate.log 2>&1 || true
          git fetch --no-tags origin main
          git worktree add --detach /tmp/lourex-main FETCH_HEAD
          (
            cd /tmp/lourex-main
            npm ci --no-audit --no-fund
            npm run build
            node --test --test-concurrency=2 tests/*.test.mjs >/tmp/lourex-main.log 2>&1 || true
          )
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const getFailures=path=>{
            const s=fs.readFileSync(path,'utf8');
            const ix=s.lastIndexOf('✖ failing tests:');
            if(ix<0)throw Error('Missing test failure summary: '+path);
            return new Set(s.slice(ix).split('\n').filter(x=>x.startsWith('✖ ')).map(x=>x.replace(/ \([\d.]+ms\)$/,'')));
          };
          const readNum=(text,key)=>Number(text.match(new RegExp('ℹ '+key+' (\\d+)'))?.[1]??-1);
          const original=fs.readFileSync('/tmp/lourex-main.log','utf8');
          const candidate=fs.readFileSync('/tmp/lourex-candidate.log','utf8');
          const baseline=getFailures('/tmp/lourex-main.log');
          const current=getFailures('/tmp/lourex-candidate.log');
          const newlyFailing=[...current].filter(x=>!baseline.has(x));
          const message=[
            '### Full-suite regression differential (none waived)',
            'main: '+readNum(original,'pass')+' pass / '+readNum(original,'fail')+' fail',
            'candidate: '+readNum(candidate,'pass')+' pass / '+readNum(candidate,'fail')+' fail',
            'New failures: '+newlyFailing.length,
            ...newlyFailing.slice(0,50)
          ].join('\n');
          console.log(message);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,message+'\n');
          if(newlyFailing.length)process.exit(1);
          NODE
