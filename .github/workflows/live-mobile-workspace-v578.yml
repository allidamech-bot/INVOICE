name: LOUREX Live Mobile Workspace QA

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tests/visual/run-live-mobile-workspace-production-v578.cjs'
      - '.github/workflows/live-mobile-workspace-v578.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-mobile-workspace:
    name: Production WebKit iPhone + iPad sweep
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install WebKit QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Live Production mobile workspace sweep
        run: node tests/visual/run-live-mobile-workspace-production-v578.cjs
      - name: Upload mobile evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lourex-live-mobile-workspace-v578
          path: visual-qa-output/live-mobile-workspace-v578
          if-no-files-found: warn
