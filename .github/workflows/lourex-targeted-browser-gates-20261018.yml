name: LOUREX Targeted Browser Gate Remediation

on:
  pull_request:
    branches:
      - qa/integration-f001-f002-keyboard-797-20261018
    paths:
      - 'tests/visual/**'
      - '.github/workflows/lourex-targeted-browser-gates-20261018.yml'

permissions:
  contents: read

concurrency:
  group: lourex-targeted-browser-${{ github.event.pull_request.number }}-${{ matrix.shard }}
  cancel-in-progress: true

jobs:
  focused-acceptance:
    name: Node 24 / focused 10 browser suites / shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [presentation, business]
    steps:
      - name: Check out branch snapshot without persist credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify source security and build exact runtime
        run: |
          npm audit --audit-level=high
          node scripts/security-check.mjs
          npm run typecheck
          npm run build
          node --test tests/local-verification-no-actions.test.mjs
      - name: Install browser QA
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Run original failing regression suites without exclusions
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/http-server/bin/http-server . -p 4173 -c-1 > "${RUNNER_TEMP}/lourex-targeted-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/tests/visual/obsidian-editor.html >/dev/null; then break; fi
            sleep 1
          done
          if [[ "${{ matrix.shard }}" == "presentation" ]]; then
            suites=(
              tests/visual/run-v337-create-center.cjs
              tests/visual/run-premium-auth-gateway-v187.cjs
              tests/visual/run-v326-business-workspaces.cjs
              tests/visual/run-obsidian-settings.cjs
              tests/visual/run-notification-recovery-batch3.cjs
            )
          else
            suites=(
              tests/visual/run-v364-core-workflows.cjs
              tests/visual/run-functional-editor-controls-v201.cjs
              tests/visual/run-import-final-audit-v267.cjs
              tests/visual/run-contextual-ai-batch4.cjs
              tests/visual/run-commercial-completion-batch6.cjs
            )
          fi
          failures=0
          for test in "${suites[@]}"; do
            echo "::group::RUN ${test}"
            if node "${test}"; then echo "PASS ${test}"; else echo "FAIL ${test}"; failures=$((failures+1)); fi
            echo "::endgroup::"
          done
          if ((failures>0)); then
            echo "Targeted acceptance rejected: ${failures} suite(s) failed"
            exit 1
          fi
          echo "Targeted acceptance PASS: ${#suites[@]} original mandatory suites"
