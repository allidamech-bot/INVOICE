name: Final hardening domain integration
on:
  push:
    branches: [feat/lourex-roadmap-hardening-final]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/lourex-roadmap-hardening-final
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Apply v21 domain patch
        run: |
          python3 scripts/apply-roadmap-hardening-domain.py
          python3 scripts/fix-hardening-typecheck.py
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit verified v21 domain integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types.ts src/lib/defaults.ts src/lib/workspaces.ts src/storage/vault.ts src/storage/vault-merge.ts src/lib/operations.ts src/lib/profitability-dimensions.ts src/components/FxPage.tsx src/components/TreasuryPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(hardening): integrate v21 treasury FX and warehouse domains"
          git push origin HEAD:feat/lourex-roadmap-hardening-final
