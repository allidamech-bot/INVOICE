name: LOUREX Quote Editor Final Lifecycle

on:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'src/components/EditorPage.tsx'
      - 'src/components/EditorPageCore.tsx'
      - 'src/components/DocumentReviewModal.tsx'
      - 'public/editor-stability-v338.js'
      - 'scripts/v485-bundle-visible-ui.mjs'
      - 'scripts/v529-document-autosave-checkpoint-fix.mjs'
      - 'scripts/v539-editor-departure-single-owner.mjs'
      - 'tests/batch5-editor-visual-flattening.test.mjs'
      - 'tests/quote-editor-final-lifecycle-v538.test.mjs'
      - 'tests/visual/v538-quote-editor-final-flow.html'
      - 'tests/visual/run-v538-quote-editor-final-flow.cjs'
      - '.github/workflows/quote-editor-final-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quote-editor-final-lifecycle:
    name: iPhone/iPad WebKit quote lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: LOUREX static security gate
        run: node scripts/security-check.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Final lifecycle contract
        run: node --test tests/quote-editor-final-lifecycle-v538.test.mjs
      - name: Install WebKit QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Run final quote lifecycle on iPhone and iPad WebKit
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/lourex-v538-quote-editor.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/tests/visual/v538-quote-editor-final-flow.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lourex-v538-quote-editor.log
            exit 1
          fi
          node tests/visual/run-v538-quote-editor-final-flow.cjs
      - name: Upload final lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lourex-v538-quote-editor-final-flow
          path: visual-qa-output/v538-quote-editor-final-flow
          if-no-files-found: error
