name: Apply LOUREX v300 branch patch

on:
  push:
    branches:
      - feature/home-clean-rebuild-v284
    paths:
      - scripts/apply-v300.mjs
      - .github/workflows/apply-v300.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply deterministic v300 source patch
        run: node scripts/apply-v300.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Diff safety check
        run: git diff --check
      - name: Commit v300 implementation
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "LOUREX v300 automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html src tests
          git commit -m "feat: add purchase orders attachments and login PIN gate v300"
          git push origin HEAD:feature/home-clean-rebuild-v284
