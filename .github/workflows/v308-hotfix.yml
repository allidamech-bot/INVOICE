name: v308 print integration hotfix
on:
  push:
    branches: [feature/v308-watermark-draft-letterhead]
    paths: [scripts/v308-fix-app-print.mjs]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v308-watermark-draft-letterhead
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v308-fix-app-print.mjs
      - run: |
          rm -f scripts/v308-fix-app-print.mjs .github/workflows/v308-hotfix.yml
          git config user.name "allidamech-bot"
          git config user.email "228416871+allidamech-bot@users.noreply.github.com"
          git add -A
          git commit -m "fix(v308): correct draft print renderer integration"
          git push origin HEAD:feature/v308-watermark-draft-letterhead
