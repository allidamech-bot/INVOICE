name: Financial treasury long text print evidence
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/visual/run-treasury-report-long-text.cjs'
      - '.github/workflows/treasury-long-text-print.yml'
permissions:
  contents: read
concurrency:
  group: finance-treasury-long-${{ github.ref }}
  cancel-in-progress: true
jobs:
  treasury-long-text:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check tests/visual/run-treasury-report-long-text.cjs
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1 http-server@14.1.1
      - name: Long treasury labels, references and notes through actual report UI CSV and print
        shell: bash
        run: |
          node node_modules/http-server/bin/http-server . -p 4173 -c-1 > /tmp/lourex-long-treasury.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node --input-type=module -e 'let ready=false;for(let i=0;i<50;i++){try{const r=await fetch("http://127.0.0.1:4173/tests/visual/treasury-report-output.html");if(r.ok){ready=true;break;}}catch{}await new Promise(r=>setTimeout(r,100));}if(!ready)throw Error("Treasury fixture did not start");'
          node tests/visual/run-treasury-report-long-text.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treasury-long-text-pdfs
          path: visual-qa-output/treasury-long-text/
          retention-days: 7
