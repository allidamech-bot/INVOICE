name: Apply v138 Hardening

on:
  push:
    branches:
      - agent/hardening-post-batch-1-8

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/hardening-post-batch-1-8
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: node scripts/prepare-hardening-helper.mjs
      - run: node scripts/apply-hardening-v138.mjs
      - run: node scripts/post-hardening-v138.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden accounting invariants after batches 1-8"
          git push origin HEAD:agent/hardening-post-batch-1-8
