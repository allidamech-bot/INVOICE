name: LOUREX Combined Contract Rerun
on:
  push:
    branches:
      - fix/combined-final-qa-20261010
      - audit/combined-final-qa-20261010
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Locked install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build locally without deployment
        run: npm run build
      - name: Focused contract migration and security
        run: node --test tests/v320-release-contract.test.mjs tests/system-ui-ux-v144.test.mjs tests/v326-access-surfaces.test.mjs tests/logo-rebuild-v49.test.mjs tests/foundation-hardening-v120.test.mjs tests/v302-real-pin-doc-entry.test.mjs
      - name: Full historical suite no skips
        run: node --test --test-concurrency=2 tests/*.test.mjs
