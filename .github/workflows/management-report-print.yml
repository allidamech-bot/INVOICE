name: Management report native PDF
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/styles/tailadmin-finance-workspaces-v320.css'
      - 'src/components/ReportsPage.tsx'
      - 'tests/visual/management-report-print.html'
      - 'tests/visual/run-management-report-print.cjs'
      - '.github/workflows/management-report-print.yml'
permissions:
  contents: read
concurrency:
  group: management-report-print-${{ github.ref }}
  cancel-in-progress: true
jobs:
  report-pdf:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Financial report and output contracts
        run: node --test tests/reports-v135.test.mjs tests/reports-v135-shell.test.mjs tests/reports-locale-v237.test.mjs tests/financial-output-parity-v559.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1 http-server@14.1.1
      - name: Actual report browser and native PDF acceptance
        shell: bash
        run: |
          node node_modules/http-server/bin/http-server . -p 4173 -c-1 > /tmp/lourex-report-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node --input-type=module -e 'let ready=false;for(let i=0;i<50;i++){try{const r=await fetch("http://127.0.0.1:4173/tests/visual/management-report-print.html");if(r.ok){ready=true;break;}}catch{}await new Promise(r=>setTimeout(r,100));}if(!ready)throw Error("Management report fixture did not start");'
          node tests/visual/run-management-report-print.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: management-report-native-pdf
          path: visual-qa-output/management-report-print/
          retention-days: 7
